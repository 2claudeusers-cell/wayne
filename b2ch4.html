<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>115 高二歷史百題 B2Ch4 互動練習</title>
<style>
:root{
  --bg:#f5f2ea; --card:#fffdf8; --ink:#1f2a2b; --muted:#6b7473; --line:#e2dccf;
  --accent:#1f6f6a; --accent-soft:#e1efed; --ok:#2e7d4f; --ok-soft:#e3f2e8;
  --bad:#b5402f; --bad-soft:#f8e4e0; --warn:#a8741a; --warn-soft:#f7ecd6;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#161b1b;--card:#1f2626;--ink:#e8ebe9;--muted:#9aa5a3;--line:#323b3a;
    --accent:#5fb8b0;--accent-soft:#1f3634;--ok:#6cc48f;--ok-soft:#1d3326;--bad:#e07a69;--bad-soft:#3a2420;--warn:#e0b25a;--warn-soft:#3a3020;}
  .fig img,.optimg img,.expfig img{filter:invert(.9) hue-rotate(180deg);background:#fff}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.75;font-size:16px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:860px;margin:0 auto;padding:12px 18px 10px}
h1{font-size:19px;margin:0;letter-spacing:.02em}
h1 small{font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}
.stats{display:flex;gap:16px;align-items:center;font-size:14px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
nav button,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:4px 12px;border-radius:999px;cursor:pointer}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.tools{margin-left:auto;display:flex;gap:6px}
main{max-width:860px;margin:0 auto;padding:18px 18px 80px}
.sec{font-size:15px;font-weight:700;color:var(--accent);margin:28px 0 10px;letter-spacing:.1em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 16px}
.qn{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;padding:0 8px;border-radius:7px;
  background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;margin-right:8px;vertical-align:1px}
.stem{margin-bottom:6px}
.sub{border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
.sub:first-of-type{border-top:none;margin-top:4px;padding-top:4px}
.single .sub{border-top:none;margin-top:0;padding-top:0}
.lab{font-weight:700;color:var(--accent);margin-right:4px}
.figs{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.fig{margin:10px 0;text-align:center}
.figs .fig{margin:0;flex:1 1 220px;max-width:100%}
.figs.small .fig{flex:0 1 150px}
.fig img,.expfig img{max-width:100%;max-height:420px;border-radius:6px;cursor:zoom-in;border:1px solid var(--line);background:#fff}
.cap{font-size:13px;color:var(--muted);margin-top:2px}
.opts{display:grid;gap:8px;margin-top:10px}
.opts.img{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;width:100%;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:10px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.6}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)} .opt.sel .k{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.miss{border-color:var(--ok);border-style:dashed} .opt.miss .k{border-color:var(--ok);color:var(--ok)}
.k.sq{border-radius:6px!important}
.mtag{display:inline-block;font-size:12px;background:var(--warn-soft);color:var(--warn);border-radius:5px;padding:0 6px;margin-right:6px;vertical-align:2px}
.optimg img{max-width:100%;max-height:170px;object-fit:contain;display:block;margin:auto;border-radius:6px;background:#fff}
.opts.img .opt{flex-direction:column;align-items:stretch}
.fb{margin-top:12px;border-radius:10px;padding:12px 14px;font-size:15px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)} .fb.neutral{background:var(--accent-soft)}
.fb .v{font-weight:700;margin-bottom:4px}
.fb.ok .v{color:var(--ok)} .fb.bad .v{color:var(--bad)} .fb.neutral .v{color:var(--accent)}
.fb .ex{margin-top:6px;color:var(--ink)}
.fb .ex b{color:var(--muted);font-weight:600}
.rubric{margin-top:8px;font-size:14px;border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent);padding-top:8px}
.rl{display:flex;gap:10px}.rl b{flex:none;min-width:9.5em;color:var(--muted);font-weight:600}
.ansbox{background:var(--card);border-radius:8px;padding:8px 10px;margin:6px 0;border:1px solid var(--line)}
.field{display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.field label{flex:none;min-width:6.5em;font-size:14px;color:var(--muted);padding-top:7px}
textarea{width:100%;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--card);color:var(--ink);resize:vertical;min-height:40px}
textarea:focus{outline:none;border-color:var(--accent)}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.choice{font:inherit;font-size:15px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:5px 14px;border-radius:9px;cursor:pointer}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.self{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:14px;color:var(--muted)}
.self .btn.on-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.self .btn.on-part{background:var(--warn);border-color:var(--warn);color:#fff}
.self .btn.on-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.tb{border-collapse:collapse;margin:10px 0;font-size:14px;width:100%;display:block;overflow-x:auto}
.tb th,.tb td{border:1px solid var(--line);padding:5px 8px;vertical-align:top}
.tb th{background:var(--accent-soft);font-weight:600}
.expfig{margin-top:8px}
.pre{white-space:pre-wrap;margin:4px 0}
.figrow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin:8px 0}.figrow .fig{margin:0}
.inimg,.ex img,.ansbox img,.stem img,.sub img{max-width:100%;}
.inimg{display:block;margin:6px 0;max-height:520px;background:#fff;border-radius:6px;cursor:zoom-in}
.flag{height:44px;border:1px solid var(--line);display:block;margin:auto}
.note{font-size:13px;color:var(--muted);margin-top:4px}
.choice.imgc{padding:6px;flex:1 1 200px;max-width:280px}.choice.imgc img{width:100%;display:block;border-radius:6px;background:#fff}
.ansbox img{max-width:100%;max-height:420px;border-radius:6px;background:#fff;cursor:zoom-in}
.empty{text-align:center;color:var(--muted);padding:40px 0}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:20px}
#lb.on{display:flex} #lb img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}
.retry{font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;margin-left:auto;font-family:inherit}
@media (max-width:560px){.hwrap{padding:10px 12px}main{padding:12px 10px 60px}.card{padding:14px}.tools{margin-left:0;width:100%}.field{flex-direction:column;gap:2px}.field label{padding-top:0}}
.home{display:inline-block;font-size:13px;color:var(--accent);text-decoration:none;margin-bottom:2px}.home:hover{text-decoration:underline}
</style>
</head>
