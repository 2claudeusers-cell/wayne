const EMBED=[{"sec": "一、單選題", "n": "1", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "清朝在 1880 年代先後派陳蘭彬和容閎分赴古巴和祕魯進行調查。陳蘭彬在報告中附有一千六百名華工的控訴狀，詳述雇主殘酷凌虐的事實。報告公布後，舉世震驚，國際輿論皆譴責古巴和祕魯虐待華工的行為，紛紛要求改善。請問此事件中被要求改善對華工待遇的應是哪一個國家？", "opts": ["西班牙", "葡萄牙", "荷蘭", "英國。"], "optImg": false, "ans": 0, "exp": "此題之解題關鍵為「1880 年時，古巴、祕魯是哪一個國家的殖民地？」古巴自從1511 年淪為西班牙殖民地後，直到 1898 年美西戰爭爆發後才割讓給美國，故當時的殖民母國是西班牙。祕魯則是在 16 世紀西班牙征服印加帝國後淪為殖民地，直至 1821 年才獨立。", "figs": [], "small": false}], "key": "1_1"}, {"sec": "一、單選題", "n": "2", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "日本在 1920 年代以降，先是發生 1923 年關東大地震，1929 年因世界經濟恐慌影響，「昭和恐慌」嚴重打擊農村，不論自耕農或佃農所得皆驟減。此外，1931 年日本東北地區因寒害而發生大凶年，農家販童時有所見，自殺者也增加，東北地區的農村受挫至深，人口過剩問題又浮現，並導致社會紛亂。日本政府為了解決高度的社會不安與人口過剩問題，除了提出「救農政策」為解決方案，還開始發展移民拓墾，使過多的農村勞動力得以安置。請問下列何處是主要地點？", "opts": ["臺灣", "朝鮮", "滿洲國", "北海道。"], "optImg": false, "ans": 2, "exp": "由 1931 年之後可判斷最相近的時間點是日本占領東北，成立滿洲國，於是政府主導組織開拓團，前往滿洲國進行大規模移民。", "figs": [], "small": false}], "key": "1_2"}, {"sec": "一、單選題", "n": "3", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "以下摘錄自清代東北朝鮮移民研究：「清政府在琿春設立招墾總局，促進招墾兼理朝鮮墾民，令朝鮮移民剃髮易服、『遵我國章、去其舊俗』，成為清國臣民。清政府將圖們江北岸長約 700 里、寬約 50 里地區劃為朝鮮族農民專墾區，便於朝鮮農民大批移入東北地區定居。」請判斷何者說明符合實際狀況？", "opts": ["題幹事件時間點，應該發生在 18 世紀初期", "上述事件後，引發朝鮮內部親中、親日之爭", "當時朝鮮移民常與日本拓墾團爆發激烈衝突", "清朝開放朝鮮移民的考量，與俄國擴張有關。"], "optImg": false, "ans": 3, "exp": "19 世紀中期以後，日本趁中國因內憂外患而無暇顧及時介入朝鮮內政，造成朝鮮社會嚴重動盪，不少人向外遷移；加上清廷為阻止俄國勢力在東北擴張，於是同意在此墾荒，甚而設立朝鮮移民專墾區，答案選(Ｄ)。(Ｂ)應是日本勢力介入後，朝鮮政治出現親中、親日派系鬥爭，造成社會動盪，才導致人民移動。(Ｃ)日本大規模向中國東北派出農業拓墾團，是在 1932 年日本成立滿洲國後。", "figs": [], "small": false}], "key": "1_3"}, {"sec": "一、單選題", "n": "4", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "以下是日本在 19 世紀中後期以來主要的對外移民地區，請問下列哪一組地區的日本移工，其從事的工作性質最為相似？", "opts": ["中國東北、中南美洲", "夏威夷、美國", "美國、中國東北", "夏威夷、中南美洲。"], "optImg": false, "ans": 3, "exp": "日本移工在夏威夷、中南美洲主要從事的是農業勞動，尤其是在甘蔗和咖啡種植園的工作。他們多數作為契約勞工，負責體力密集型的農業生產，故答案選(Ｄ)。(Ａ)中國東北的日本移工多參與工業、礦業或經商，從事的是技術性或與殖民政策相關的工作。(Ｂ)(Ｃ)在美國的日本移工的職業範圍較廣，早期多從事低技術的農業和勞力密集型工作，但後期逐漸涉足商業和服務業。", "figs": [], "small": false}], "key": "1_4"}, {"sec": "一、單選題", "n": "5", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "鴉片戰爭前後，持續四百多年的非洲黑奴貿易逐漸廢除，但是美洲的開發和東南亞熱帶種植園的發展仍需要大量的勞動力，使殖民地的勞動力供應更趨緊張。請問鴉片戰爭結束後，開啟華工出國高潮的歷史事件為何？", "opts": ["美國南北戰爭", "美國興建東西橫貫鐵路", "美西戰爭", "加州發現金礦。"], "optImg": false, "ans": 3, "exp": "鴉片戰爭發生於 1840 ～ 1842 年。(Ａ)(Ｂ)皆為 1860 年代的事件。(Ｃ)美西戰爭發生於 1898 年。(Ｄ)加州於 1848 年發現金礦，1850 年代起展開淘金熱潮。", "figs": [], "small": false}], "key": "1_5"}, {"sec": "一、單選題", "n": "6", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "美國的《排華法案》拒絕所有華人勞工於美國境外十年之久。其 1884 年修正案更強化了允許先前入境移民離開美國返回中國的規定，同時闡明，該法適用於所有華人，無論他們的國籍為何。1892 年，該法案延長十年，到 1902 年更被取消了時限。請問造成美國制訂《排華法案》的原因為何？", "opts": ["華工不適合美國文化", "美國經濟衰退，勞力過剩", "美國提出門戶開放政策", "美國經濟復甦，不需要華工。"], "optImg": false, "ans": 1, "exp": "(Ｂ)隨著美國經濟的衰退，對華工的憎恨逐漸加深，許多人將美國的不幸歸咎於華人苦力。", "figs": [], "small": false}], "key": "1_6"}, {"sec": "一、單選題", "n": "7", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "海外華人對於國家認同的彈性，可見於華人以根據血統主義為原則而獲得中國國籍時，大多數人又會在此基礎上再獲得一個外國國籍。對他們而言，國籍並不是「非此即彼」的選擇，完全可以「二者並存」。形式上的國籍只不過是一種外在的手段，僅是為了更方便在那個國家做生意。事實顯示，當時最有用的是獲得新興區域霸權──日本的國籍。請問當時的海外華人主要指涉下列哪一身分者？", "opts": ["勞力工作者", "留學生", "技術移民", "經商相關者。"], "optImg": false, "ans": 3, "exp": "19 世紀中期以後，中日航線皆對外開放通商，他們也在當地發展出血緣及地緣為基礎的商幫團體，從題文中的「為了更方便在那個國家做生意」，明顯可知為(Ｄ)經商相關者。", "figs": [], "small": false}], "key": "1_7"}, {"sec": "一、單選題", "n": "8", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "1923 年 9 月 1 日在日本發生關東大地震，不僅是木造房屋，就連鋼筋混凝土的房屋也遭到破壞。混亂中警察散布「朝鮮人要舉行暴動」的流言，隔天日本政府宣布東京與神奈川戒嚴，軍隊、警察和市民自發組織的自警團殺害了許多在日朝鮮人。當時正值第一次世界大戰後日本國內經濟不景氣，社會運動與工人運動高漲，內務大臣水野煉太郎和警視總監赤池濃曾鎮壓過朝鮮獨立運動，兩人利用此種偏見與歧視暴力舉動來轉移民間社會對政府的壓力。根據以上資料，請問下列敘述何者正確？", "opts": ["當時因爆發世界經濟大恐慌，才導致日本國內經濟不景氣", "文中所提朝鮮獨立運動指三一運動", "在日朝鮮人應屬非法偷渡移民性質", "關東大地震發生在明治天皇時期。"], "optImg": false, "ans": 1, "exp": "(Ａ) 1918 年一戰結束，關東大地震發生於 1923 年，經濟大恐慌則要等到 1929 年的美國華爾街股市崩盤開始，時間不符。(Ｃ)日本占領朝鮮後，兩地間往來更加便利，許多朝鮮移民前往日本尋找工作機會，因此不是非法偷渡。(Ｄ)應為大正民主時期。", "figs": [], "small": false}], "key": "1_8"}, {"sec": "一、單選題", "n": "9", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "影集《柏青哥》描述日治時期有許多朝鮮人移居日本，而後投入柏青哥（小鋼珠賭博遊戲）的事業，日本多數柏青哥店都由在日朝鮮人經營。《柏青哥》導演賈斯汀周（Justin Chon）便說：「對於移民至日本的韓國人來說，柏青哥就像是他們的性命，是他們存活的方式。」請問造成此現象的背景為何？", "opts": ["朝鮮商人發展日本貿易基礎", "基層勞動者受社會歧視", "朝鮮娛樂產業發達", "日本限制朝鮮人民行業別。"], "optImg": false, "ans": 1, "exp": "朝鮮人進入日本工作，大多從事基層勞動，亦受到日本當地人民排擠，備受歧視，導致三教九流的賭博行業──柏青哥發展時，有多數朝鮮人成為相關產業受雇者。", "figs": [], "small": false}], "key": "1_9"}, {"sec": "一、單選題", "n": "10", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "某地位於歐洲通往中國的航路上，早在 1819 年，英國商船便在此建立交易據點，逐漸發展成繁榮港口。二次世界大戰期間，日軍曾攻占此地，控制三年多。1945 年，日本投降，該地重歸英國管轄，但當地人民爭取自主，先脫離英國統治，進而獨立建國，這個國家是〔103.學測〕", "opts": ["泰國", "新加坡", "越南", "印度。"], "optImg": false, "ans": 1, "exp": "此地位於歐洲通往中國的航路上，應是麻六甲海峽周邊國家；而 19 世紀曾受英國管轄，在二次世界大戰時被日軍攻占，戰後此地人民脫離原國獨立，可知為 1965 年脫離馬來西亞而獨立的(Ｂ)新加坡。(Ａ)泰國在 19 世紀是獨立王國，非受英國管轄。(Ｃ)越南在 19世紀曾為法國的殖民地。(Ｄ)二次大戰期間，日本並未占領印度。", "figs": [], "small": false}], "key": "1_10"}, {"sec": "一、單選題", "n": "11", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "1906 ～ 1908 年擔任中國東北南滿鐵道株式會社總裁的後藤新平，曾提出日本在經營滿洲的策略方面，應採用「文裝的武備」方式，且強調藉重大規模移民的影響力。關於這位人物及後來日本的滿洲移民政策的說明，請問下列敘述何者正確？", "opts": ["南滿鐵道株式會社成立與甲午戰爭有關", "他任職總裁期間，正值關東軍成立滿洲國", "後來日本對滿洲的移民只限定於日籍人士", "關東軍主導的計畫移民明顯具有武裝性質。"], "optImg": false, "ans": 3, "exp": "(Ａ)日俄戰爭後，日本為了長久統治滿洲，起用有治臺經驗的後藤新平擔任南滿鐵道株式會社總裁。他提出以「文裝的武備」方式經營滿洲，參考治理臺灣的經驗，重視移民的力量。(Ｂ)滿洲國於 1931 年成立。(Ｃ)也有部分朝鮮人及少量的臺灣人。", "figs": [], "small": false}], "key": "1_11"}, {"sec": "一、單選題", "n": "12", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "某地的警察組成有歐籍、印度籍、華籍，以及特別從山東威海衛招募來的人員，分別以ABCD 編號。其中印度籍警察包著頭巾，華籍警察戴著三角形竹帽，穿綠色制服。當地孩童以「ABCD，大頭綠衣，追賊不到，吹嗶嗶！」來形容警察。這些孩童最可能是〔109.學測〕", "opts": ["在英國殖民統治香港時的華人小孩", "在德國轄下膠州灣生活的華人小孩", "在雅加達經商貿易的華僑家庭小孩", "在舊金山建造鐵路的華工家庭小孩。"], "optImg": false, "ans": 0, "exp": "在清末列強侵略中國的浪潮中，英國於 1898 年強行租借山東威海衛，藉以對抗俄國租借大連、旅順及德國租借膠州灣。因而某地的警察成員有歐籍、印度籍、華籍及從山東威海衛招募來的人員，可知該地應為英國領地，故答案以英國殖民地香港最為可能。", "figs": [], "small": false}], "key": "1_12"}, {"sec": "一、單選題", "n": "13", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "某一份華人海外發行的報紙，其特色為：「除日報照常刊送外，復不惜工本，從英國採辦釘書裁紙各機器，以待與各官商刊印書籍單件。並有英國各體活字及各式花邊等，延有西人挑印，工藝甚精。所有中西文字均能刷印，並有石板印字，大小機器均用精工刷印，工緻絕倫。前有文士書寫各體文字，現由上海購到各種書籍出售，其書目另行刊布，所有各項，價甚相宜。」請問這份報紙的發行地為何？", "opts": ["雅加達", "新加坡", "馬尼拉", "舊金山。"], "optImg": false, "ans": 1, "exp": "由題幹內容可知，這家報社從英國採購機器，及使用英國各體活字，故可推知此地應為英國之殖民地。(Ａ)荷蘭殖民地。(Ｃ)西班牙殖民地。(Ｄ)舊金山在美國。", "figs": [], "small": false}], "key": "1_13"}, {"sec": "一、單選題", "n": "14", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "以下四則資料分別介紹日本移民在不同地區的活動：資料一：這個地區的移民計畫與日本的國防戰略有關。由關東軍負責相關事務，遷來此地的日本移民具有武裝移民性質，開墾之外，還需接受軍事訓練。資料二：日本曾積極鼓勵國內移民前來此地發展，當時獲得總督府補助的移民，大部分屬於農業性質，但也有屬於其他產業性質的移民。資料三：日本政府透過東洋拓殖株式會社經營這個地區的移民事務，日本國內的移民遷來此地以後，再由會社提供他們耕作的土地。資料四：來到這個地區的日本移民，早期大多是在橡膠園與農場從事勞動，但是後來日本的商業移民逐漸取代日籍勞工。根據上述資料，請問下列的說明哪一項正確？", "opts": ["資料一、資料二與資料三的移民是屬於日本統治區的計畫性移民", "資料一與資料三的內容是在九一八事變後才開始出現的移民活動", "資料四與東南亞的日本移民有關，時間是在日軍占領東南亞以後", "資料二的移民與琉球有關，目的是為配合日本在當地的同化政策。"], "optImg": false, "ans": 0, "exp": "資料一：滿洲；資料二：臺灣；資料三：朝鮮；資料四：東南亞。(Ｂ)資料三的時間是在 1910 年日本兼併朝鮮以後。(Ｃ)在日本占領東南亞之前，已有日本移民前往東南亞。(Ｄ)資料二是描述前來臺灣的日本移民。", "figs": [], "small": false}], "key": "1_14"}, {"sec": "一、單選題", "n": "15", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "1970 年代，位於長崎，祖先曾創立泰益號的陳氏家族後代在整理老房子時，在閣樓發現了一批祖先留下來的商業文書，包含帳冊、書信、印章等文物。中研院臺史所檔案館於 2012 年將其中 100 箱史料打包，以船運回臺灣。請問《長崎泰益號文書》顯示了下列哪一歷史主題？", "opts": ["金門人赴日經商", "中國商幫的發展", "東南亞商業活動", "明代的海外移民。"], "optImg": false, "ans": 0, "exp": "(Ｂ)金門人陳國樑是在長崎發跡，並非中國商幫。(Ｃ)日本並非屬於東南亞的範疇。(Ｄ)應是清代的海外移民。", "figs": [], "small": false}], "key": "1_15"}, {"sec": "一、單選題", "n": "16", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "蘇門答臘的棉蘭張家與臺灣板橋林家曾結為姻親，嫁入板橋林家的張福英曾把兩家的故事寫進其回憶錄──《娘惹回憶錄》，其夫君林景仁在臺灣漢詩中有許多作品是描寫南洋的相關詩作，兩人後代多定居於新加坡與檳城。張福英的伯父張煜南擔任廣東故鄉梅縣潮汕鐵路的董事長，1900 年代正值清廷提倡興業救國熱潮，清廷積極招募華商回中國進行建設。潮汕鐵路因此成為列強角力競技場，日本藉由南進基地臺灣推行南支南洋政策，積極介入潮汕鐵路的興築，板橋林家也在此背景下涉入其中，形成林家與張家聯姻的契機。根據題文內容，請問下列分析何者正確？", "opts": ["日本此時亦在滿洲國興建鐵路", "板橋林家效力於清廷的興業救國政策", "張福英應為馬來西亞土生華人，故回憶錄取名為「娘惹」", "張福英與林景仁的婚姻應與潮汕鐵路中的華商人脈網絡有關。"], "optImg": false, "ans": 3, "exp": "棉蘭張家應為廣東梅縣客家人移居印尼發展的華商，題文中提到興業救國熱潮與日本南支南洋政策角力，因而間接促成板橋林家與張煜南的人脈網絡，進而可推斷應與聯姻有關。(Ａ)日本要等到 1932 年才會扶植滿洲國，與題文所提年代不符。(Ｂ)板橋林家當時屬於日本國民，應效力於日本殖民母國的南支政策。(Ｃ)張福英應為印尼土生華人，棉蘭是現今印尼蘇門答臘最大城。", "figs": [], "small": false}], "key": "1_16"}, {"sec": "一、單選題", "n": "17", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "1862 年，朝鮮發生農民起義，亂事逐漸往北擴展。大批朝鮮災民紛紛越界遷入圖們江和鴨綠江北岸。1879 年，鴨綠江北岸的朝鮮人已達 8,722 戶，37,000 餘人。1875 年，清政府解除了對鴨綠江流域的封禁；1881 年，在琿春設立招墾總局，並把圖們江以北長 700 公里、寬 45公里的地區劃為朝鮮移民專墾區。19 世紀末 20 世紀初，清政府開始設置越墾局，加強對朝鮮墾民的管理。通過「薙髮易服」、領照納租，朝鮮墾民可以獲得土地所有權。請問清政府解除鴨綠江封禁、招募朝鮮移民移墾的原因為何？", "opts": ["開發東北的資源", "阻止俄國的入侵", "解決藩屬國危機", "阻止日本的入侵。"], "optImg": false, "ans": 1, "exp": "1860 年，清政府與俄國簽訂《北京條約》，割讓東北一百多萬平方公里的土地，因此，清廷解除對東北的封禁，鼓勵人民移入開墾，以防止東北落入俄國的手中。", "figs": [], "small": false}], "key": "1_17"}, {"sec": "一、單選題", "n": "18", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "閱讀下列資料：資料一：這個組織的成員多為破產農民、漁夫、船夫、走私鹽販與游手好閒之徒。在鴉片戰爭後，他們的武裝勢力日益成長，游擊戰法可謂他們的戰術特色。資料二：1853 年太平軍北伐經過皖、豫，其徒眾紛紛響應。1857 年更接受太平天國領導。及至太平天國覆滅後，部分太平軍又與之合流。請問上述資料所描述的內容應與何者有關？", "opts": ["川楚教亂", "捻亂", "天地會", "回變。"], "optImg": false, "ans": 1, "exp": "「捻」原是安徽、河南一帶遊民，撚紙作法為人消災以牟利，後演變成勒索、恐嚇。1853 年（咸豐 3 年），太平軍北伐，捻已響應；後來發生黃河水患，災民入捻者眾，捻遂大起。太平天國覆亡後，餘眾與捻軍合流，並採取游擊戰，此時的捻亂是太平天國之亂的延長。", "figs": [], "small": false}], "key": "1_18"}, {"sec": "一、單選題", "n": "19", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "18 世紀，清朝一位皇帝對該朝首都地理形勢描述：「右擁太行左滄海，南襟河濟北居庸。會通帶內遼海外，雲帆可轉東吳粳（稻米）。」19 世紀下半葉，「雲帆可轉東吳粳」的情況則有大幅改變，造成此一改變的最主要原因為何？〔108.學測〕", "opts": ["美洲作物引進", "鐵路運輸興起", "捻亂破壞航路", "海運取代漕運。"], "optImg": false, "ans": 3, "exp": "此題文來源為「乾隆御製碑碑文．帝都篇」，描述歷代首都的地理局勢，其中描寫北京之段落為：「右擁太行左滄海，南襟河濟北居庸。會通帶內遼海外，雲帆可轉東吳粳。」含意是：北京左邊被滄海環繞，右邊是太行山，北面鄰接居庸關，南邊與黃河濟水相接。對外可連結遼海，而且帆船經由「京杭大運河」可以把位於東吳的稻米轉運來此。在近代海運和現代陸路交通興起以前，「京杭大運河」的貨物運輸量曾占全國的 3∕4。但是在 19 世紀下半葉時，許多河道淤積難行，只好改走海運；同時輪船也開始在沿海航行，故「雲帆可轉東吳粳」的情況才會因此大幅改變，由海運取代漕運，故選(Ｄ)。(Ａ)東吳稻米的轉運與美洲作物的引進無關。(Ｂ) 19 世紀下半葉，中國在南方並未有向北方鐵路通行（津浦鐵路在1912 年才全面通車）。(Ｃ)主要影響運河航行的是太平天國之亂，並非捻亂。", "figs": [], "small": false}], "key": "1_19"}, {"sec": "一、單選題", "n": "20", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "請參見附圖，可看到有一個族群的遷移痕跡，他們在 19 世紀中葉進行了大規模地遷徙。請問這場遷徙的背景，與下列何者有關？<div class='fig'><img data-src='f-005-0.png'></div>", "opts": ["經濟動機：謀求工作機會", "政治動機：顛覆原有政權", "信仰動機：擴大傳教範圍", "社會動機：文化習慣衝突。"], "optImg": false, "ans": 3, "exp": "此為陝甘回變後回民的遷徙。回變爆發的原因，是回民與漢人在生活習慣、宗教差異有關。(Ａ)謀求工作非主要原因。(Ｂ)陝甘回變曾建立地方獨立政權，後被清朝平定。不少回民不願受到清廷統治或是避免與漢人衝突，於是往中亞一帶遷移。(Ｃ)主要是宗教差異，而非回民擴張伊斯蘭教。", "figs": [], "small": false}], "key": "1_20"}, {"sec": "一、單選題", "n": "21", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "新加坡總理李光耀曾說：「沒有這段經歷，我就不可能了解政府的作用，也無法了解權力是進行徹底改革的工具。嚴懲不貸，使犯罪活動幾乎絕跡。有人認為刑罰減少不了犯罪，主張懲罰罪犯應該從寬，我從不相信這一套，這不符合我從戰前到戰後的經驗。」請問李光耀所說的「這段經驗」為何？", "opts": ["日軍占領", "英國殖民", "華人移民", "星馬分離。"], "optImg": false, "ans": 0, "exp": "第二次世界大戰期間，日軍占領新加坡，讓李光耀了解權力及政府的重要性，日本的殘酷統治讓李光耀體會政治威權對秩序的影響力。", "figs": [], "small": false}], "key": "1_21"}, {"sec": "一、單選題", "n": "22", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "某地區的華人移民，由於教會通融，華人基督徒較能進行祖先崇拜等中國傳統信仰。部分華人基督徒將基督宗教信仰與傳統華人的佛教、道教信仰融合在一起。請問這是哪一地區華人移民的現象？", "opts": ["新加坡", "印尼", "馬來西亞", "菲律賓。"], "optImg": false, "ans": 3, "exp": "由於西班牙殖民時期的菲律賓信仰天主教，華人改信天主教的甚多，天主教會對祖先崇拜較為通融，故產生菲律賓華人的特殊宗教信仰。", "figs": [], "small": false}], "key": "1_22"}, {"sec": "一、單選題", "n": "23", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "清代蘇、常地區進士人數盛多，科名顯赫者亦不少，此一情況並非出於偶然，而是有其深刻地域、歷史文化根源。促成蘇常社會科甲盛況的因素，包括地方文化發達、當地官員的重視、地方教育的推動與重視、安定的社會環境、印刷出版業興盛，藏書豐富、人口整體素質高等。清前期和中期，蘇、常區域社會環境相較之下一直比較穩定，但 19 世紀中葉期間短暫走向低谷。請問蘇、常地區於 19 世紀所面臨的低谷，與下列何者有關？", "opts": ["開港通商經濟重心移往東南沿海", "天災引發黃河水患造成人口遷徙", "政府移動人口遷徙至湖廣", "宗教勢力活動引發動盪。"], "optImg": false, "ans": 3, "exp": "太平天國在 19 世紀爆發，造成江蘇、浙江、安徽造成大規模動盪。(Ａ)開港通商，屬江蘇省的上海也在開放之列。(Ｂ)引發捻亂，主要影響在安徽、河南一帶。(Ｃ)「江西填湖廣」發生於明代。", "figs": [], "small": false}], "key": "1_23"}, {"sec": "一、單選題", "n": "24", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "以下兩段文字介紹，請於閱讀後判斷何者說明為是：資料一：摘錄自歷史學者王文隆文字：「謝介石生於光緒 4 年（1878）竹塹，上過私塾。割臺後，在新竹國語傳習所學習日文，畢業即至公學校任教，數月後轉任通譯。受新竹知事新井勉器重，轉往東京任東洋協會學校講師，同時就讀明治大學。光緒末，西渡中國，1916 年放棄日本籍，入籍中華民國。『九一八事變』後，轉往東北，任吉林交涉署署長。1932 年改籍滿洲國，任外交總長、協和會事務局長，成為溥儀與日人橋梁，曾出使日本。『七七事變』後，選擇退隱至戰爭結束，卻以漢奸罪名被逮捕，1954 年病逝北京。」資料二：摘錄自高中歷史課本文字：「日本控制滿洲後，不少臺灣人前往經商、留學，甚至移居當地，其中以曾擔任滿洲國外交總長的謝介石最為著名。」", "opts": ["兩則資料均表達謝介石協助二戰期間日本政府，對中國進行侵略", "兩則資料均突顯謝介石在滿洲國成立之後，由臺灣前往當地謀職", "兩則資料對謝介石敘述一致，均說明日本統治下的臺人工作狀況", "兩則資料對謝介石前往滿洲國任職過程說明，呈現狀況並未一致。"], "optImg": false, "ans": 3, "exp": "資料一詳細說明謝介石早在光緒末年就離開臺灣，1916 年入籍中華民國，九一八事變後才轉往東北；資料二則將他歸類為「日本控制滿洲後，臺灣人前往當地」的群體，暗示他是從臺灣直接前往。資料二相較於資料一內容，明顯簡化謝介石前往滿洲國的任職經過，忽視謝介石曾經由日本籍，歸化為中華民國、滿洲國等國籍歷程，單自資料二來看，容易錯誤判斷為，謝介石是在滿洲國成立之後，受聘前往當地任職。故兩則資料對謝介石前往滿洲國的過程說明確實呈現不一致的狀況，答案選(Ｄ)。", "figs": [], "small": false}], "key": "1_24"}, {"sec": "一、單選題", "n": "25", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "日本占領殖民某一地區後，對待當地原有居民的方式，常以「匪情惡化」為由，強迫原居民遷離，使其成為「無人地帶」，強制收購土地後再將招募到的開拓團成員移往開墾。這樣的作法造成了移民與原本住民的嚴重對立，使雙方少有彼此交流或同化。請問上文所描述的是日本哪一占領地？", "opts": ["臺灣", "北海道", "滿洲國", "朝鮮。"], "optImg": false, "ans": 2, "exp": "滿洲國為日本扶植政權，由於位於中國東北地區，有中國與俄國政權的威脅，使日方常用安全為由，進行相關政策。日本政府為了有效掌握東北，採用武裝移民政策，時常侵占已開墾的耕地，或是以低價強行徵收土地，再交由開拓團墾植，造成當地居民心生不滿，抗日活動不斷。(Ａ)(Ｄ)臺灣與朝鮮為殖民地，較無「匪情惡化」問題。(Ｂ)日本常以鎮壓方式處理北海道阿伊努人的叛亂，而非強迫原居民遷離。", "figs": [], "small": false}], "key": "1_25"}, {"sec": "一、單選題", "n": "26", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "英國於 1855 年通過了關於「承載中國乘客船隻管理法案」，就英國船隻載運中國移民出洋明文規定，包括船上每個乘客應當享有的基本活動空間和生活條件，接著 1858 年又通過了一項修正案，限定了英國船隻運送中國移民出洋能夠前往的英屬領地範圍。請問這些法案實施的背景與何者有關？", "opts": ["鼓勵中國移民英國", "為避免華工遭洋行凌虐", "增加華商遠洋貿易便利", "限制華人移民人數。"], "optImg": false, "ans": 1, "exp": "多數華工在簽訂契約後（有多數是非自願簽下契約），在乘船途中被虐待，船艙環境也相當惡劣，使當時乘載華工出洋船隻有「浮動地獄」稱號。", "figs": [], "small": false}], "key": "1_26"}, {"sec": "一、單選題", "n": "27", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "閱讀下列三則資料，並回答問題：資料一：拿破崙指著窗外花園中的中國花匠，對赫爾說：「你看，這些人很善良。他們有才能、智慧和自尊心，絕不會長期像這樣受英國人或其他任何西方人奴役。」資料二：道光 19 年林則徐奏稱：「十餘年前，連值荒年，出洋者數以千計。當其在船之時，皆以木盆盛飯，呼此等搭船者一同就食，其呼聲與內地呼豬同，故人目此船為買豬仔。」資料三：1889 年，一個法國代表團訪問東南亞各地後在報告中寫道：「香港和新加坡的繁榮興盛，以及馬來聯邦、蘇門答臘、婆羅洲等地那些賺錢的種植園，全靠中國人的勞動。……他們不僅建築鐵路，而且在種植園勞動，開闢稻田、種植蔬菜、合理而巧妙地開採礦藏，並不斷設法使各生產領域的產量滿足日益增長的需要。請問以下有關這三段資料的詮釋，何者為是？", "opts": ["這三段資料都是描述 19 世紀末華工的情況", "這三段資料都可說明海外華工問題的光明面", "這三段資料都可用以說明海外華工所遭受不人道的對待", "這三段資料可呈現 19 世紀華人國際遷移的情況。"], "optImg": false, "ans": 3, "exp": "(Ａ)資料一，屬 19 世紀初；資料二，屬 19 世紀中葉（1839 年）。(Ｂ)資料二陳述華工何以被稱為「豬仔」，非陳述光明面。(Ｃ)資料三並未陳述不人道之處。", "figs": [], "small": false}], "key": "1_27"}, {"sec": "一、單選題", "n": "28", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "有一位經濟學家指出：面臨人口下降以及人口老齡化問題的國家，唯一的解決方法就是打開國門。但是，大量引入移民會導致多方面的政治、經濟及社會問題。請問下列哪一個國家極力反對大量移民的湧入？", "opts": ["美國", "澳洲", "日本", "英國。"], "optImg": false, "ans": 2, "exp": "日本因國土狹小，鼓勵國人往外移民，卻對外國人民移居日本加以限制。", "figs": [], "small": false}], "key": "1_28"}, {"sec": "一、單選題", "n": "29", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "比較 19 世紀中後期以來的美國與東南亞華工的異同，下列何者說明是正確的？", "opts": ["只有美國地區華工遭遇排華的問題", "東南亞地區華工主要從事咖啡、可可等熱帶栽培業", "華工在美國地區的移居人數始終呈現增加狀態", "開採金礦是當時美國華工的主要工作之一。"], "optImg": false, "ans": 3, "exp": "(Ａ)美國、東南亞地區華工均會遭遇排華的問題。(Ｂ)東南亞地區華工主要從事橡膠、甘蔗等熱帶栽培業。(Ｃ)《排華法案》通過後，華人前往美國的人數快速減少。", "figs": [], "small": false}], "key": "1_29"}, {"sec": "一、單選題", "n": "30", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "華人移往海外主要以華南地區與海外的延伸，華人社群中，常見閩、粵並列，外加較小群的潮州人、客家人、海南人等。但是在 19 世紀，移往某地的華人社群，大多是粵人，箇中原因繫於英國。英國在 1842 年中英鴉片戰爭中取得香港之後，將該地發展成跨太平洋航線的重要門戶。請問某地主要是指何處？", "opts": ["北美", "日本", "馬來西亞", "南非。"], "optImg": false, "ans": 0, "exp": "英國將香港與廣州、澳門連結，使得粵人可由此出洋。由跨太平洋可知某地是北美。(Ｂ)日本移民亦包括海外華商為主，非僅是粵人。(Ｃ)馬來西亞從 16 世紀以後即有多條華人出洋路線。(Ｄ)南非並不是橫跨太平洋。", "figs": [], "small": false}], "key": "1_30"}, {"sec": "二、題組", "n": "31", "stem": "閱讀下列兩則資料，並回答問題：資料一：與東南亞當地族群相比，華人雖在人口數上屬於少數民族，卻具有較優勢的經濟地位，但東南亞華人這樣的經濟力量卻被誇大形容為「海外華人帝國」。事實上，華人學者廖建裕教授強調：「東南亞的華人企業不論大小，在經濟活動中僅具相對優勢地位而非主導地位，若與區域性或全球性企業相比，他們的經濟力量無法比擬。海外華人的經濟事業絕不是經濟帝國，他們大多數僅屬於社會中的中產階級，努力為生活打拚。」華人在東南亞的相對經濟優勢除了歷史背景所趨，也是族群網絡（ethnicnetworks）關係所成。由於華人人口在東南亞地區與當地族群相比占少數，為了生存與發展而形成較團結、較具凝聚力的團體，在商業上也形成較強的網絡關係。資料二：華人這樣的族群凝聚力，表現在商業上的網絡關係，另外則是以家譜方式表現。這進入了華人本質上的討論。在血緣方面，華人對於族譜的重視，表現在早期的華人移民家庭中。這樣的重視在於此為華人家族血緣關係的詳細記載，也表達中國人對於祖先的崇拜。在語言和文化方面，華語是華人之間的交流管道，網絡關係因而有形成的可能；文化則是華人族群網絡關係的根基。華語及中華文化的保存一直是華人長期以來的關注議題，華校在這之中就被賦予了這樣的責任和期待。華文教育延續了華語及中華文化在東南亞地區的生命力。", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "請問以上兩段資料的共同主旨為何？", "opts": ["海外華人的凝聚力", "海外華人之花果飄零", "海外華人的資本主義", "海外華人的祭祖活動。"], "optImg": false, "ans": 0, "exp": "(Ｂ)「花果飄零」意指漂泊或失根，與文中重點不符，資料強調的是華人族群的團結與發展。(Ｃ)雖提到經濟，但資料重點不是華人資本主義，而是經濟活動中的凝聚力。(Ｄ)祭祖僅是凝聚力的其中一種表現，非兩段資料的核心主旨。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "華文教育對海外華人而言有何重要性？", "opts": ["表達華人對祖先的崇拜", "華人之間的交流管道，網絡關係藉此才有可能形成", "方便華人吸收現代文化的價值觀", "隨著中國興起，懂華文成為海外華人的謀生工具。"], "optImg": false, "ans": 1, "exp": "資料二提到「華語是華人之間的交流管道，網絡關係因而有形成的可能」，故答案選(Ｂ)。", "figs": [], "small": false}], "key": "2_31"}, {"sec": "二、題組", "n": "32", "stem": "19 世紀後期，此國在完成中央集權化改革後，將目光投向本土北方的一大片島嶼地區。島嶼氣候寒冷、人口稀少，原住民族世居於此，生活方式以狩獵、漁撈與採集為主。由於島嶼與一個幅員廣大的鄰國僅隔著狹窄海峽，該國近年不斷向東擴張領土，政府擔憂邊境安全，決定展開大規模開發與移民計畫。當局派遣專門機構進行規畫，並修築道路、港口等基礎設施，以便移民進入與農業開墾。這批移民多來自本土人口密集地區，其中有一部分被稱為「國防移民」，他們的任務不僅是從事農業生產，也在邊境地帶形成社群，做為防範外國勢力滲透的屏障。這裡的移民者生活條件艱苦，需適應長冬、低溫與陌生的地形，同時還得應對開墾初期資源不足的困境。然而，隨著開發持續，該地區農業、漁業及礦產資源逐漸成為國家經濟的一部分，邊防安全也因移民社群的存在而得到加強。", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "依據上文中提及的內容來看，當時此國是計畫將人民移至下列何地？", "opts": ["臺灣", "朝鮮", "北海道", "中國東北。"], "optImg": false, "ans": 2, "exp": "本題需要從文本中的多項線索，判斷出移民目的地的地理位置與歷史背景。文中提到「19世紀後期完成中央集權化改革」是指明治維新後的日本，「本土北方的一大片島嶼」、「氣候寒冷、長冬」、「原住民以狩獵漁撈為生」等線索，選項中僅(Ｃ)北海道吻合。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "文中提到將人民移居此地是為了防範外國勢力滲透，此外國勢力是指哪個國家？", "opts": ["英國", "俄國", "法國", "美國。"], "optImg": false, "ans": 1, "exp": "日本曾為防範俄國勢力入侵，故計畫性的將人民移往北海道地區，使北海道成為日本北端的國防防線，這些移民者的任務不僅是從事農業生產，也必須協助資源的開發，答案為(Ｂ)。(Ａ)(Ｃ)(Ｄ)三國的地理位置皆非距離北海道僅一條狹窄海峽。", "figs": [], "small": false}, {"type": "mc", "label": "(３)", "q": "政府主導的此波移民活動，可能帶來以下何種影響？", "opts": ["當地成為熱帶栽培業種植要地", "移民地成為工業格外發達之地", "當地風俗文化傳播到日本各地", "當地住民的生活空間受到侵奪。"], "optImg": false, "ans": 3, "exp": "文章開頭提到「原住民族世居於此，生活方式以狩獵、漁撈與採集為主」，接著描述「大規模開發」、「修築道路、港口」、「農業開墾」。可以推理出移民社群占據原住民生活區域，必然壓縮原住民的生活空間。日本主導將大量移民移往北海道後，造成當地的阿伊努人的生活空間受到威脅，原有文化及語言也逐漸喪失，答案選(Ｄ)。", "figs": [], "small": false}], "key": "2_32"}, {"sec": "二、題組", "n": "33", "stem": "19 世紀末至 20 世紀初，清政府內憂外患，國內政治腐敗、列強壓迫嚴重，激起了許多有志之士推翻舊政權、建立新制度的想法。然而，國內監控嚴密，革命活動往往難以在境內自由展開。與此同時，大量華人因經濟壓力、戰亂或謀生機會移居海外，在東南亞、美洲、大洋洲等地形成規模可觀的社群。這些社群中的商人、勞工與知識分子，不僅維持著對祖籍地的情感連結，也成為革命力量的重要支持來源。革命團體在海外成立分會，利用當地相對自由的環境進行演講、出版報刊、籌款與招募成員。部分商人慷慨解囊資助起義，華工則以小額捐款累積龐大資金，有的甚至回國參加行動。這些海外援助不僅提供了資金，也讓革命思想透過報紙、書刊與口耳相傳回流國內，對推動變革起到關鍵作用。", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "依據文中敘述，海外成為革命活動重要基地的主要原因為何？", "opts": ["海外對政治活動較寬鬆", "當地政府試圖推翻清朝", "海外華人具備軍事訓練", "清廷將移民者視為棄民。"], "optImg": false, "ans": 0, "exp": "文章開頭即點出清末「國內監控嚴密」，並說明革命團體在海外「利用當地相對自由的環境進行演講、出版報刊、籌款與招募成員」，故可知海外成為清末革命活動重要基地的主要因素為(Ａ)海外對政治活動較寬鬆。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "依據資料的內容可知，下列有關文中敘述的說明何者正確？", "opts": ["華人為棄民故支持推翻母國", "會透過捐款來援助革命行動", "海外華人與母國間毫無聯繫", "海外移民積極推翻中華民國。"], "optImg": false, "ans": 1, "exp": "海外華人透過捐款及實際參與革命行動的方式來支持推翻清朝的革命行動。(Ａ) 19 世紀以來的海外移民已不被視為棄民。(Ｃ)海外華人會向母國捐款。(Ｄ)海外華人欲推翻的應該是清朝政府。", "figs": [], "small": false}], "key": "2_33"}, {"sec": "二、題組", "n": "34", "stem": "在西班牙殖民時期，華人移民被禁止擁有土地，大多數移民從事服務業，如工匠、理髮師、草藥醫生、搬運工、肥皂製造商和裁縫師。華人後代已自認為是當地人，而非華人或華裔麥士蒂索人。請問：", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "這是哪一地區華人移民的現象？", "opts": ["新加坡", "菲律賓", "印尼", "馬來西亞。"], "optImg": false, "ans": 1, "exp": "菲律賓被西班牙殖民，故答案選(Ｂ)。(Ａ)(Ｄ)新加坡、馬來西亞被英國殖民。(Ｃ)印尼被荷蘭殖民。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "此地區的華人移民大部分來自中國哪一地區？", "opts": ["福建", "浙江", "臺灣", "雲南。"], "optImg": false, "ans": 0, "exp": "福建、廣東人往海外移民的人數最多，菲律賓的華人移民大多來自福建、廣東。", "figs": [], "small": false}], "key": "2_34"}, {"sec": "二、題組", "n": "35", "stem": "閱讀下列三則資料，並回答問題：資料一：一個團體被同化到何種地步，由多種因素而定，如文化遺產的性質、人數的多寡、與主體文化的接觸、經濟的適應、隔離的程度等。波肯（R.E.Porkand）和米勒（H.A.Miller）在《舊世界特質的移植》（Old World Traits Transplanted）一書中主張，同化是自然的，不需要助力的過程，遲緩而漸進，主要是一種調適過程，為順應之一種，如兩個族群團體各有其文化遺產，一優一劣，劣者在優者影響之下，不知不覺地捨己從人，於是兩種文化之間的衝突獲得解決。資料二：戴維（M.R.Davie）在《世界移民》（World Immigration）一書中指出，美國公立學校是促進移民同化的一大因素：移民所生子女的美國化及移民本身的間接美國化，公立學校的功績不容抹煞。戴維認為另一種同化的力量是「外觀標準化」（standardization of externals）。外來移民一入境美國就在外表上模仿當地人，用同樣的家具、用具、汽車，穿同樣款式的服裝。資料三：陳培豐博士的《同化的同床異夢》一書，基本上說出了一個現象：日本以語言作為族群同化的殖民政策時，在臺灣出現了推動者和接受者兩造的不同想像。殖民政府希望以語言作為族群同化的工具，接受者則是寄望透過語言來獲取文明的知識。相同的是，兩造都以語言作為政治性的手段，不同的是，兩造的政治目的南轅北轍，完全迥異。是以，該書以「同床異夢」為題，道出了「同化於文明」與「同化於族群」的兩個可能。", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "以上三段資料的共同主題為何？", "opts": ["階級", "性別", "同化", "涵化。"], "optImg": false, "ans": 2, "exp": "", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "以上三段資料中，何者可以解釋臺灣在北京奧運期間可以容許自己被稱為「中華臺北」，而不可稱為「中國臺北」的現象？", "opts": ["資料一", "資料二", "資料三", "以上皆可。"], "optImg": false, "ans": 2, "exp": "(Ｃ)臺灣和中國對於同化問題上，有其同床異夢之處。", "figs": [], "small": false}, {"type": "mc", "label": "(３)", "q": "以上三段資料中，何者可以直接解釋臺灣鼓吹外籍配偶及其子女到公立學校學中文，成為「新臺灣人」的現象？", "opts": ["資料一", "資料二", "資料三", "以上皆可。"], "optImg": false, "ans": 1, "exp": "", "figs": [], "small": false}, {"type": "mc", "label": "(４)", "q": "以上三段資料中，何者可以直接解釋：隨著漢人不斷移民到臺灣，原住民也愈來愈遠離南島語系的文化，捨漁獵文化而採取漢族的農耕文化的現象？", "opts": ["資料一", "資料二", "資料三", "以上皆可。"], "optImg": false, "ans": 0, "exp": "", "figs": [], "small": false}], "key": "2_35"}, {"sec": "二、題組", "n": "36", "stem": "閱讀下列兩則資料，並回答問題：資料一：(一)停止華工輸入美國十年、(二) 1880 年 10 月 17 日前獲准居留美國的華工，出境後，准予重入美國、(三)持有中國政府英文證明，依約有權入美的華人，准予進入美國、(四)此後不得准許華人歸化為美國公民。資料二：禁例不能廢而必廢之。廢之之道將奈何？曰：抵制之……抵制之術奈何？曰：辦貨者不辦美人之物，用物都不用美人之物，為辦此抵制之術之絕妙宗旨。而傭力於碼頭者，惟美貨則不起，買賣於市上者，於美貨則有禁，為辦此抵制之術之絕妙政策。", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "請問資料一的時代背景為何？", "opts": ["第二次世界大戰後", "第一次世界大戰後", "19 世紀下半葉", "19 世紀初。"], "optImg": false, "ans": 2, "exp": "(Ｃ) 19 世紀下半葉後，西力東漸，才有很多華人被當成「豬仔」賣到美國，協助興建橫貫美國全境的鐵路，繼而引發排華風潮。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "資料一、資料二所共同牽涉的主題為何？", "opts": ["族群", "性別", "階級", "環保。"], "optImg": false, "ans": 0, "exp": "這兩段資料都有關華裔美國人的(Ａ)族群史。", "figs": [], "small": false}, {"type": "mc", "label": "(３)", "q": "以下有關這兩段資料的詮釋，何者為是？", "opts": ["美國地廣人稀，亟須移民實邊，所以鼓勵華工進入美國", "美國經濟衰退，各地勞動力過剩，所以嚴禁華工入境", "華人安土重遷，想落葉歸根，所以透過抵制手段爭取返華機會", "華工在美國境內迭遭苛虐，所以清廷號召華工共同抵制美貨。"], "optImg": false, "ans": 1, "exp": "(Ｂ) 1869 年之後，美國經濟衰退，各地勞動力過剩，所以才會有資料一的《排華法案》。", "figs": [], "small": false}], "key": "2_36"}, {"sec": "二、題組", "n": "37", "stem": "南滿洲鐵道株式會社（滿鐵）成立於 1906 年，為日本在某場戰爭之後，從戰敗國手中接手控制權，並在中國滿洲成立的鐵路公司，此公司不僅僅是日本為開發東北地區而設立的鐵路公司，事實上，該公司在成立之初，日本政府即賦予殖民滿洲的特殊任務，並啟用具有臺灣經驗的後藤新平為滿鐵第一任總裁，計畫以此做為擴張勢力於中國的重要據點。請問：", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "滿鐵於 1906 年成立，是日本在戰後接管中國東北鐵路權益的重要機構，不僅肩負經濟開發，更推動殖民與擴張計畫。請問題文提及的「戰爭」應該是下列何者？", "opts": ["甲午戰爭", "日俄戰爭", "一次大戰", "二次大戰。"], "optImg": false, "ans": 1, "exp": "1904 ～ 1905 年日俄戰爭由日本獲勝，原來由沙俄修建的中東鐵路長春至旅順段被轉讓給日本，改稱為南滿鐵路。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "後藤新平在接手滿鐵後，強調經營滿洲不能只單靠武力，必須不動聲色的厚植殖民勢力。下列何者是其可能採取的統治政策？", "opts": ["號召日本國內居民移民滿洲", "仿日本殖民臺灣初期設立三段警備制", "在滿洲建立以清朝宗室為首領的政權", "派遣大量軍隊至滿洲設立軍事據點。"], "optImg": false, "ans": 0, "exp": "後藤新平提出「文治的武備」，認為要長久的占領滿洲，必須要讓在滿洲的中國人信任日本。而往殖民地大量移民，不但進可攻退可守，日後當中國要求收回滿洲，若日本移民數量龐大，便可永借不還。", "figs": [], "small": false}], "key": "2_37"}, {"sec": "二、題組", "n": "38", "stem": "請閱讀下列二則資料：資料一：《中國近代人物列傳》介紹一位著名人物：「他在移居南洋後，從事橡膠業而致富，他曾大力支持同盟會。民國成立後，他數度返國捐獻。抗戰爆發後，他領導南洋華僑捐資抗日，因而成為日軍的眼中釘。」資料二：他曾在一封信中這樣寫道：「教育不振則實業不興，國民之生計日絀，……言念及此，良可悲也。吾國今處列強肘腋之下，成敗存亡，千鈞一髮，自非急起力追，難逃天演之淘汰。鄙人所以奔走海外，茹苦含辛數十年，身家性命之利害得失，舉不足攖吾念，獨於興學一事，不惜犧牲金錢，竭殫心力而為之，終日孜孜無敢逸豫者，正為此耳。」這封信件充分說明了他對於中國教育和崛起的深遠見解。", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "資料一、二中的「他」應是下列何人？", "opts": ["羅福星", "陳嘉庚", "李光耀", "梁啟超。"], "optImg": false, "ans": 1, "exp": "(Ａ)羅福星係印尼華僑，在臺灣發展苗栗抗日事件。(Ｃ)李光耀為新加坡總理。(Ｄ)梁啟超於戊戌政變後旅居日本。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "他痛感家鄉文化教育的落後和人才的匱乏，因而決定創辦哪一所大學，使其成為中國近代教育史上第一所華僑創辦的大學？", "opts": ["廈門大學", "南京大學", "香港大學", "天津大學。"], "optImg": false, "ans": 0, "exp": "新加坡華僑陳嘉庚，福建人，事業規模遍及橡膠、水果罐頭等十餘種產業。熱心助學，創辦南洋華橋中學、廈門大學等多所學校。", "figs": [], "small": false}], "key": "2_38"}, {"sec": "二、題組", "n": "39", "stem": "粵東省城，自夷人竄入以來，居民已不聊生。近年更有一種匪徒，拐擄良民，販與夷人。男女被擄者數以萬計。夷人於省城之西關，番禺縣屬之黃埔，香山縣屬之澳門及虎門外之香港等處，設廠招買，名為招中國人傭工，實不知作何驅使。每次買出外洋，皆滿載而去。匪徒始猶暗用術誘，近則明用強搶。省城附近一帶，村落行人，為之裹足，民情恟懼異常。", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "此資料所敘述的時代背景為何？", "opts": ["明初", "明末", "清初", "清末。"], "optImg": false, "ans": 3, "exp": "從資料中粵省「夷人竄入」、「設廠招買」等線索，可推測當時為鴉片戰爭後，洋人可進入通商口岸進行貿易行為，並且清末時列強亟需華工到海外殖民地進行勞力工作。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "關於這些「中國傭工」的敘述何者正確？", "opts": ["俗稱為豬仔", "主要是被賣到非洲地區", "大部分的華工可以得到人道待遇", "皆能夠賺取豐厚的利潤返回故鄉。"], "optImg": false, "ans": 0, "exp": "(Ｂ)被賣到美洲或東南亞地區。(Ｃ)受到非人道的待遇，狀若奴隸，甚至牲畜。(Ｄ)中途死亡或自殺者甚多，大部分無法回到故鄉。", "figs": [], "small": false}], "key": "2_39"}, {"sec": "二、題組", "n": "40", "stem": "附圖為某一時期的中國海外移民情形。請問：<div class='fig'><img data-src='f-011-0.png'></div>", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "附圖中箭頭甲人口移動的情形最早應出現於下列哪一時期？", "opts": ["18 世紀初期", "18世紀末期", "19 世紀初期", "19 世紀末期。"], "optImg": false, "ans": 2, "exp": "此圖示意中國華僑移往美國、新加坡與澳洲三地，據此判斷最早移民美國的華人應出現於19 世紀初期，鴉片戰爭後，外國以條約迫使清朝增開通商口岸，准許人民出國。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "附圖中箭頭甲，最有可能移往美國的哪一州？", "opts": ["加利福尼亞州", "德克薩斯州", "紐澤西州", "內華達州。"], "optImg": false, "ans": 0, "exp": "因應 19 世紀中葉加州「淘金熱」與興建長途鐵路的人力需求，美國引進大量華工。", "figs": [], "small": false}, {"type": "mc", "label": "(３)", "q": "美國通過《排華法案》，禁止華人勞工入境，卻使哪一國家的勞工取得移民的機會？", "opts": ["泰國", "日本", "越南", "韓國。"], "optImg": false, "ans": 1, "exp": "1882 年，美國通過《排華法案》，禁止華人勞工入境，使日本勞工取得移民機會。卻因為日本勞工大量移入，引起工會組織抗議；加上日俄戰爭後，美日關係緊張，美國遂與日本協議，限制日本勞工移民美國本土。", "figs": [], "small": false}], "key": "2_40"}, {"sec": "二、題組", "n": "41", "stem": "請閱讀以下資料：資料一：所謂「厝仔」制度，是由「厝仔」的「頭家」承租園地，再交由華人耕種，收成後按規定的價格出售給種植園主。每個承租人手下都有許多契約勞工，他們住在一排排小屋子裡，正因為如此，這種制度叫做「厝仔制度」。資料二：根據本委員會在 1910 年所得到的證據，並透過本人的個別詢問，我認為在克里安種植園裡，存在著非常嚴重的虐待契約華工的現象，而且，此現象與馬來亞聯邦克里安地區的「厝仔制度」密切相關。契約華工被轉交到「厝仔」的頭家手裡後，只能完全聽憑其任意擺布。種植園主人平常並不住在那裡，他根本不管園裡的勞工處境如何，也沒有人去確認每個頭家手下有多少契約華工。最近在種植園的一份調查顯示，那些直屬公司老闆管轄下的勞工，他們的處境並不見得會比那些在「厝仔」頭家管轄下的勞工好多少。請問：", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "根據資料一與資料二可知，契約華工的處境相當於下列哪一種身分？", "opts": ["佃農", "部曲", "苦力", "鄉勇。"], "optImg": false, "ans": 2, "exp": "由兩段資料可知，契約華工被「厝仔制度」限制住，失去了人身自由，故其處境類似苦力。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "由資料二可知，該委員會進行調查的目的為何？", "opts": ["提高種植園主人的利潤", "改進勞工的待遇與環境", "支持頭家的厝仔制度", "禁止再度引入契約華工。"], "optImg": false, "ans": 1, "exp": "英屬馬來亞當局成立了「華人護衛司」，負責監督及規範輸入勞工的現況，目的在改進當地華工的處境。", "figs": [], "small": false}], "key": "2_41"}, {"sec": "二、題組", "n": "42", "stem": "附表為 1910 ～ 1930 年間，朝鮮人民移居日本的統計表。請問：<div class='fig'><img data-src='f-012-0.png'></div>", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "1915 年，移居日本的朝鮮人突然增加四倍多的原因為何？", "opts": ["一次大戰爆發", "朝鮮被日本併吞", "中國發生辛亥革命", "日本在朝鮮實施皇民化運動。"], "optImg": false, "ans": 1, "exp": "1910 年，日本併吞朝鮮，朝鮮人獲得日本人的身分，可以進入日本謀生。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "在日本的朝鮮人，大多從事下列哪一類工作？", "opts": ["教育", "軍人", "技工", "礦工。"], "optImg": false, "ans": 3, "exp": "在日本的朝鮮人大多從事礦工、建築工以及非熟練的勞工等職業，他們的薪水通常比從事同種工作的日本人低很多，故常處於貧困的處境中。", "figs": [], "small": false}], "key": "2_42"}, {"sec": "二、題組", "n": "43", "stem": "20 世紀初，某島國在戰爭勝利後獲得對東亞北方部分地區的影響力。該國政府派出專員進行大規模土地調查，記錄土壤肥沃度、交通線路與人口分布，並規劃沿鐵路建立移民村落的藍圖。這些資料既用於農業開墾，也為後續軍事部署提供參考。一次突發的軍事事件爆發後，該國軍方迅速控制當地，並在隔年建立一個以清朝末代皇帝為元首的新政權。此後，官方推行「開拓團」計畫，鼓勵或動員本土農民前往當地定居。移民者多來自本國人口稠密、農地不足的地區，抵達後在官方規劃下開墾農地，並與當地原住民共同或分別居住，雖此政策旨在強化人口與資源控制，但也加劇了民族矛盾與社會緊張。", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "此島國獲得的戰爭勝利是指", "opts": ["甲午戰爭", "日俄戰爭", "英法聯軍", "八國聯軍。"], "optImg": false, "ans": 1, "exp": "日本自日俄戰爭獲勝後，便取得對中國東北的控制權，開始在當地積極推動建設，並計畫性將日本人移民當地，造成與當地人之間的衝突，答案選(Ｂ)。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "當時該島國為何要推行「開拓團」計畫，鼓勵或動員本土農民前往當地定居？", "opts": ["透過武裝移民來防堵俄國勢力", "積極落實該國南進政策的主張", "推動當地工業化所需的勞動力", "刻意激化當地人民的衝突糾紛。"], "optImg": false, "ans": 0, "exp": "日本政府為有效掌控東北，以成立武裝開拓團，藉此防堵俄國在東北地區的擴張勢力，但此舉引發當地居民不滿，常與開拓團引發衝突，答案選(Ａ)。", "figs": [], "small": false}], "key": "2_43"}, {"sec": "二、題組", "n": "44", "stem": "閱讀下文，並回答問題：歷史及無數的事實證明了，中共政府只要和某一個國家建交，便會給該國的華人社會帶來災難、混亂的道德標準和是非標準。以印尼為例，中印建交加速了中共向印尼的革命輸出，為革命披上了合法的外衣。並且中共也在華人社區撒播仇恨的種子，人為製造鬥爭，製造分裂，把原本和諧的華人社會掀起滔天大浪，讓人們站隊分成左派、右派，深深毒害著每個人，尤其是青少年學生和每個家庭。50 年代初期和中期，中共居於幕後策劃和導演了類似文化大革命的奪權運動，被煽動起來的華人高唱義勇軍進行曲向華僑社會的上層建築領域進軍，奪取了華僑總會、商會、同鄉會、學校、報社的領導權。從首都到省會，從省會到地方城市，只要有華人生活的城鎮即無所不及，數以百萬計、千萬計的印尼華人被捲進了這人為製造的政治漩渦。總之，革命教育代替了傳統的道德教育，假如違背了不成文的規則，上至中共駐印尼的官員，下至普通市民，會視此人為異類而另眼相待。", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "本資料的主旨為何？", "opts": ["中共促進華僑福祉", "中共促成華僑分裂", "中共不干涉他國內政", "中共不搞革命輸出。"], "optImg": false, "ans": 1, "exp": "(Ｂ)如該文開頭所說的，「歷史及無數的事實證明了，中共政府只要和某一個國家建交，便會給該國的華人社會帶來災難、混亂的道德標準和是非標準。」", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "本資料可作為下列哪一主題的佐證？", "opts": ["華僑何以從落葉歸根到落地生根", "華僑何以從落地生根到落葉歸根", "華僑是革命之父", "中華文化之花果飄零。"], "optImg": false, "ans": 0, "exp": "(Ａ)第二次世界大戰後，由於意識型態爭執、政治紛擾，海外華人逐漸從過去的落葉歸根轉向落地生根，朝在地化發展。", "figs": [], "small": false}], "key": "2_44"}, {"sec": "二、題組", "n": "45", "stem": "閱讀下文，並回答問題：成立於 60 年代初期的舊金山駐美中華總會館，前後已經有超過 150 年的歷史。當年的中華會館被稱為「六會館公所」，分別由三邑、陽和、寧陽、合和、岡州、人和，以及後來的肇慶等七大會館組成，當時美國社會稱為「中國六大公司」（Chinese Six Companies），就是由原有的六會館公所根據公司法註冊的總稱。後來，在美國社會排華移民法案的影響下，當時的清廷為了集中華人社區的力量，推動了組織「總會館」的構想，因此，六會館公所便被總會館的名稱所取代。1882 年時，清廷駐美公使鄭藻如更進一步將其定名為「金山中華會館」，成為美國華人社會間最高的權力機關，在社區當中有著十足的行動號召力。然而，1882 年之後的 20 年間，隨著《排華法案》效應逐漸湧現，美國華裔社區的架構出現改變，華裔移民數目大幅減少，各地中華會館、中華公所的規模因此連帶式微，其功能也由堂口、幫會取而代之。也就在當年錯綜複雜的時代背景及現實因素的交錯影響下，舊金山中華會館於 1901 年在加州正式註冊為慈善機構，英文名為 Chinese Consolidated Benevolent Association（C.C.B.A.），中文則是「駐美中華總會館」，自此便因非牟利機構的限制，而不能介入政治活動。", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "依據本資料，中華會館從有十足的行動號召力到不能介入政治活動，係受何種因素的影響？", "opts": ["基礎建設", "風俗習慣", "法律制度", "市場交易。"], "optImg": false, "ans": 2, "exp": "(Ｃ)因為《1882 年排華法案》通過，中華會館為求生存，轉型為慈善機構。其英文名稱的直譯為「中華慈善聯合總會」。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "以下有關美國華人會館所扮演的社會角色之描述，何者為是？", "opts": ["早期是美國華人社會間的最高權力機構，有十足的行動號召力", "它係統合各地堂口、幫會，凝聚、擴大而成，有十足的代表性", "它因為美國華裔移民的政治勢力已日益擴張，而轉型為慈善機構", "早期的美國華人會館組織非常鬆散，並無一套管束同鄉的制度。"], "optImg": false, "ans": 0, "exp": "(Ｂ)其功能逐漸為堂口、幫會所取代，而非統合堂口、幫會。(Ｃ)《排華法案》通過後，理論上，華人政治勢力應日漸衰微。(Ｄ)它有一套管束同鄉的制度。", "figs": [], "small": false}], "key": "2_45"}, {"sec": "二、題組", "n": "46", "stem": "請閱讀以下資料：資料一：華人是一個排外的族群，無論在文化上、社會上，或是在經濟上，他們一概拒絕和他人分享。在經濟領域，他們非常專權，壟斷了我們的經濟，每一個印尼人都在實際生活中意識到華人的壟斷性。任何一個印尼人小店主，如果他要在自己的店裡賣米，只能到華人經銷商那裡進貨。可是，華人經銷商對於印尼店家的態度和他們對華人店家態度截然不同，他們會給予華人店家更多優惠的條件。資料二：一個出生於印尼的小孩，父親是居住在印尼的華人，母親也是住在印尼的華人，只要小孩本人不反對，就可以獲得印尼國籍。可是，他的父親是新客，他的母親也是新客，他就應當繼承父親的衣缽，他仍然是新客華人社會的一分子，絕不可能成為一個真正的印尼人。請問：", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "以上兩段資料顯示了下列哪一主旨？", "opts": ["印尼的複雜國籍問題", "華人的印尼認同問題", "印尼華人的經濟優勢", "印尼人民的排華意識。"], "optImg": false, "ans": 3, "exp": "由資料一可知，由於華人的經濟優勢，造成印尼人對華人的不滿，由資料二可知，印尼人認為華人是屬於外國人，故兩段資料顯示了印尼的排華意識。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "由兩段資料，可知印尼社會的哪一現象？", "opts": ["華人的政經地位在印尼人之上", "華人掌經濟，印尼人掌政治權", "印尼與華人之間存有族群隔閡", "印尼人想要將華人驅趕出國境。"], "optImg": false, "ans": 2, "exp": "(Ａ)並未看出華人的政治地位高於印尼人。(Ｂ)從兩段資料無法看出印尼人掌政治權。(Ｄ)僅看出印尼的排華意識，但並未看出印尼人想要將華人驅趕出國境。", "figs": [], "small": false}], "key": "2_46"}, {"sec": "二、題組", "n": "47", "stem": "某地區鄰近沙漠與高山，歷史上曾被不同勢力爭奪或提出占領要求。千年以來，商人、移民和軍隊在此地穿梭，形成多元文化交匯的局面。19 世紀以前，到過那裡的漢人極少，這些漢人所遇到的各種伊斯蘭人民，他們大多屬於土耳其或波斯語言民族，並視漢人為異教徒。過去這塊土地的統治者與中國統治者或相互結盟或各自獨立，但 1864 年，當地發生反中國政府事件，最終於 1877 年被平定，為加強統治，1884 年中國下令建省，將該地完全納入中國的行政體系之中，並開始推行「內地化」政策。", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "上文所敘述的地方應為下列何者？", "opts": ["新疆", "陝西", "甘肅", "雲南。"], "optImg": false, "ans": 0, "exp": "從地區鄰近沙漠和高山、當地多為穆斯林，與 1877 年動亂平定，可推斷是 1884 年建省的新疆，答案為(Ａ)。(Ｂ)陝西位於中國內陸，為傳統中原位置，與伊斯蘭文化交融的程度有限。(Ｃ)甘肅從漢代建立漢四郡開始統治。(Ｄ)雲南位於中國西南地區，地勢以高山和深谷為主，與沙漠並不相鄰，且雲南從明代起即納入版圖。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "中國推行的「內地化」政策可能包括下列哪一舉措？", "opts": ["下達漢人與當地民族強制隔離", "實施鼓勵漢人移居該土地屯墾", "武力脅迫當地民族向外地遷徙", "強制當地民族全數內徙至中原。"], "optImg": false, "ans": 1, "exp": "本題可以從臺灣史學到的「內地化政策」概念進行解題，臺灣的內地化指的是讓臺人殖民母國化，遷移此概念，可知題目問的是哪一項最符合回民漢化的措施，選項中，以(Ｂ)漢族移居屯墾較為可能漢化，亦是清廷實際政策。(Ａ)(Ｃ)皆非漢化措施。(Ｄ)內地化政策是指將中原文化引入邊疆，而非強制當地民族遷移至中原地區。【題文改寫自：黎安友、施道安，〈中國為什麼緊緊抓住新疆？〉獨立評論網站，https ://opinion.cw.com.tw/blog/profile/390/article/7368 】", "figs": [], "small": false}], "key": "2_47"}, {"sec": "二、題組", "n": "48", "stem": "閱讀下列圖文，並回答問題：資料一：如圖(一)。<div class='fig'><img data-src='f-014-0.png'></div>▲圖(一)資料二：如圖(二)。<div class='fig'><img data-src='f-015-0.png'></div>▲圖(二)資料三：「現在有兩個唐人街，一個在興起，一個在衰落。」2006 年 7 月，《洛杉磯時報》分析唐人街轉型的文章這樣說。文章稱，為中國移民而建、由會館和店鋪為標誌的老唐人街正在掙扎。以藝術畫廊、新潮商店為主力推動現代亞洲時尚的新唐人街卻充滿活力，這個群體由白人藝術家和第二、三代中國移民組成，他們身上更多的是時尚而不是傳統。", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "依據資料三的說明，資料一屬於何種唐人街圖像？", "opts": ["興起中的唐人街", "衰落中的唐人街", "新潮的唐人街", "時尚的唐人街。"], "optImg": false, "ans": 1, "exp": "資料一人物的服裝和街道建築都相當傳統，屬於資料三所說的(Ｂ)衰落中的唐人街。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "美國人稱唐人街為「國中之國」，請問這種描述係捕捉何種唐人街圖像？", "opts": ["興起中的唐人街", "衰落中的唐人街", "新潮的唐人街", "時尚的唐人街。"], "optImg": false, "ans": 1, "exp": "(Ｂ)當時唐人街主要以單身漢為主，加上黑社會與員警勾結，成為煙館、賭館、妓院林立，衛生環境極差的聚落。", "figs": [], "small": false}, {"type": "mc", "label": "(３)", "q": "以下有關唐人街成為「國中之國」的詮釋，何者為是？", "opts": ["因為華人政治上強勢，不受美國政府權力管轄，類似上海租界", "因為華人天性喜歡結黨營私干紀犯法，才會形成這種國中之國", "中國城與美國社會並無差異，因電影特殊的想像隱喻使然", "因為華人政治上弱勢，受到排擠，才會形成這麼特殊的聚居點。"], "optImg": false, "ans": 3, "exp": "(Ｄ)在《排華法案》下，唐人街成為華人的避風港，儼然成為一個自治體。", "figs": [], "small": false}, {"type": "mc", "label": "(４)", "q": "以下有關資料一和資料二對唐人街圖像的表述之比較，何者為是？", "opts": ["資料一的唐人街雖然陰暗，可是還有父子親情與倫理道德；資料二則宛如沒有王法", "這兩張圖像的時序不同，資料二有高樓大廈，資料一沒有。我們從此可以看出唐人街的變遷，從彬彬有禮、衣冠楚楚到成為犯罪天堂", "這兩張圖像都說明唐人街衰落，沒有希望", "這兩張圖像都說明唐人街充滿活力與騷動。"], "optImg": false, "ans": 0, "exp": "(Ａ)資料二的背景是幫派槍擊械鬥，可以稱「宛若沒有王法」。(Ｂ)單從這兩張圖像推出唐人街的變遷，實屬太過，且後者在性質上屬電影海報，較易誇大。", "figs": [], "small": false}], "key": "2_48"}, {"sec": "二、題組", "n": "49", "stem": "在「滿洲國農業移民百萬戶移住計畫」之下，日本農民會帶著其他家庭成員，在滿洲複製日本農村，他們被派去創建一個使用與日本相同地名的前哨站，他們抵達後，日本士兵會教他們如何使用長槍，因為這些移民村大多是沿著蘇聯邊界，或附近多有中國游擊隊活動。移居的日本醫生、教師、農業專家的專業人員，都可以獲得雙倍的薪水，而農民家庭可以獲得十公頃的耕地、四公頃的牧地、農具設備、種子、資金，男子也可免除徵兵，交給這些移民的是透過武力驅逐和低價強制購買的當地民眾可耕地，當地農民只有兩種選擇：一是前往未開墾的地區，另一則是成為自己農地的佃農。請問：", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "根據資料可知，日本移民肩負何種任務？", "opts": ["武裝殖民", "同化居民", "驅逐居民", "文化交流。"], "optImg": false, "ans": 0, "exp": "根據資料可知，日本移民肩負武裝任務，且環境惡劣，隨時會遭受攻擊，故可以知道日本移民為武裝殖民。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "由資料可知，日本移民對當地居民造成哪一影響？", "opts": ["提高農業產量", "失去生存空間", "提升生活水準", "擴大耕種面積。"], "optImg": false, "ans": 1, "exp": "日本移民可以免費獲得土地，這些土地都是透過武力驅逐或低價購買而來，因此，當地居民會失去生存空間。", "figs": [], "small": false}], "key": "2_49"}, {"sec": "二、題組", "n": "50", "stem": "一位士人回憶：「四月初，『逆賊』攻陷常州，省城南京中的富戶紛紛遷徙，我奉祖母之命，帶全家遷避蘇州東邊的周庄。叔叔因辦理團練，不能出城。十三日，我僱了船要回省城，逆賊已經攻陷省城，無法進入，只好帶著祖母，就近前往一個有洋槍隊保護的城市避難。」請問：", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "此處逆賊作亂是指哪一事件？", "opts": ["雲南回變", "白蓮教之亂", "捻亂", "太平天國。"], "optImg": false, "ans": 3, "exp": "從文中「逆賊已攻陷省城（南京），……只好帶著祖母，就近逃到有洋槍隊保護的城市」，可以判斷是清末太平天國起事。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "這位士人最有可能就近前往哪一座城市避難？", "opts": ["廣州", "福州", "上海", "漢口。"], "optImg": false, "ans": 2, "exp": "咸豐 3 年太平軍攻陷南京，建都於天京（南京），而離南京最近，且有洋槍隊保護的城市是上海。", "figs": [], "small": false}], "key": "2_50"}, {"sec": "三、多選題", "n": "51", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "有學者指出，清季回民發生的回民變亂，不僅涉及西北少數民族與漢民族的關係，也牽涉到國家領土主權完整的問題。請問回民變亂涉及下列哪些地區？", "opts": ["陝西", "山西", "甘肅", "新疆", "雲南。"], "ans": [0, 2, 3, 4], "exp": "清季的回民變亂包括雲南回變、陝甘回變、新疆回變，未涉及山西。", "figs": []}], "key": "3_51"}, {"sec": "三、多選題", "n": "52", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "在明治維新後，日本政府有鑑於領土狹小，鼓勵國人向海外進行有計畫的移民，請問下列哪些地區有大量的日本人移居？", "opts": ["夏威夷", "印度", "巴西", "秘魯", "南非。"], "ans": [0, 2, 3], "exp": "日本人大量計畫移居的地區有夏威夷、秘魯、巴西、加州、墨西哥等地。", "figs": []}], "key": "3_52"}, {"sec": "三、多選題", "n": "53", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "某本書中寫道：當時美洲地曠人稀，熱帶之國，需要工人前往開闢，而中國人口過剩，工人雖極勤勞，酬金常少，甚者且無職業，乃以衣食住之困難，釀成叛亂。其附賊敗散，或無家可歸者，皆願渡海避禍，其中推粵人為多，外人召之，運往甲、乙等地。請問甲、乙應填入哪些國家？", "opts": ["美國", "古巴", "印尼", "祕魯", "加拿大。"], "ans": [1, 3], "exp": "題目提及：「當時美洲地曠人稀，熱帶之國」，故答案應是古巴、祕魯。(Ａ)(Ｅ)不是熱帶之國。(Ｃ)不是位於美洲的國家。", "figs": []}], "key": "3_53"}, {"sec": "三、多選題", "n": "54", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "日本針對殖民地曾進行「計畫性移民」，鼓勵其國民移居臺灣、滿洲、朝鮮等地區，請問日本推動移民的因素有哪些？", "opts": ["減緩國內人口壓力", "便於控制殖民地", "補充殖民地缺少勞力", "將重工業導入殖民地", "想要獲得殖民地的資源。"], "ans": [0, 1, 4], "exp": "(Ｃ)臺灣、滿洲、朝鮮的勞動力未有不足現象。(Ｄ)日本的重工業發展以日本本土為主。", "figs": []}], "key": "3_54"}, {"sec": "三、多選題", "n": "55", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "時至今日，有關全球移民在民族認同上的變化敘述，下列何者正確？", "opts": ["認同與思鄉之情逐漸淡化", "以「落葉歸根」的認同意識為主", "淡化意識多與融合當地生活習俗有關", "「世代更迭」亦促使其祖國認同趨於淡化", "多以「華（日、韓）僑」一詞，取代「華（日、韓）裔公民」。"], "ans": [0, 2, 3], "exp": "(Ｂ)以「落地生根」的認同意識為主。(Ｅ)多以「華（日、韓）裔公民」取代「華（日、韓）僑」一詞。", "figs": []}], "key": "3_55"}, {"sec": "三、多選題", "n": "56", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "倘若母國與僑居地發生政治或軍事衝突，移民面臨不公平對待，生活出現困難。下列相關敘述何者正確？", "opts": ["日軍擴大在中國的占領時，啟用一些臺灣人擔任公職，使不少中國人懷疑臺灣人是日本帝國的幫凶", "太平洋戰爭爆發後，日本移民的國家忠誠受到部分美國人質疑，美國政府有時視他們為敵國間諜", "東南亞各國在 20 世紀紛紛脫離獨立建國，境內華商豐厚的企業勢力，往往成為僑居地民族主義與政治操作的箭靶", "在美國出生成長的華人子弟被稱為「ABC」（America Born Chinese），他們的國族認同和文化傳統與父祖不同", "移民選擇申請僑居地的國籍，積極融入當地社會中。"], "ans": [0, 1, 2], "exp": "(Ｄ)(Ｅ)選項主要是在說明，移民為求生存不僅要面對自然環境的挑戰，更需適應當地的文化與社會規範。", "figs": []}], "key": "3_56"}, {"sec": "三、多選題", "n": "57", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "在近代，日本政府曾希望透過輸出勞動力，來增加日本收入，並且藉機推廣日本產品到海外，而動用國家力量來規劃移民工作，以求勞工順利輸出。請問有哪些國家符合相關敘述？", "opts": ["夏威夷", "美國", "秘魯", "巴西", "菲律賓。"], "ans": [0, 2, 3], "exp": "(Ａ) 19 世紀中期夏威夷發展製糖業，夏威夷國王與日本簽約輸出勞工。(Ｂ)美國未簽訂，反而曾與日本達成協議，限制移民。(Ｃ)(Ｄ)日本政府曾組織「海外興業會社」招募移民往南美洲，如秘魯與巴西。(Ｅ)菲律賓是在日本軍事擴張後才有日本移民，而非輸出勞動力。", "figs": []}], "key": "3_57"}, {"sec": "三、多選題", "n": "58", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "關於日本人在 19 世紀中葉移民海外的群體，下列哪些敘述正確？", "opts": ["前往夏威夷與中南美洲的日本移民，所從事的產業是完全一樣的", "皆為日本人民私自前往，未獲國家支持", "日本人大規模前往美國原因與當地排華風氣有關", "20 世紀後，美國的日本人勞動力需求與日俱增，造成大規模日本移民風潮", "日本人前往夏威夷曾經是定期招募的。"], "ans": [2, 4], "exp": "(Ａ)日本人移民到夏威夷主要是從事糖業，但在中南美洲則是熱帶栽培業以及礦業。(Ｂ)日本政府常與外國的官方簽約後進行招募。(Ｄ) 20 世紀後，美國亦出現排日風潮，美日協議限縮日本移民數量。", "figs": []}], "key": "3_58"}, {"sec": "三、多選題", "n": "59", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "清朝國勢在乾隆中葉後逐漸衰微，並在十九世紀中葉以後，歷經太平天國、捻亂及雲南、陝甘、新疆回變等大動亂，這些動亂對中國造成下列哪些影響？", "opts": ["人民生命財產損失慘重", "為了避免回漢衝突再起，將回民遷移至甘肅、寧夏等地，與漢人社會隔絕", "漢人的政治勢力大為提升", "不僅是滿漢勢力的消長，亦為中央與地方權力消長的關鍵", "回民為躲避清軍鎮壓，而逃往中南半島及中亞一帶。"], "ans": [0, 1, 2, 3, 4], "exp": "太平天國起事使得長江流域死亡人數達四、五千萬人，雖然因此暫緩了人口壓力，但戰禍區卻數十年不能恢復以往的盛況。另外，事變過程中湘、淮軍等漢人組織的地方武力興起，則使漢人權力漸長，地方勢力坐大。藉宗族、鄉土觀念以凝聚團結意識，俾能指揮、訓練及效力。但從此國家軍隊也漸轉移到地方大員手中。", "figs": []}], "key": "3_59"}, {"sec": "三、多選題", "n": "60", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "一戰期間，因為人力缺乏，交戰國向外招募勞工，以便讓其國民可以效命沙場。此時，中國華北有十萬名勞工到歐洲戰場服務，他們多半來自山東、河北、湖北、安徽各省。華人沒有直接參戰，只負責一些非戰鬥性工作。請問召募華工的是哪些國家？", "opts": ["英國", "德國", "奧國", "義大利", "法國。"], "ans": [0, 4], "exp": "中國原先保持中立，後來加入協約國，故華工會接受英、法等國的召募前往歐洲戰場工作。", "figs": []}], "key": "3_60"}, {"sec": "三、多選題", "n": "61", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "下列關於 19 世紀朝鮮半島人民移居海外的敘述，何者正確？", "opts": ["因日本介入朝鮮政局，引發動亂，農業生產受影響，人民出走更明顯", "日併朝鮮，更逼迫數十萬朝鮮人移民日本，從事低薪、長工時的採礦、運輸等工作", "因俄國入侵東北，居民逃離不回，朝鮮人趁機在東北開墾荒地", "清頒布國籍條例，在華朝鮮人獲得入籍保障，朝鮮人因不滿被日本合併，紛紛移居東北", "一次大戰時，俄國為補充兵源，允許朝鮮人入籍，使移民人數再度攀升。"], "ans": [0, 1], "exp": "(Ｃ) 1900 年，俄國入侵東北。(Ｄ)國籍條例頒布於 1909 年。(Ｅ)一次大戰發生 1914～ 1918 年。", "figs": []}], "key": "3_61"}, {"sec": "三、多選題", "n": "62", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "清代漢人大量移居臺灣，是由於家鄉人口壓力而需要找尋其他可提供生產機會的地方，請問下列哪些例子，與早年漢人移居臺灣的原因相同？", "opts": ["1850 年代移往東北的朝鮮移民", "1880 年移往美國的日本移民", "1910 年代移往中國東北的朝鮮移民", "1930 年代移往滿洲的臺灣移民", "1940 年代移往東南亞的日本移民。"], "ans": [0, 1], "exp": "(Ａ)朝鮮因人口壓力與開港通商，不斷向東北移動。(Ｂ)日本因人口壓力，在 19 世紀下半移往美國尋找工作機會。(Ｃ)主要與日本殖民朝鮮導致人民流亡有關。(Ｄ)主要與日本向滿洲擴張有關。(Ｅ)受日本南進政策影響。", "figs": []}], "key": "3_62"}, {"sec": "三、多選題", "n": "63", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "華人向來「安土重遷」，但在 19 世紀以後，閩粵沿海地區的人民大量移往海外發展。其相關的原因分析，何者敘述正確？", "opts": ["閩粵沿海多島嶼良港，出海容易", "閩粵地區的可耕地有限，人口過剩", "社會上動亂不斷，生命飽受威脅，激起向外發展的決心", "清代後期為增加商稅的收入，轉而逼迫人民移民海外", "清朝對外戰爭失敗，殖民地國引進工商業、宗教衝擊傳統價值，加速人群移動。"], "ans": [0, 1, 2, 4], "exp": "(Ｄ)清代自甲午戰後開始重視工商業發展，強調「商戰」，但並未因此逼使人民向海外移民。", "figs": []}], "key": "3_63"}, {"sec": "三、多選題", "n": "64", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "某一時期，日本天皇頒布敕令，主題為南滿鐵道株式會社成立之要件，內容包括股票募集的相關規定。不久之後，會社的股票售罄，並在英國以公司債的方式進一步得到大筆資金。根據上述，請問以下的推論何者最符合歷史事實？", "opts": ["「南滿」是在中國東北一帶", "該會社的部分資金來自民間", "該會社為移民計畫建立基礎", "敕令最有可能在甲午戰爭後頒布", "臺灣人因語言優勢頗受該會社歡迎。"], "ans": [0, 1, 2, 4], "exp": "南滿鐵道株式會社（簡稱滿鐵）成立於日俄戰爭（1904～1905）後，該會社是開發中國東北的組織，以強化日本對中國東北的控制力，日後更大力推動日本移民中國東北計畫。根據題幹，滿鐵發行股票及公司債，可見有民間資金挹注。此外，當時的臺灣是日本的殖民地，而臺灣人會講中文，因此在中國東北有語言優勢，因此符合資格（如通日語）的人士頗受南滿鐵道株式會社的歡迎。", "figs": []}], "key": "3_64"}, {"sec": "三、多選題", "n": "65", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "小華對於近現代海外華人的歷史有濃厚的興趣，且正在積極搜尋相關的文獻記載，並依據華人參與的經濟活動歸納為不同的主題。請問下列哪些項目最有可能是他會列出的主題？", "opts": ["美、加的鐵路工程建設", "美西的淘金熱潮與墾荒", "中美洲巴拿馬運河的開鑿", "巴西的咖啡業與林地開拓", "北海道的拓殖與現代化。"], "ans": [0, 1, 2], "exp": "(Ｄ)與日本移民的活動有關。(Ｅ)日本內地的移民。", "figs": []}], "key": "3_65"}, {"sec": "三、多選題", "n": "66", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "明誠利用寒假閱讀一本關於新加坡華僑的傳記，對這些人物的事蹟與貢獻深感敬佩。請問明誠在閱讀傳記時，最有可能會看到下列哪些內容？", "opts": ["經營的事業廣泛，包括橡膠與食品等多種產業", "陳嘉庚創辦的《叻報》有助宣揚革命運動與抗日的輿論", "多數華僑熱心教育事業，曾創立中學及大學", "部分華僑曾經協助南洋華人抵制《排華法案》與爭取權利", "抗戰期間，曾領導僑界積極以捐款支持抗日事業。"], "ans": [0, 2, 4], "exp": "(Ｂ)《叻報》是由薛有禮創辦。(Ｄ)新加坡並無《排華法案》。", "figs": []}], "key": "3_66"}, {"sec": "三、多選題", "n": "67", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "附表表列明、清兩代中國人口與耕地變化情形：<div class='fig'><img data-src='f-019-0.png'></div>請問關於上表的解釋，哪些較為合理？", "opts": ["平均耕地數明顯較少的時期，應為社會動亂爆發的高峰期", "清初人口大減，應與明末清初大規模社會動亂有關", "清初人口大減，與同時期人口大量移居海外亦有關", "16 世紀末人口大增，占城稻的推廣有效降低爆發動亂的風險", "大清盛世人口激增，卻沒有發生大型民變，這與外地新作物引進有關。"], "ans": [0, 1], "exp": "(Ｃ)英法聯軍前，清廷禁止人民移居海外。(Ｄ) 16 世紀末人口激增，然由於朝綱不振，內外用兵，加上天災連年，流寇紛起。(Ｅ)原產美洲的番薯、玉米、花生、馬鈴薯等作物早在明代中葉已傳入中國，應是與不斷開發新耕地有密切關係，但中期起，耕地成長即陷於停滯狀態。", "figs": []}], "key": "3_67"}, {"sec": "三、多選題", "n": "68", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "明治維新後，日本政府大力參與經濟活動，推進工業革命。由政府推動建立的第一批近代大企業，主要是剝削農民以獲得龐大的資金。課捐雜稅令許多破產的農民離開農村到城市謀生，城市卻無法消化大量湧入的人口。從 19 世紀後期開始，明治政府通過海外移民以減輕國內過剩人口的壓力。請問當時哪些地方有大量的日本移民？", "opts": ["夏威夷", "關島", "滿洲", "巴西", "臺灣。"], "ans": [0, 1, 3, 4], "exp": "(Ｃ)滿洲要到 20 世紀入侵中國東北後，才會開始展開大規模的移民。", "figs": []}], "key": "3_68"}, {"sec": "三、多選題", "n": "69", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "雪雁是來自東南亞的僑生，在某次作歷史報告時，她提到自己的祖父當時是從福建遷徙到東南亞。就華僑史的發展情形而言，下列敘述何者正確？", "opts": ["雪雁的祖先在移居東南亞初期，僅能從低下階層做起", "雪雁的祖先在經商的過程中，經常必須和歐洲統治者合作", "20 世紀初期，清政府才開始在當地設置領事館處理僑務", "由於華人握有優厚的經濟資源，經常遭到當地住民嫉妒", "父親係華人，母親係馬來人，因此她在當地被稱為「峇峇」。"], "ans": [0, 1, 3], "exp": "(Ｃ) 19 世紀末期。(Ｅ)雪雁係女子，故應被稱為「娘惹」；男子才稱「峇峇」。", "figs": []}], "key": "3_69"}, {"sec": "三、多選題", "n": "70", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "日本在近現代時期，隨著其國力強大，開始有移民行動。請問：當時移民的最主要目的為何？", "opts": ["紓緩人口壓力", "學習各地不同文化", "歐美國家對其侵略產生戒心", "加強對殖民地的控制", "厚植殖民地的國防力量。"], "ans": [0, 2, 4], "exp": "日本在近現代時期的移民，最主要目的為紓緩人口壓力、加強對殖民地的控制與厚實邊境國防。", "figs": []}], "key": "3_70"}, {"sec": "四、混合題", "n": "71", "stem": "廣州委員會同華官嚴禁黃埔江中船隻，運出豬仔，頗著成效。豬仔貿易遂以香港、澳門為中心。香港政府認為罪惡，後始嚴行禁之。葡萄牙於其統治下之澳門，保護罪犯，時稱其地之商業，以販賣人口為最盛，受騙之人抵於澳門，將即喪失自由。外商俟船入港，驅之登船，聚數百人於一船，其船艙小汙穢，飲食惡劣。工人見其遠離家鄉，號哭不已，其體弱者或罹病死，不堪痛苦者嘗自殺死，監者無論何時，得痛鞭之，其狀況所謂人間地獄也。請問：", "figs": [], "subs": [{"type": "text", "label": "(１)", "q": "從以上資料可知，何地始終允許豬仔貿易？", "ans": "澳門", "exp": "廣州、香港禁止販賣豬仔，只有澳門盛行人口販賣。", "rubric": "", "fields": [], "figs": []}, {"type": "mc", "label": "(２)", "q": "華工被稱為「豬仔」的原因為何？", "opts": ["因被騙而失去自由", "被關入船艙之中", "因遠離家鄉而痛哭", "常遭受鞭打。"], "optImg": false, "ans": 0, "exp": "「豬仔」為失去自由的契約華工。", "figs": [], "small": false}], "key": "4_71"}, {"sec": "四、混合題", "n": "72", "stem": "日本有一支少數民族，向聯合國抗議日本的同化政策造成傳統文化的流失，但日本政府回應：「享有自己的文化，實踐自己的宗教，以及使用自己的語言是被我國憲法所保障的每個人的權利。但在聯合國《人權規約》中規定意義的少數民族，在我國不存在。」請問：", "figs": [], "subs": [{"type": "text", "label": "(１)", "q": "這支少數民族為何？", "ans": "阿伊努族", "exp": "住在北海道的阿伊努人，在明治維新後，因日本的同化政策失去了土地、文化及謀生技能，故向聯合國提出抗議。近年日本才改變對他們的政策。", "rubric": "", "fields": [], "figs": []}, {"type": "mc", "label": "(２)", "q": "這支少數民族居住在日本哪一地區？", "opts": ["本州", "四國", "九州", "北海道。"], "optImg": false, "ans": 3, "exp": "住在北海道的阿伊努人，在明治維新後，因日本的同化政策失去了土地、文化及謀生技能，故向聯合國提出抗議。近年日本才改變對他們的政策。", "figs": [], "small": false}], "key": "4_72"}, {"sec": "四、混合題", "n": "73", "stem": "請閱讀下文，回答相關問題：當時的智利共和國聖地亞哥大區區長杰明維古納在距離首都 100 多公里外的奇約塔，見到 10 名中國人在一家私人莊園工作。之後，他在智利北部又看到大約 50 名華工。這可以說是中國移民在智利的最初記載。現有資料很難考證這些華工是如何到達智利的，但根據推測，很有可能是從北邊的秘魯進入智利境內。而後，智利與秘魯、玻利維亞因爭奪南太平洋沿岸阿塔卡馬沙漠硝石、鳥糞礦產地，爆發了南美太平洋戰爭。智利軍隊在秘魯解救了一批中國苦力，獲得自由的中國人便自發加入智利軍隊。當地人民同華僑也能友好相處，有不少華僑與當地婦女結婚。根據 1926 年北部城市塔拉帕科（paratacá）大區政府對華人經商情況的調查顯示：共計 350 家中國商戶中，有 269 家雜貨店，32 家牛肉店，7 家麵包房，7 家餐館，6 家理髮店，5 家進口公司，4家只提供晚餐的飯館，3 家洗衣店。但在此之後的華人數量便因移民政策因素，人口未再增加。", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "上述杰明維古納見到華工的紀錄，最有可能是在下列哪個時期？", "opts": ["1810 年代", "1860年代", "1890 年代", "1910 年代。"], "optImg": false, "ans": 1, "exp": "早期華人非法移民主要移往東南亞地區，題文中在美洲的華人人數推估不在少數，可見得應是在華人已可合法出國當契約勞工的時代，移出地區包含美洲與紐、澳地區。", "figs": [], "small": false}, {"type": "text", "label": "(２)", "q": "若我們要由上文論述移民的落地生根，可由哪兩個方面去佐證？（100 字內）", "ans": "華僑與當地婦女結婚。從勞工到經營多種類型的商行", "exp": "", "rubric": "<div class='pre'>評分原則：\n<img data-src='f-020-0.png' class='inimg'></div>", "fields": [], "figs": []}], "key": "4_73"}, {"sec": "四、混合題", "n": "74", "stem": "甲大臣認為：自從乾隆年間平定新疆一百多年以來，每年都要花費數百萬兩餉銀，現在又要竭盡天下的財力去贍養大軍西征，還不如允許阿古柏政權獨立。乙大臣則反駁，他認為：如果丟失新疆，則這塊土地不是被西方的丙國勢力所控制，就是被北方的丁國鯨吞，中國隨即失去西北邊防的關卡要塞和重鎮，使西北邊防無以屏障，到時中國邊防的兵力不但不能削減，反而會大大增加。請問：", "figs": [], "subs": [{"type": "text", "label": "(１)", "q": "乙大臣是誰？", "ans": "左宗棠", "exp": "左宗棠主張塞防論，認為唯有保障新疆，才能保蒙古、京師。", "rubric": "", "fields": [], "figs": []}, {"type": "mc", "label": "(２)", "q": "丙、丁兩國分別是哪兩個國家？", "opts": ["法國、英國", "英國、俄國", "德國、美國", "俄國、日本。"], "optImg": false, "ans": 1, "exp": "英國的殖民地印度、勢力範圍西藏皆位於西方，俄國則位於北方。", "figs": [], "small": false}], "key": "4_74"}, {"sec": "四、混合題", "n": "75", "stem": "日本為了防禦某國的進攻，將一半移民安置在邊境地區，一旦開戰，這些移民地區不僅可以解決兵源和軍需供應不足的問題，還可以起到鞏固邊境的防禦作用。1932 年 1 月，學者們向日本拓務省當局提出《移植民事業計畫書》，主張以在鄉軍人為主體，向全國範圍內募集移民，「移民案」得到了日本拓務省的認可。「武裝移民」是由「全副武裝的退伍軍人組成，所有人員每人一支步槍，此外，還有兩門迫擊炮，威克斯式機關槍三挺，在警備上相當於屯田兵制的『屯墾大隊』」，堪稱潛伏在農村的「預備役」。移民大多是來自日本長野縣、琦玉縣、山形縣等貧困地區，日本這群移民很大程度是採取了「寓兵於農」的政策，和平時期務農為生，一旦有戰事的時候會武裝起來，成為鎮壓抗日人民的日本訓練地。", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "請問上文日本欲抵禦的是哪一國？", "opts": ["中國", "朝鮮", "美國", "俄國。"], "optImg": false, "ans": 3, "exp": "1931 年後，日本為了有效掌控中國東北，以及防堵俄國勢力擴張，採用武裝移民政策。", "figs": [], "small": false}, {"type": "text", "label": "(２)", "q": "請由上文內容，試著說明除了防禦外，日本實施移民計畫還可達到哪兩項優勢？（40 字內）", "ans": "一是可將日本貧困農民移到中國東北，二是協助日本對東北地區管控，可協助鎮壓", "exp": "", "rubric": "<div class='pre'>評分原則：\n<img data-src='f-021-0.png' class='inimg'></div>", "fields": [], "figs": []}], "key": "4_75"}, {"sec": "四、混合題", "n": "76", "stem": "任何一個方言群體進入一個新移居地的維生方式，必然與他們在原鄉已熟悉的技能有關，例如：廣東人擅長種植經濟作物、客家人擅長開發山林、閩南人則是領先於金融與航海領域。那些較早抵達移居地的方言群體會在一個或幾個領域占有優勢，隨後，每一個方言群體也一定會招收自己的親友或同鄉到自己的店裡當夥計，像是客家人和廣東人在馬來西亞的礦產公司要招收新工人時，必定招收自己人，而與此相反的是，當外人想要進入某一方言群體的特定生意領域時，可能就得付出昂貴的成本或風險，這就是為什麼許多東南亞的華人移民會形成對當地某一行業的壟斷。這一基本原則也體現在華人移民與當地居民之間，對於外來移民群體而言，能夠保護自己行業最有效的途徑，就是在商品價格或特殊服務方面，做到當地人不願、也不能競爭的程度，成功的華商固守自己的商業王國，使當地人根本不得其門而入，由此產生的敵意也孕育了排華行動。", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "請問上述題文討論的主題可能為何？", "opts": ["華人移民的就業特性", "傳統行業的發展模式", "移民原鄉優勢的技能類型", "移入地居民興起排華運動。"], "optImg": false, "ans": 0, "exp": "(Ｂ)題文的焦點並非探討行業如何發展，而是華人移民如何透過原鄉技能和人際網絡在新移居地取得就業優勢。(Ｃ)雖然題文提及各方言群體的原鄉技能（如種植、開發、金融等），但這僅是背景，主要目的是說明這些技能如何影響就業特性，而非專注於列舉技能類型。(Ｄ)題文提到排華行動，但僅是華人移民壟斷行業後的結果，並非討論的主題。", "figs": [], "small": false}, {"type": "text", "label": "(２)", "q": "根據題文所述，比較晚到的移民通常仰賴哪兩種關係取得工作，導致會有特定移民群體對某一行業有壟斷的現象？", "ans": "血緣、地緣（或方言）", "exp": "先行的移民者基本都會在移入地形成至少一個職業領域，並如此作為一代又一代後繼移民的依靠，讓晚到的移民可以透過血緣或地緣（同方言）關係的協助，在移入地順利落腳生活，而新居地移民社群也仰賴持續補充的新移民得以延續和擴大。", "rubric": "<div class='pre'>評分原則：\n<img data-src='f-022-0.png' class='inimg'></div>", "fields": [], "figs": []}], "key": "4_76"}, {"sec": "四、混合題", "n": "77", "stem": "1856 年 8 月，杜文秀聚眾起義，起義軍攻克大理，並以此為根據地建立政權。他自任「總統兵馬大元帥」，宣傳響應□□，建立大理政權，廢除清朝年號，制定「聯合回漢一體，豎立義旗，驅逐韃虜，恢復中華，剪除貪汙，出民水火。」的綱領，規定各民族之間一律平等的原則。請問：", "figs": [], "subs": [{"type": "text", "label": "(１)", "q": "□□應填入當時哪一支反政府組織？", "ans": "太平天國", "exp": "19 世紀中，太平天國攻入陝西，與雲南回變的領袖合作。", "rubric": "", "fields": [], "figs": []}, {"type": "mc", "label": "(２)", "q": "杜文秀聚眾起義的原因為何？", "opts": ["滿清官員貪汙腐敗", "清朝官兵濫殺回民", "《南京條約》喪權辱國", "滿清強迫回民改宗。"], "optImg": false, "ans": 1, "exp": "雲南回變的原因是滿清官兵濫殺回民，引起穆斯林的忌恨。", "figs": [], "small": false}], "key": "4_77"}, {"sec": "四、混合題", "n": "78", "stem": "請閱讀以下資料：資料一：他們在 1920 年代前來中國東北境內從事拓墾，帶來新品種的水稻，修建水利設施，對於當地稻作糧產的增加有相當程度的影響。資料二：某國在 19 世紀後期曾有許多移民前來澳洲從事珍珠貝的採集，但後來澳洲政府禁止他們從事此項產業，甚至還禁止該國移民前來澳洲。資料三：這些移民在巴西開墾原始林地，且帶來新品種的經濟作物，對於巴西的農業發展與農產外銷有重要的影響。", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "關於以上資料，請問下列說明哪一項正確？", "opts": ["以上三則資料的內容都與近現代日本海外移民的活動有關", "資料一是描述朝鮮人在滿洲國招募下前往東北三省發展的情況", "資料二與資料三描述的移民都曾因僑居國的政策壓迫而大量離境", "資料三是指日裔移民，他們在當代巴西已投入眾多產業且建立企業。"], "optImg": false, "ans": 3, "exp": "(Ａ)資料一是指前去中國東北的朝鮮移民。(Ｂ)當時滿洲國還未成立。(Ｃ)只有資料二的澳洲政府後來禁止日本移民經營採貝業，及禁止增加日本移民。", "figs": [], "small": false}, {"type": "text", "label": "(２)", "q": "依資料二的內容，為何澳洲政府會對該國移民做出這些限制？", "ans": "移民已影響到僑居地的工商業，並排擠當地工人就業", "exp": "", "rubric": "<div class='pre'>評分原則：\n<img data-src='f-022-1.png' class='inimg'></div>", "fields": [], "figs": []}], "key": "4_78"}, {"sec": "四、混合題", "n": "79", "stem": "美國加利福尼亞州、澳大利亞洲先後發現□□，工人應募而往。其去國也，立有合同，稱為合同工人，其條件或服務數年後即得自由，或月薪四元。其在英美者，待遇較優，其往他國者，則為販賣之奴隸，喪失自由，強迫工作，其終日之勤勞，待遇之惡劣，生活之苦狀，不啻畜類，故俗呼為豬仔，清廷初置不問。請問：", "figs": [], "subs": [{"type": "text", "label": "(１)", "q": "□□內應填入什麼？", "ans": "金礦", "exp": "1860 年《北京條約》簽訂前，華人都是私自出洋，未受到政府的保護；簽約後，清廷才允許人民出洋。", "rubric": "", "fields": [], "figs": []}, {"type": "mc", "label": "(２)", "q": "要到哪一條約簽訂後，清廷始准華工出境？", "opts": ["《南京條約》", "《天津條約》", "《北京條約》", "《馬關條約》。"], "optImg": false, "ans": 2, "exp": "1860 年《北京條約》簽訂前，華人都是私自出洋，未受到政府的保護；簽約後，清廷才允許人民出洋。", "figs": [], "small": false}], "key": "4_79"}, {"sec": "四、混合題", "n": "80", "stem": "最初將日本勞工引入夏威夷島，不僅是因為勞力不足，同時也是藉以抗衡早先進入當地，且數量逐漸龐大的□□工人。以 1884 年為例，當地約有 180,00 名的□□工人，占島上總人口的四分之一到五分之一。這些為數不少的工人，常有抗爭、罷工要求加薪等事件，使得當地白人雇主頗為頭痛。請問：", "figs": [], "subs": [{"type": "text", "label": "(１)", "q": "□□內應填入何者？", "ans": "中國（華人）", "exp": "華工最早被引進夏威夷，主要是在甘蔗園工作，後因美國公布《排華法案》的影響，華工數量逐漸減少，由日本勞工取而代之。", "rubric": "", "fields": [], "figs": []}, {"type": "mc", "label": "(２)", "q": "引入日本勞工是進行哪一類工作？", "opts": ["種可可", "種甘蔗", "挖金礦", "修鐵路。"], "optImg": false, "ans": 1, "exp": "華工最早被引進夏威夷，主要是在甘蔗園工作，後因美國公布《排華法案》的影響，華工數量逐漸減少，由日本勞工取而代之。", "figs": [], "small": false}], "key": "4_80"}, {"sec": "四、混合題", "n": "81", "stem": "你可能聽過他們的名字或歌聲：梁靜茹、戴佩妮、柯以敏、巫啟賢、品冠、光良、阿牛、曹格等，但你可能不知道他們都有一個共同的背景，那就是□□華人的身分。他們能在華人世界大放異彩或許也跟他們華裔在□□受到不平等待遇有關。華人在□□的不平等待遇是明文寫在國家憲法中。□□的憲法中，公民分為土著（Bumiputera）和非土著兩種，前者指的是□□人和其他原住民，後者指的是華人和印度人。自獨立建國以來，就以「□□人同意接納華人及印度人為本國公民，惟後者須承認作為當地□□土著（Bumiputera）所專享之特殊地位。」限制了當地華人的權利。", "figs": [], "subs": [{"type": "text", "label": "(１)", "q": "上述資料中，這些歌手的國籍與資料中所指的國家為何？", "ans": "馬來西亞", "exp": "從大家熟悉的歌手背景可知，□□是馬來西亞。馬來西亞是南洋華僑集中地之一，最高時期華人占馬來西亞人口將近四成。華人重視教育，即使在異國他鄉也不例外，反而更加重視自己文化的傳承。二戰後馬來西亞政府不承認華文獨立中學的文憑，也不准華人興辦私立大學。1971 年更開始以種族比例即所謂「固打制」（Quota system）而非成績表現作為錄取公立大學的依據，打壓非馬來人的教育機會。所以有許多獨立中學的畢業生畢業後就選擇離開馬來西亞到海外留學。許多人學成後不願再回去當二等公民，所以人才外流的現象十分嚴重。", "rubric": "", "fields": [], "figs": []}, {"type": "mc", "label": "(２)", "q": "關於資料，請根據你的歷史知識判斷下列解讀何者正確？", "opts": ["□□過去曾是荷蘭殖民地，二戰後即強調多元族群與文化", "□□過去曾是英國殖民地，二戰後曾因反共屠殺大量華人", "□□是南洋華僑集中地之一，華文教育現在仍受打壓限制", "□□是南洋重要轉運港口，也是東南亞華人比例最高國家。"], "optImg": false, "ans": 2, "exp": "馬來西亞曾是英國殖民地，但爆發反共屠殺華人的地區是印尼，而東南亞華人比率最高的國家是新加坡，可知(Ｃ)正確。", "figs": [], "small": false}], "key": "4_81"}, {"sec": "四、混合題", "n": "82", "stem": "僑居海外的移民，暫時性地居住在老家以外的地方，形成了一些特殊的機構。某一種機構，建立在共同的地緣關係上，這種地緣關係可能是省、縣，也可能是鎮。共同的方言是凝聚力，使他們可以與鄉親無拘無束地自由交流，彼此間產生強烈的互信與感情。請問：", "figs": [], "subs": [{"type": "text", "label": "(１)", "q": "這種海外移民成立的機構稱為什麼？", "ans": "同鄉會館", "exp": "移民遷徙，需要時間適應環境，度過水土不服的難關。以華人移民為例，常效法中國原鄉的規制，在僑居地興建寺廟、宗親或同鄉會館等，藉由這類社會組織，解決新移民在異鄉的生活與貧病照護的問題，但不包含戰鬥、教育、從政等特殊功能。", "rubric": "", "fields": [], "figs": []}, {"type": "mc", "label": "(２)", "q": "下列何者是此機構提供的服務？", "opts": ["教育子弟", "戰鬥訓練", "提供住所", "培養官員。"], "optImg": false, "ans": 2, "exp": "移民遷徙，需要時間適應環境，度過水土不服的難關。以華人移民為例，常效法中國原鄉的規制，在僑居地興建寺廟、宗親或同鄉會館等，藉由這類社會組織，解決新移民在異鄉的生活與貧病照護的問題，但不包含戰鬥、教育、從政等特殊功能。", "figs": [], "small": false}], "key": "4_82"}, {"sec": "四、混合題", "n": "83", "stem": "請先閱讀以下資料：19 世紀中葉這裡是美國加州淘金潮的中心地區，早期華工到美國淘金後多居住於此，稱之為「金山」，但直到在某地發現金礦後，為了與被稱作「新金山」的某地區別，而改稱這個城市為「舊金山」。此時大批中國人聚居在一起，在舊金山建立起美國的第一條唐人街。從 1849 年至 19 世紀末，共有三十萬名華人進入美國，大多集中於西部，這是中國歷史上最大的一次移民潮。初期，移民至此的華人其中絕大部分是為採掘黃金而來，後來則主要從事修築鐵路的工作。1850 年，第一批作為廉價勞動力的華人到達加利福尼亞，他們隨即為這裡的淘金者建造了住所和家宅，當時受到美國人的讚譽：「沒有中國人的幫助，這些淘金者很難在加利福尼亞生活下去」。在加利福尼亞等西部金礦區，華工被稱作「可以依賴的唯一的勞動力來源」。但是這些勤奮刻苦、安分守己的華工也成為種族主義的犧牲品，受到 19 世紀末某一法案的抵制。", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "請問文中所描述的「新金山」指的是哪裡？", "opts": ["日本新潟", "澳洲墨爾本", "秘魯波多西", "南非開普敦。"], "optImg": false, "ans": 1, "exp": "19 世紀中葉舊金山是美國加州淘金潮的中心地區，早期華工到美國淘金後多居住於此，稱之為「金山」，直到澳大利亞的墨爾本發現金礦後，為了與被稱作「新金山」的墨爾本區別，而改稱這個城市為「舊金山」。", "figs": [], "small": false}, {"type": "text", "label": "(２)", "q": "資料中，因哪一法案出爐，在美華工也成為種族主義的犧牲品？", "ans": "《排華法案》", "exp": "華工雖對美國建設帶來貢獻，美國社會卻對華工抱持負面觀感，認為他們以低廉工資破壞市場秩序，擠壓到當地人民的工作機會，加上文化差異，使得白人對華人充滿敵意，排華行動日益激烈。1882 年，國會通過《排華法案》（Chinese Exclusion Act），限制華人移民至美國的人數，此後，前往美國的華工大幅減少。", "rubric": "", "fields": [], "figs": []}], "key": "4_83"}, {"sec": "四、混合題", "n": "84", "stem": "請先閱讀以下資料：資料一：附表為某地區 19 世紀前後農業與人口情況統計：<div class='fig'><img data-src='f-024-0.png'></div>資料二：「凡我兄弟姐妹，皆平等共產，田歸田主，地歸地主，男女皆可分地，並廢纏足，破除偶像，崇拜上帝……」資料三：1850 年代，太平天國控制了長江中下游廣大農村，吸引大量江南農民、破產手工業者及少數海外華僑加入。隨著清軍反攻及內部政爭，控制區人口開始急遽減少，部分百姓向沿海通商口岸逃難，另有一批人輾轉至南洋謀生。資料四：「凡學宮書院，一律廢除，毀去孔子牌位及聖像，棄儒書經史為妖書，不得再讀；學童改讀《新約全書》及《權衡條例》，務使人心歸向天父，破除一切妖魔偶像。」", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "依據上述資料內容來判斷，太平天國的出現背景為何？", "opts": ["農民負擔減輕，生活水準提升", "人均耕地減少、地租比例上升", "國家賦稅減免，促進農業發展", "外國貿易擴張，農民收入增加。"], "optImg": false, "ans": 1, "exp": "由資料內容可知，當時中國出現人口增加但土地有限的問題，人地比例不均導致人民的地租負擔加重，故而當太平天國出現聲稱可以重新分配土地，使人人得以共享財富，便容易吸引貧困人民接受這樣的組織。", "figs": [], "small": false}, {"type": "text", "label": "(２)", "q": "請綜合四則資料所提及的訊息與當時的時空背景來判斷，太平天國最受到中國上層階級抨擊原因為何？（勾選一項）並試說明判斷原因。（40 字內）<div class='fig'><img data-src='f-024-1.png'></div>", "ans": "<div class='pre'><img data-src='f-025-0.png' class='inimg'></div>", "exp": "太平天國主張毀去孔子牌位、將儒家經典視為妖書，否定中國傳統文化價值的舉動引發以儒學思想為基礎所建構而成的士紳階層反感，這是曾國藩等士紳組織湘軍討伐的主要理由。", "rubric": "<div class='pre'>評分原則：\n<img data-src='f-025-1.png' class='inimg'></div>", "fields": [], "figs": []}], "key": "4_84"}, {"sec": "四、混合題", "n": "85", "stem": "1923 年（大正 12 年）9 月 1 日上午 11 點 58 分發生芮氏規模七點九，震源位於相模灣海面的關東大地震，死者與失蹤者總計達前所未有的 10 萬人之譜，其中也包含因流言而被無端殺害的朝鮮人、中國人以及社會主義者。日本的報紙以「不逞鮮人」（可恥的朝鮮人）、「陰謀」形容日益高漲的朝鮮獨立運動，不斷煽動日本國民內心的恐懼與憎恨。日韓合併後，有些朝鮮的小農因土地政策被搶走土地，不得不偷渡日本打工。據說震災當時，日本至少有 8 萬名以上的朝鮮人。自警團（由人民組成的自發性警備團體）以自衛為由砌詞脫罪，不斷搜捕町內的朝鮮人，化身為施暴或殺害朝鮮人的凶暴之徒，就連警官或軍人也因「都是朝鮮人假扮」的流言而被自警團襲擊。事後經過警察的全面調查證實，與朝鮮人有關的流言全是空穴來風。……日本國民心中對統治殖民地的罪惡感，以及報紙形塑的「可怕的朝鮮人」，都讓日本國民害怕被報復，國家的過度反應也令民眾的恐懼增幅，也為襲擊朝鮮人的「藉口」掛了「保證」。（資料來源：https ://news.readmoo.com/2020/06/29/kanto-great-earthquake/）", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "根據上述資料，這些在震災中遭受迫害的朝鮮人，之前會大量留在日本的主要原因，可能是下列何者？", "opts": ["本土工作環境差，前往殖民母國謀生", "遭政府強迫遷徙，因此多為無業遊民", "由於戰爭緣故，被調遣到母國駐守", "祖先來自母國原住民族，有鄉土情懷。"], "optImg": false, "ans": 0, "exp": "第二段有提到「有些朝鮮的小農因土地政策被搶走土地，不得不偷渡日本打工」，可知日本占領朝鮮後，對朝鮮耕地、糧食的徵收，致使許多農民被迫前往日本工作，故答案選(Ａ)。(Ｂ)(Ｃ)(Ｄ)均無法從資料中找到相對應的內容。", "figs": [], "small": false}, {"type": "text", "label": "(２)", "q": "請為這則短文取一個最合適的標題，並請說明理由。<div class='fig'><img data-src='f-026-0.png'></div>", "ans": "媒體操弄下的極端行為，第二段提到日本報紙醜化朝鮮，煽動日本國民的恐懼與憎恨，出現迫害朝鮮人的現象。", "exp": "第二段有提到，日本的報紙以「不逞鮮人」（可恥的朝鮮人）、「陰謀」形容日益高漲的朝鮮獨立運動，不斷煽動日本國民內心的恐懼與憎恨，故後來才會有迫害朝鮮人的現象，因此「媒體操弄下的極端行為」為最合適的標題，其他三個則無法從資料中找到相對應的內容。", "rubric": "", "fields": [], "figs": []}, {"type": "text", "label": "(３)", "q": "資料中呈現的情況，應該是在哪一個災害事件發生後的現象？而又是哪些原因造成對朝鮮人士的迫害？<div class='fig'><img data-src='f-026-1.png'></div>", "ans": "關東大地震，報紙形塑的「可怕的朝鮮人」、國家的過度反應強化民眾的恐懼。", "exp": "○１第一段有提到關東大地震，其中死傷人數也包括因流言而被無端殺害的朝鮮人。○２第三段亦提到，日本國民心中對統治殖民地的罪惡感，以及報紙形塑的「可怕的朝鮮人」，都讓日本國民害怕被報復，國家的過度反應也令民眾的恐懼增幅，也為襲擊朝鮮人的「藉口」掛了「保證」。", "rubric": "", "fields": [], "figs": []}], "key": "4_85"}, {"sec": "四、混合題", "n": "86", "stem": "請先閱讀以下資料：在中國通商口岸存在各種臭名昭著的招工騙局，迫使成千上萬名中國人淪為準奴隸制下的契約華工。他們或遭欺騙、或遭綁架而被強行拖上船，這些人在受威脅的情況下，被迫在不平等的契約上簽字畫押。帝國主義在熱帶地區的大肆擴張需要大量廉價勞動力加以支持，自願移民已經不能滿足殖民帝國對勞動力數量的需求，而使得擄掠華工的人口販子橫行於中國沿海各地。在中國南方，強徵勞工的行為是由某些中國人和西方人聯手操控。那些西方人的招工公所雇用中國爪牙去尋覓獵捕對象，而中國爪牙則依賴其洋人主子在中國享有的治外法權，規避因從事詐欺或綁架而可能受到的懲罰。這些爪牙被英國人稱為「捲毛」，他們有些是受雇於外國人建立於中國港口城市的招工公所，有些是散兵游勇。在中國沿海鄉村，一旦發現貧苦無助之人，通常以介紹工作為藉口騙其上鉤，或是誘惑其去參加賭博，有時則乾脆直接採取武力綁架。", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "根據上文，這個時期的華工主要是被要求從事何種勞動工作？", "opts": ["橡膠樹的種植", "棉花的採集", "港口的搬運工", "戰爭的後勤。"], "optImg": false, "ans": 0, "exp": "19 世紀中期以後，外國以條約迫使中國增開通商口岸，並解除人民出國的限制。多數華工受招工掮客誘騙與擄掠下，運往東南亞，到熱帶栽培業的橡膠園工作。(Ｂ)棉花的種植與採集主要是在美洲地區或印度，當時是以黑人、印度居民做為大量勞動力。(Ｃ)港口的搬運工從 16 世紀東南亞貿易即開始，無須持續補充。(Ｄ)到第一次世界大戰時（20 世紀），因中國參戰才有華工進入歐陸戰場。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "上述情景主要發生的時間為何？", "opts": ["1780 年", "1820 年", "1840 年", "1860 年。"], "optImg": false, "ans": 3, "exp": "由文本提及通商口岸開始有許多華工被誘騙運往熱帶地區做工，以及有治外法權，可知此事主要發生在 19 世紀中期以後，1860 年中英法《北京條約》簽訂迫使清朝增開通商口岸。(Ａ)(Ｂ)中國尚未開放通商口岸。(Ｃ) 1840 年初開放五口通商，大量華工被當作苦力強迫輸出尚未立即開展。", "figs": [], "small": false}, {"type": "text", "label": "(３)", "q": "承上題，請由資料中列舉兩項可判斷說明時間的依據。（60 字以內）", "ans": "<div class='pre'>        「開放通商口岸」，可知是在 1840 年代以後，「帝國主義在熱帶地\n區的大肆擴張」、「西方人的招工公所」等可知與 19 世紀中期以後西方列強在東南亞擴張，並可合法\n招募華工有關</div>", "exp": "", "rubric": "<div class='pre'>評分原則：\n<img data-src='f-027-0.png' class='inimg'></div>", "fields": [], "figs": []}], "key": "4_86"}, {"sec": "四、混合題", "n": "87", "stem": "19 世紀中期，太平洋彼岸的一個新興工業化國家，在淘金熱與跨洲鐵路建設的帶動下，急需大量勞力。來自中國南方沿海地區的移民，因家鄉地少人多、經濟困難及戰爭後社會動盪，紛紛越洋赴此地。他們多從事淘金、鐵路鋪設、農業、洗衣、餐飲等工作，薪資相較當地勞工低廉，且多願接受艱苦環境。然而，隨著經濟景氣轉差與失業率上升，一些當地勞工團體與政治人物開始將失業與低工資問題歸咎於華工，並透過報刊漫畫與演說塑造負面形象，認為他們「搶奪飯碗」、「難以同化」。在這種氛圍下，1880 年代，中央政府頒布法令，禁止華籍勞工新入境，並限制已在當地華人的入籍與居住權。法令生效後，大批華工被迫離開或轉往其他國家謀生；留在當地的華人則集中在特定城區形成族群社區，彼此依靠以應對外部壓力。", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "依據文中的敘述來判斷，當時華工主要是移居下列何地謀求生存機會？", "opts": ["美國", "南洋", "歐洲", "南美洲。"], "optImg": false, "ans": 0, "exp": "(Ａ)美國加州有淘金需求，且有興建太平洋鐵路的需要，因此向中國招攬大量的勞動力，許多華人移民美國協助採礦及修築鐵路，之後更被白人認為華人搶奪其工作機會。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "這些華人移居海外後，會在海外逐漸形成華人社群，在華人的社群中可能會出現何種文化現象？", "opts": ["在當地積極醞釀建立新政權", "因爭奪工作機會而衝突不斷", "建立同鄉會凝聚族群向心力", "積極引進移民地文化與風俗。"], "optImg": false, "ans": 2, "exp": "華人移民海外後，其聚落多形成唐人街或中國城，他們會在聚居處建立宗親會或同鄉館來團結當地華人，藉此凝聚同鄉族人的向心力。", "figs": [], "small": false}, {"type": "text", "label": "(３)", "q": "由文中的內容來看，此地頒布新移民政策的原因為何？（勾選一項）並試說明判斷依據。（40字內）<div class='fig'><img data-src='f-027-1.png'></div>", "ans": "<div class='pre'><img data-src='f-028-0.png' class='inimg'></div>", "exp": "華人移民美國後，因為工資較為低廉，且願意從事淘金、鐵路鋪設、農業、洗衣、餐飲等各式工作，當美國經濟景氣下滑，失業率上升時，便容易引發白人不滿，認為華人搶奪其工作機會。", "rubric": "<div class='pre'>評分原則：\n<img data-src='f-028-1.png' class='inimg'></div>", "fields": [], "figs": []}], "key": "4_87"}, {"sec": "四、混合題", "n": "88", "stem": "資料一：1932 年，日本以滿洲事變（九一八事變）為契機，扶植成立了「滿洲國」，宣稱其為獨立的多民族國家，推行「民族協和」與「王道主義」的理想。然而，滿洲國本質上是日本帝國的傀儡政權，其核心目的是鞏固在東北的軍事與經濟利益。透過推動現代化建設與文化同化政策，滿洲國試圖掩蓋其殖民地本質。隨著日本在二戰中失利，滿洲國於 1945 年迅速瓦解，這段歷史成為日本帝國主義擴張的縮影。資料二：滿洲國雖標榜「民族協和」，但其治理政策與宣傳內容存在巨大矛盾。滿洲國的實際權力掌握在日本關東軍手中，皇帝溥儀僅為象徵性的傀儡。經濟上，滿洲國成為日本的資源供應與軍需生產基地，設立「滿洲重工業開發株式會社」以加速工業化進程。同時，日本推行移民政策，將大量國內農民遷至滿洲建立「開拓村」，意圖解決日本的經濟困境。然而，移民政策造成了當地居民的土地矛盾，並進一步激化了滿洲地區的社會問題。滿洲國還實行高壓統治，通過設置「集團部落」對當地居民進行嚴密控制，並限制其行動自由。這些政策的推行揭示了滿洲國的殖民地本質，表面上的現代化與發展更多是為了服務日本的戰略需求，而非提升當地人民的福祉。資料三：滿洲國的文化政策體現了日本殖民地治理的雙重特性。日本在滿洲國大力推行文化同化，要求當地居民學習日語並接受神道信仰，以削弱民族認同感，實現文化控制。同時，日本以滿洲國首都新京（今長春）為樣板，推動現代化城市建設，展示殖民治理的表面成功。新京的規劃融合現代都市理念，擁有完善的基礎設施和交通網絡，被視為滿洲國「進步」的象徵。然而，這些現代化建設更多地服務於日本的軍事與經濟需求，當地居民的生活並未因此改善。文化同化政策反而引發了民族間的衝突與不滿，進一步加深了殖民治理的矛盾。最終，滿洲國未能建立真正的社會穩定與發展，反而成為日本帝國主義擴張失敗的典型案例。（資料來源：故事編輯部，《現代日本的形成：空間與時間穿越的旅程》，新北：遠足文化，2018。）", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "根據資料，日本扶植滿洲國成立的主要目的是什麼？", "opts": ["建立多民族協和的獨立國家", "成為供應資源與軍需的基地", "打造現代化的城市取代上海", "要解決滿洲地區的民族矛盾。"], "optImg": false, "ans": 1, "exp": "滿洲國的核心目的是為日本提供資源供應與軍事基地，服務帝國擴張需求，答案選(Ｂ)。(Ａ)滿洲國只是日本的傀儡政權，這一說法僅為政治宣傳。(Ｃ)現代化的建設目的是滿足日本取得當地資源的需求，非取代上海。(Ｄ)滿洲國的政策反而加劇民族矛盾。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "根據資料三，滿洲國的現代化建設主要反映了什麼特徵？", "opts": ["促進當地居民的福祉與民族平等", "強調軍事經濟需求先於地方發展", "完全尊重當地居民的文化與習俗", "主要目標解決日本國內經濟問題。"], "optImg": false, "ans": 1, "exp": "滿洲國的現代化建設以軍事和經濟需求為優先，並非促進地方發展，答案選(Ｂ)。(Ａ)現代化建設主要服務於日本的戰略需求，當地居民的福祉被忽視，也未實現民族平等。(Ｃ)文化同化政策是削弱當地民族特色，並非尊重當地文化。(Ｄ)雖然移民政策部分緩解日本農村經濟問題，但現代化建設主要是軍事化和資源開發。", "figs": [], "small": false}, {"type": "text", "label": "(３)", "q": "結合資料二與資料三，分析日本在滿洲國推行的○１移民政策與同化政策產生什麼影響？○２說明對滿洲國治理成效。", "ans": "○１土地矛盾加劇，破壞當地社會結構；削弱民族認同，引發文化衝突；○２激化矛盾，削弱滿洲國的穩定與合法性", "exp": "", "rubric": "", "fields": [], "figs": []}, {"type": "text", "label": "(４)", "q": "以下哪一個選項最能概括滿洲國治理的核心矛盾？請勾選並簡述原因。<div class='fig'><img data-src='f-029-0.png'></div>", "ans": "<div class='pre'>        ○１表面現代化與實際殖民壓迫的矛盾；○２滿洲國\n表面上強調現代化建設和民族協和，但實際上推行高壓政策與文化同化，揭示其本質是日本的殖民地\n工具。這種表裡不一的治理方式正是滿洲國的核心矛盾。</div>", "exp": "滿洲國宣傳現代化建設與文化同化政策，最終目標都是提供日本軍事和經濟資源，實際上就是殖民統治。", "rubric": "", "fields": [], "figs": []}], "key": "4_88"}, {"sec": "四、混合題", "n": "89", "stem": "閱讀下列四則資料，並回答問題：資料一：蟻等生長華國，身出禮儀之邦，為迫飢寒，遂往他邦之域。……屈指二十餘年，不下數萬人矣。溯自到埠以來……憑東家吩咐，放牛牧馬，一任指揮……不意惡夷等恃富凌貧，喪良蔑理，視合同為故紙，等人命如草芥。衣食工銀，惟知吝嗇，憔悴憊倦，莫肯恤憐。常見苛求，恆加打罵，或被枷鎖而力作，或忍飢寒而耕鋤。東家既屬苛殘，官府依然阿比。資料二：苦力在菸園的生活十分悲慘。他們睡於壩上，食於壩上。通常早上四點吃一點冷飯，就要出來工作……直到下午六點鐘，日已西沉才收工吃飯。有時還要開夜工，做到晚上九點。……住的地方是用竹和樹枝樹葉搭的菸寮，把幾塊蕉葉鋪在地上做床，把粗樹枝或大樹根做枕，把煤油箱當餐檯。不蔽風雨，飽受潮溼地氣的侵蝕，就算是鐵漢也難捱。一旦染病，又缺乏藥物治療，死亡相繼，工人有病決不會得到工頭的同情。相反的，反認為工人會「詐病」怠工，仍然逼迫他們工作。資料三：1854 年有一隻船開往古巴，700 名中死去 104 名，死亡率為 15 ％。1852 年…… 810 名豬仔去英屬圭亞那，途中死去 164 名，死亡率為 20 ％。…… 1850 年有 740 名豬仔分裝兩船去祕魯，途中死亡 247 名，死亡率 33 ％。1856 年…… 332 名從香港開往古巴，中途因疾病和自殺死去了 128 名，死亡率達 39 ％……約翰加爾文號裝了 289 名豬仔去古巴，途中死去135 名，死亡率高達 45 ％。資料四：豬仔之由香港、汕頭、廈門、海口來者，客館約費 12 元，客館賣與林八記可得荷銀 40盾，合坡銀 30 元，林再賣於荷人可得 80 盾。該島荷人必選取青年及強有力者方為合格。故價較高，而其凌虐亦更酷。", "figs": [], "subs": [{"type": "text", "label": "(１)", "q": "請問這四段資料所共同關懷的主題為何？", "ans": "華工移民的處境", "exp": "資料一屬華工移民心聲，自述其處境。資料二關乎華工移民的工作條件。資料三說明華工移民在運送過程的死亡率。資料四報導有關華工移民之買賣。透過這四段資料，可知道應是描述華工移民的處境。", "rubric": "", "fields": [], "figs": []}, {"type": "mc", "label": "(２)", "q": "這四段資料中，何者是有關華工自述其處境的資料？", "opts": ["資料一", "資料二", "資料三", "資料四。"], "optImg": false, "ans": 0, "exp": "(Ａ)資料一是華工向同治皇帝的聯名稟文，可以說是華工自述其處境。", "figs": [], "small": false}, {"type": "mc", "label": "(３)", "q": "以下何者屬當今歷史學家對有關華工移民問題的研究報導？", "opts": ["資料一、資料二", "資料二、資料三", "資料三、資料四", "資料一、資料四。"], "optImg": false, "ans": 1, "exp": "", "figs": [], "small": false}, {"type": "mc", "label": "(４)", "q": "這四段資料中，何者屬當時人對華工移民問題的看法，而非華工自述處境，或後人對華工移民問題的研究？", "opts": ["資料一", "資料二", "資料三", "資料四。"], "optImg": false, "ans": 3, "exp": "", "figs": [], "small": false}], "key": "4_89"}, {"sec": "四、混合題", "n": "90", "stem": "資料一：在清朝的幾個世紀的統治中，頭髮一直具有重要的象徵意義，也一直是政治上的敏感問題。剃光頭髮的佛教僧侶是少數幾個可以免於蓄辮的群體之一。在 18 世紀，新疆的穆斯林也得到豁免，讓他們維持傳統的髮型。在其他情況下，不遵守清朝的法令將會招致最嚴厲的處罰。因沒有剃髮而被捕的男子會被斬首，執行逮捕的轄區官員如果沒有嚴厲追緝寬縱叛賊，也會遭到懲處。《薙髮令》是「皇帝用來測試臣僕的試金石」。資料二：「衣著」不僅是一種日常生活的元素，更成為顯示族群、宗教、性別和地位差異的關鍵標誌。人們藉由服裝來區分身分、建立關係，甚至強化彼此的不同。隨著□□定都南京，他們開始有系統地利用衣著來區分軍隊與政治組織中的階級。新兵與俘虜抵達後，立即被要求更換制服，這種轉變成為一種象徵性的行為，顯示歸屬的改變。英國探險家呤唎（Augustus Lindley）對□□的成員與服飾進行了詳細描述。他指出，□□與其被奴役的同胞之間最大的差異之一，就是外表和衣著的截然不同。呤唎認為，清帝國統治下的普通中國人因薙髮制度而失去活力，呈現出漠然且乏味的形象。而與之相比，□□的成員則顯得聰慧、伶俐且充滿活力。他們的頭髮不剃，辮子纏繞在頭頂，綁上紅線並結穗，形成一種獨特的裝飾。這種整潔的髮型與親清分子的短髮殘渣形成鮮明對比。不過，等到□□的都城南京陷落後，城中許多平民立刻剃了頭，向湘軍投誠。資料三：<div class='fig'><img data-src='f-030-0.png'></div>圖一某時期在長江下游區域與廣州流行的髮型圖", "figs": [], "subs": [{"type": "mc", "label": "(１)", "q": "資料一中，《薙髮令》透過改變外貌來達成下列何種政治目的？", "opts": ["統一宗教信仰", "建立忠誠象徵", "強化地方權力", "展現文化包容。"], "optImg": false, "ans": 1, "exp": "文中提到《薙髮令》是「皇帝用來測試臣僕的試金石」，且未遵令者將受重罰，可判斷目的在於以剃髮作為效忠清廷的象徵，答案選(Ｂ)。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "資料三是某時期在長江下游區域與廣州流行的手繪圖像，這個圖像最早可能在什麼時候出現？", "opts": ["17 世紀末", "18 世紀初", "18 世紀中", "19 世紀中。"], "optImg": false, "ans": 3, "exp": "該圖像為太平天國成員，最早應在 19 世紀中出現，答案選(Ｄ)。", "figs": [], "small": false}, {"type": "text", "label": "(３)", "q": "資料二的□□是指某政權，請問該政權的名稱？", "ans": "太平天國", "exp": "根據「隨著□□定都南京」、「□□與其被奴役的同胞之間最大的差異……」等敘述，可知是清末的太平天國。", "rubric": "", "fields": [], "figs": []}, {"type": "text", "label": "(４)", "q": "根據上述三則資料，以下哪一個選項，最能反映清朝政府與□□政權，在統治合法性建構上的共同手段？請概述理由。<div class='fig'><img data-src='f-031-0.png'></div>", "ans": "○１藉由外表象徵服從統治；○２髮型或服裝的規定，都是藉由對外表的規範，象徵個人是否服從統治政權的合法性。", "exp": "清朝通過《薙髮令》強制改變臣民髮型，意圖以服從來維持統治秩序；太平天國則以整潔的髮型和鮮明的服裝規範象徵另一種統治秩序，這一特徵反映建構統治合法性的核心策略。", "rubric": "", "fields": [], "figs": []}], "key": "4_90"}];
let SECS=[];
const L="ABCDE";
let DATA=[], ST={}, FILTER="all";
const KEY="b2ch4-quiz-v1";
try{ST=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){ST={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const img=(src,cap)=>`<div class="fig"><img data-src="${src}" alt="${esc(cap||"附圖")}">${cap?`<div class="cap">${cap}</div>`:""}</div>`;
const figs=(arr,small)=>arr&&arr.length?`<div class="figs${small?" small":""}">${arr.map(f=>img(f.src,f.cap)).join("")}</div>`:"";
const fixImgs=root=>root.querySelectorAll("img[data-src]").forEach(i=>{i.src=IMGS[i.dataset.src];i.removeAttribute("data-src");i.loading="lazy"});

function subId(it,j){return it.key+"-"+j}
function status(id,s){ // returns 'ok'|'bad'|'part'|null
  const r=ST[id]; if(!r) return null;
  if(s.type==="mc") return r.pick==null?null:(r.pick===s.ans?"ok":"bad");
  if(s.type==="ms") return r.done?(JSON.stringify([...(r.sel||[])].sort())===JSON.stringify(s.ans)?"ok":"bad"):null;
  return r.self||null;
}

function render(){
  const main=document.getElementById("main");
  let html="", lastSec="", shown=0;
  DATA.forEach(it=>{
    const subs=it.subs.map((s,j)=>({s,j,id:subId(it,j)}));
    if(FILTER==="wrong"){ if(!subs.some(x=>["bad","part"].includes(status(x.id,x.s)))) return; }
    else if(FILTER==="todo"){ if(!subs.some(x=>!status(x.id,x.s))) return; }
    else if(FILTER!=="all" && it.sec!==FILTER) return;
    shown++;
    if(it.sec!==lastSec){html+=`<div class="sec">${it.sec}</div>`;lastSec=it.sec}
    const single=it.subs.length===1&&!it.stem;
    html+=`<div class="card${single?" single":""}" id="q${it.key}">`;
    if(!single) html+=`<div class="stem"><span class="qn">${it.n}</span>${it.stem}</div>${figs(it.figs,it.small)}`;
    subs.forEach(({s,j,id})=>{ html+=renderSub(it,s,id,single) });
    html+=`</div>`;
  });
  main.innerHTML=shown?html:`<div class="empty">${FILTER==="wrong"?"目前沒有錯題 🎉":"這個分類沒有題目"}</div>`;
  fixImgs(main);
  stats();
}

function renderSub(it,s,id,single){
  const r=ST[id]||{};
  let h=`<div class="sub" data-id="${id}">`;
  const head=single?`<span class="qn">${it.n}</span>`:(s.label?`<span class="lab">${s.label}</span>`:"");
  if(s.type==="mc"){
    h+=`<div>${head}${s.q}</div>${figs(s.figs,s.small)}`;
    const answered=r.pick!=null;
    h+=`<div class="opts${s.optImg?" img":""}">`;
    s.opts.forEach((o,k)=>{
      let cls="opt";
      if(answered){ if(k===s.ans) cls+=" right"; else if(k===r.pick) cls+=" wrong"; else cls+=" dim"; }
      const body=s.optImg?`<span class="optimg"><img data-src="${o}" alt="選項${L[k]}"></span>`:`<span>${o}</span>`;
      h+=`<button class="${cls}" data-act="pick" data-k="${k}" ${answered?"disabled":""}><span class="k">${L[k]}</span>${body}</button>`;
    });
    h+=`</div>`;
    if(answered){
      const ok=r.pick===s.ans;
      h+=`<div class="fb show ${ok?"ok":"bad"}"><div class="v">${ok?"答對了！":"答錯了"}　正確答案：(${L[s.ans]})</div>${s.exp?`<div class="ex"><b>解析</b>　${s.exp}</div>`:""}</div>`;
      h+=`<div class="row"><button class="retry" data-act="reset">重新作答</button></div>`;
    }
  } else if(s.type==="ms"){
    h+=`<div>${head}<span class="mtag">多選</span>${s.q}</div>${figs(s.figs)}`;
    const sel=r.sel||[], done=!!r.done;
    h+=`<div class="opts">`;
    s.opts.forEach((o,k)=>{
      const inA=s.ans.includes(k), isS=sel.includes(k);
      let cls="opt";
      if(done){ if(inA&&isS) cls+=" right"; else if(isS) cls+=" wrong"; else if(inA) cls+=" miss"; else cls+=" dim"; }
      else if(isS) cls+=" sel";
      h+=`<button class="${cls}" data-act="toggle" data-k="${k}" ${done?"disabled":""}><span class="k sq">${L[k]}</span><span>${o}</span></button>`;
    });
    h+=`</div>`;
    if(!done){
      h+=`<div class="row"><button class="btn primary" data-act="submit" ${sel.length?"":"disabled"}>送出答案</button><span class="note">可選多個選項</span></div>`;
    } else {
      const ok=JSON.stringify([...sel].sort())===JSON.stringify(s.ans);
      h+=`<div class="fb show ${ok?"ok":"bad"}"><div class="v">${ok?"答對了！":"答錯了"}　正確答案：${s.ans.map(k=>"("+L[k]+")").join("")}</div>${s.exp?`<div class="ex"><b>解析</b>　${s.exp}</div>`:""}</div>`;
      h+=`<div class="row"><button class="retry" data-act="reset">重新作答</button></div>`;
    }
  } else {
    h+=`<div>${head}${s.q||""}</div>${figs(s.figs)}`;
    const shown=!!r.shown;
    if(s.type==="choicetext"){
      h+=`<div class="choices">`+s.opts.map((o,k)=>{
        let c="choice"; if(r.c===k) c+=" sel";
        if(shown&&s.ansIdx!=null){ if(k===s.ansIdx) c+=" right"; else if(r.c===k) c+=" wrong"; }
        const body=s.optImg?`<img data-src="${o}" alt="選項${k+1}">`:`□ ${o}`;
        return `<button class="${c}${s.optImg?" imgc":""}" data-act="choose" data-k="${k}" ${shown?"disabled":""}>${body}</button>`;
      }).join("")+`</div>`;
      if(s.fields&&s.fields.length){ s.fields.forEach((f,k)=>{h+=`<div class="field"><label>${f}</label><textarea data-f="${k}" rows="2">${esc((r.t||[])[k]||"")}</textarea></div>`}); }
      else h+=`<div class="field"><label>${s.reason}</label><textarea data-f="0" rows="2" placeholder="寫下你的說明…">${esc((r.t||[])[0]||"")}</textarea></div>`;
    } else if(s.fields&&s.fields.length){
      s.fields.forEach((f,k)=>{h+=`<div class="field"><label>${f}</label><textarea data-f="${k}" rows="1">${esc((r.t||[])[k]||"")}</textarea></div>`});
    } else {
      h+=`<div class="field" style="display:block"><textarea data-f="0" rows="2" placeholder="寫下你的答案…">${esc((r.t||[])[0]||"")}</textarea></div>`;
    }
    if(!shown){
      h+=`<div class="row"><button class="btn primary" data-act="show">看答案</button></div>`;
    } else {
      h+=`<div class="fb show neutral"><div class="v">參考答案</div><div class="ansbox">${s.ans}</div>${s.exp?`<div class="ex"><b>解析</b>　${s.exp}</div>`:""}${s.rubric?`<div class="rubric"><b style="color:var(--muted)">評分原則</b>${s.rubric}</div>`:""}</div>`;
      const sf=r.self;
      h+=`<div class="self">自評：
        <button class="btn ${sf==="ok"?"on-ok":""}" data-act="self" data-v="ok">完全答對</button>
        <button class="btn ${sf==="part"?"on-part":""}" data-act="self" data-v="part">部分答對</button>
        <button class="btn ${sf==="bad"?"on-bad":""}" data-act="self" data-v="bad">答錯</button>
        <button class="retry" data-act="reset">重新作答</button></div>`;
    }
  }
  return h+`</div>`;
}

function findSub(id){const [n,j]=id.split("-");const it=DATA.find(x=>x.key===n);return {it,s:it.subs[+j]}}

function refreshSub(el){
  const id=el.dataset.id;const {it,s}=findSub(id);
  const single=it.subs.length===1&&!it.stem;
  const tmp=document.createElement("div");tmp.innerHTML=renderSub(it,s,id,single);
  const n=tmp.firstElementChild;fixImgs(n);el.replaceWith(n);stats();
}

document.addEventListener("click",e=>{
  const im=e.target.closest(".fig img,.expfig img,.ansbox img,.inimg,.rubric img");
  if(im){const lb=document.getElementById("lb");lb.querySelector("img").src=im.src;lb.classList.add("on");return}
  if(e.target.closest("#lb")){document.getElementById("lb").classList.remove("on");return}
  const b=e.target.closest("[data-act]"); if(!b) return;
  const el=b.closest(".sub"); const id=el.dataset.id; const {s}=findSub(id);
  ST[id]=ST[id]||{};
  const act=b.dataset.act;
  if(act==="pick"){ST[id].pick=+b.dataset.k}
  else if(act==="choose"){ST[id].c=+b.dataset.k}
  else if(act==="toggle"){const k=+b.dataset.k;const a=ST[id].sel||[];ST[id].sel=a.includes(k)?a.filter(x=>x!==k):[...a,k]}
  else if(act==="submit"){ST[id].done=true}
  else if(act==="show"){ST[id].shown=true}
  else if(act==="self"){ST[id].self=b.dataset.v}
  else if(act==="reset"){delete ST[id]}
  save(); refreshSub(el);
});
document.addEventListener("input",e=>{
  const t=e.target; if(!t.matches("textarea[data-f]")) return;
  const id=t.closest(".sub").dataset.id; ST[id]=ST[id]||{}; ST[id].t=ST[id].t||[];
  ST[id].t[+t.dataset.f]=t.value; save();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("lb").classList.remove("on")});

function stats(){
  let total=0,done=0,ok=0,wrong=0;
  DATA.forEach(it=>it.subs.forEach((s,j)=>{total++;const st=status(subId(it,j),s);if(st){done++;if(st==="ok")ok++;else wrong++}}));
  sTotal.textContent=total;sDone.textContent=done;sOk.textContent=ok;
  sPct.textContent=done?Math.round(ok/done*100)+"%":"—";
  pbar.style.width=(done/total*100)+"%";
  const wb=document.querySelector('nav [data-f="wrong"]'); if(wb) wb.textContent=`錯題 (${wrong})`;
}

function buildNav(){
  SECS=[...new Set(DATA.map(x=>x.sec))];
  const items=[["all","全部"],...SECS.map(s=>[s,s.replace(/^.、/,"")]),["todo","未作答"],["wrong","錯題"]];
  nav.innerHTML=items.map(([f,t])=>`<button data-f="${f}" class="${f===FILTER?"on":""}">${t}</button>`).join("")+
    `<span class="tools"><button class="btn" id="resetAll">全部重來</button></span>`;
  nav.onclick=e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.id==="resetAll"){ if(b.dataset.c){ST={};save();delete b.dataset.c;b.textContent="全部重來";render();} else {b.dataset.c=1;b.textContent="確定清除？";setTimeout(()=>{delete b.dataset.c;b.textContent="全部重來"},3000)} return;}
    FILTER=b.dataset.f; nav.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on",x===b)); render(); window.scrollTo({top:0});
  };
}

DATA=EMBED;buildNav();render();
</script>
</body>
</html>
