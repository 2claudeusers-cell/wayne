<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>115 高二歷史百題 B2Ch5 互動練習</title>
<style>
:root{
  --bg:#f5f2ea; --card:#fffdf8; --ink:#1f2a2b; --muted:#6b7473; --line:#e2dccf;
  --accent:#1f6f6a; --accent-soft:#e1efed; --ok:#2e7d4f; --ok-soft:#e3f2e8;
  --bad:#b5402f; --bad-soft:#f8e4e0; --warn:#a8741a; --warn-soft:#f7ecd6;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#161b1b;--card:#1f2626;--ink:#e8ebe9;--muted:#9aa5a3;--line:#323b3a;
    --accent:#5fb8b0;--accent-soft:#1f3634;--ok:#6cc48f;--ok-soft:#1d3326;--bad:#e07a69;--bad-soft:#3a2420;--warn:#e0b25a;--warn-soft:#3a3020;}
  .fig img,.optimg img,.expfig img{filter:invert(.9) hue-rotate(180deg);background:#fff}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.75;font-size:16px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:860px;margin:0 auto;padding:12px 18px 10px}
h1{font-size:19px;margin:0;letter-spacing:.02em}
h1 small{font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}
.stats{display:flex;gap:16px;align-items:center;font-size:14px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
nav button,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:4px 12px;border-radius:999px;cursor:pointer}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.tools{margin-left:auto;display:flex;gap:6px}
main{max-width:860px;margin:0 auto;padding:18px 18px 80px}
.sec{font-size:15px;font-weight:700;color:var(--accent);margin:28px 0 10px;letter-spacing:.1em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 16px}
.qn{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;padding:0 8px;border-radius:7px;
  background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;margin-right:8px;vertical-align:1px}
.stem{margin-bottom:6px}
.sub{border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
.sub:first-of-type{border-top:none;margin-top:4px;padding-top:4px}
.single .sub{border-top:none;margin-top:0;padding-top:0}
.lab{font-weight:700;color:var(--accent);margin-right:4px}
.figs{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.fig{margin:10px 0;text-align:center}
.figs .fig{margin:0;flex:1 1 220px;max-width:100%}
.figs.small .fig{flex:0 1 150px}
.fig img,.expfig img{max-width:100%;max-height:420px;border-radius:6px;cursor:zoom-in;border:1px solid var(--line);background:#fff}
.cap{font-size:13px;color:var(--muted);margin-top:2px}
.opts{display:grid;gap:8px;margin-top:10px}
.opts.img{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;width:100%;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:10px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.6}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)} .opt.sel .k{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.miss{border-color:var(--ok);border-style:dashed} .opt.miss .k{border-color:var(--ok);color:var(--ok)}
.k.sq{border-radius:6px!important}
.mtag{display:inline-block;font-size:12px;background:var(--warn-soft);color:var(--warn);border-radius:5px;padding:0 6px;margin-right:6px;vertical-align:2px}
.optimg img{width:100%;border-radius:6px;background:#fff}
.opts.img .opt{flex-direction:column;align-items:stretch}
.fb{margin-top:12px;border-radius:10px;padding:12px 14px;font-size:15px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)} .fb.neutral{background:var(--accent-soft)}
.fb .v{font-weight:700;margin-bottom:4px}
.fb.ok .v{color:var(--ok)} .fb.bad .v{color:var(--bad)} .fb.neutral .v{color:var(--accent)}
.fb .ex{margin-top:6px;color:var(--ink)}
.fb .ex b{color:var(--muted);font-weight:600}
.rubric{margin-top:8px;font-size:14px;border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent);padding-top:8px}
.rl{display:flex;gap:10px}.rl b{flex:none;min-width:9.5em;color:var(--muted);font-weight:600}
.ansbox{background:var(--card);border-radius:8px;padding:8px 10px;margin:6px 0;border:1px solid var(--line)}
.field{display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.field label{flex:none;min-width:6.5em;font-size:14px;color:var(--muted);padding-top:7px}
textarea{width:100%;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--card);color:var(--ink);resize:vertical;min-height:40px}
textarea:focus{outline:none;border-color:var(--accent)}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.choice{font:inherit;font-size:15px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:5px 14px;border-radius:9px;cursor:pointer}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.self{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:14px;color:var(--muted)}
.self .btn.on-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.self .btn.on-part{background:var(--warn);border-color:var(--warn);color:#fff}
.self .btn.on-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.tb{border-collapse:collapse;margin:10px 0;font-size:14px;width:100%;display:block;overflow-x:auto}
.tb th,.tb td{border:1px solid var(--line);padding:5px 8px;vertical-align:top}
.tb th{background:var(--accent-soft);font-weight:600}
.expfig{margin-top:8px}
.flag{height:44px;border:1px solid var(--line);display:block;margin:auto}
.note{font-size:13px;color:var(--muted);margin-top:4px}
.choice.imgc{padding:6px;flex:1 1 200px;max-width:280px}.choice.imgc img{width:100%;display:block;border-radius:6px;background:#fff}
.ansbox img{max-width:100%;max-height:420px;border-radius:6px;background:#fff;cursor:zoom-in}
.empty{text-align:center;color:var(--muted);padding:40px 0}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:20px}
#lb.on{display:flex} #lb img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}
.retry{font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;margin-left:auto;font-family:inherit}
@media (max-width:560px){.hwrap{padding:10px 12px}main{padding:12px 10px 60px}.card{padding:14px}.tools{margin-left:0;width:100%}.field{flex-direction:column;gap:2px}.field label{padding-top:0}}
.home{display:inline-block;font-size:13px;color:var(--accent);text-decoration:none;margin-bottom:2px}.home:hover{text-decoration:underline}
</style>
</head>

const EMBED=[{"sec": "一、單選題", "n": "1", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "政府推動「廢藩置縣」、「徵兵制」與「地租改正」等措施，並積極引進西方制度。新政府逐步削弱武士的特權與俸祿，改以國家俸給或一次性補償金取代。部分武士對此深感不滿，認為自身地位受損，薩摩藩的西鄉隆盛主張保護士族權益，並因不滿新政府政策而領導士族舉兵。根據題文所描述的歷史情境，請問下列何者的分析最適切？", "opts": ["受武士道精神影響武士階層成為戰鬥主力", "戰爭與武士階級的政治社會地位動搖有關", "戰爭結束之後日本開始推動君主專制體制", "西南戰爭迫使日本放棄對西方制度的學習。"], "optImg": false, "ans": 1, "exp": "題文指的是日本受到黑船事件的刺激，迫使幕府還政於天皇，明治天皇因而展開明治維新運動，推動一系列的西化改革，其中包含廢除武士階層，建立新式的海陸軍隊，此舉使武士階層失去社會的聲望及地位，醞釀起對新政府的不滿，因而引爆西南戰爭，故選(Ｂ)。(Ａ)題文重點在明治維新後對士族身分與待遇的衝擊，而非武士道精神的延續。(Ｃ)明治維新後日本改推行君主立憲體制。(Ｄ)明治政府贏得西南戰爭，故日本並未放棄西化改革。", "figs": [], "small": false}], "key": "1_1"}, {"sec": "一、單選題", "n": "2", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "日本的雲揚艦藉口測量航路，航至仁川府濟物浦月尾島附近。次日，在江華島附近，雲揚艦與江華島草芝鎮的炮臺相互炮擊，雲揚艦隨後命陸戰隊登陸，攻占並破壞炮臺，奪取大炮 38 門，並將鎮公所及一般居民房屋放火焚燒後即撤退，日本此舉的目的是", "opts": ["恢復儒學在朝鮮的地位", "刺激朝鮮進行西化改革", "迫使朝鮮讓渡通商利權", "建立日朝間的平等往來。"], "optImg": false, "ans": 2, "exp": "日本曾出兵威脅朝鮮，爆發江華島事件（1875 年），事後與朝鮮簽訂條約，希望獲得在朝鮮的治外法權及租借地。", "figs": [], "small": false}], "key": "1_2"}, {"sec": "一、單選題", "n": "3", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "某國一位官員紀錄他在中國的見聞時，寫下了許多評語，包括：「中國士兵對機械工藝一無所知」、「中國民眾聽見船上的炮聲，嚇得魂飛魄散，令人懷疑火藥是不是中國人發明的」。他後來歷任該國開普敦總督府祕書長及海軍部次長，也曾派人前往北極，企圖尋找通往亞洲的新航路。這位官員最可能是〔104.指考〕", "opts": ["14 世紀波斯派往中國的官員", "16 世紀鄂圖曼帝國派遣官員", "18 世紀英國派遣的特使團員", "20 世紀德國在中國軍事顧問。"], "optImg": false, "ans": 2, "exp": "18 世紀工業革命以來，英國的機械工藝領先全球，其槍砲技術也隨之大幅躍進。同時，大航海時代以來，英國雖起步較晚，但在 17 ～ 18 世紀之間，先後擊敗西班牙、荷蘭等海上強權，成為強大的海權國家，其海軍與海上探險隊，均為當時之翹楚。由此可知，引文所述最可能出自 18 世紀的英國特使團員。(Ａ)(Ｂ)波斯與鄂圖曼帝國在當時均尚未發生工業革命，也未曾控制過開普敦。(Ｄ) 20 世紀的中國已經歷過工業化的洗禮，不可能會對機械工藝一無所知。", "figs": [], "small": false}], "key": "1_3"}, {"sec": "一、單選題", "n": "4", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "「此時西方大為興奮，在華將有更大發展空間。當是時通商口岸計有天津、上海、福州、淡水、廣州、南京、漢口等，又有內河航行權，更可至內地遊歷經商，傳教士可四處租購房屋、建立教堂。」請問文中「此時」所指的是何時？", "opts": ["英國派馬戞爾尼使華之後", "英國派遣首任商務監督時", "鴉片戰爭結束後", "兩次英法聯軍之役後。"], "optImg": false, "ans": 3, "exp": "(Ｄ)英法聯軍後，中國被迫增開通商口岸，且外國享有內河航行權。", "figs": [], "small": false}], "key": "1_4"}, {"sec": "一、單選題", "n": "5", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "某一時期，中外發生衝突，許多外國人士遭到攻擊或殺害，以華北地區最嚴重。事件結束後，外國勢力與清廷簽訂條約，除要求懲凶與賠款外，還規定：參與暴亂之地區，須停止科舉考試五年，以示懲罰。這個條約簽訂的背景最可能是〔109.指考〕", "opts": ["鴉片戰爭時，外國商民損失慘重", "廣西發生教案，教士信徒遭殺害", "義和團事件，外國使館受到圍攻", "辛亥革命前夕，外國居民受虐待。"], "optImg": false, "ans": 2, "exp": "這個中外衝突主要發生在華北，且不是中國全區皆牽涉其中；事後清廷與外國簽訂的條約被要求須懲凶及賠款，因此最可能是 1900 年的義和團事件。當時北京東交民巷的使館區遭到義和團攻擊，德國公使克林德及日本書記杉山彬被殺，八國因而組成聯軍攻入北京城；慈禧太后下詔反擊外國，但南方各省督撫拒不受命，並與外國人簽訂「東南互保章程」以自保，是以戰爭侷限於華北地區，答案選(Ｃ)。(Ａ)鴉片戰爭及(Ｂ)廣西教案的發生地不在華北。(Ｄ)中國已於 1906 年廢科舉考試，所以 1911 年辛亥革命前夕就算與外國人發生衝突，也不可能以停止科舉考試做為懲罰的手段。", "figs": [], "small": false}], "key": "1_5"}, {"sec": "一、單選題", "n": "6", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "1587 年豐臣秀吉曾對切支丹大名的代表高山右近說：「切支丹（指天主教徒）在具有身分的士兵和諸侯之間廣泛傳教，這不是我樂於見到的。為什麼在切支丹之間有超過兄弟感情的強大的團結？這必定會對安定的天下帶來災難。」請問豐臣秀吉所擔心的災難指的是", "opts": ["信仰天主教者形成團結力量", "戰國以來社會動盪不安", "日本的天皇權威逐漸動搖", "地方大名軍事權力過大。"], "optImg": false, "ans": 0, "exp": "由豐臣秀吉的談話可知，其所擔心的應該是握有軍權的大名信奉天主教後，形成一股團結的力量，可能破壞日本的封建秩序。", "figs": [], "small": false}], "key": "1_6"}, {"sec": "一、單選題", "n": "7", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "1860 年英法聯軍時，英國人可以輕易的僱到中國勞工為英國侵華戰爭工作；但到 1884 年中法戰爭時，香港的苦力卻拒絕幫法國的船隻裝貨。下列何者最能解釋這種現象？〔95.指考〕", "opts": ["1860 年中國勞工為英軍工作，印證「工人無祖國」的說法", "1884 年時，中國勞工生活已大為改善，毋須再替外人賣命", "西方列強一連串的侵略中國，激發了中國勞工的民族情感", "中法戰爭波及香港，影響生計，故當地苦力不願為敵效力。"], "optImg": false, "ans": 2, "exp": "關鍵句是「1860 年英法聯軍時…… 1884 年中法戰爭時」，由於鴉片戰爭以來，廣州地區人民最早與西方接觸、爆發戰事，故民風強悍、排外激烈且民族意識較早覺醒，當時孫中山在香港就學，目睹香港的華工拒絕為法國修船、卸貨的愛國表現，於是開始傾心革命，即最佳例證。", "figs": [], "small": false}], "key": "1_7"}, {"sec": "一、單選題", "n": "8", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "國家動亂時，軍隊往往擴張。戰事結束後，政府必須裁軍，使青年投入生產及建設，並節省國防開支。有一份政府公報提到：「縮編全國現有陸軍，至多不得超過六十五師，兵額約八十萬人」﹔「縮減軍費至國家總收入百分之四十為止」﹔復員之士兵則要輔導就學或就業，以免造成社會問題。這樣的辦法應是在何時提出的？〔學測〕", "opts": ["辛亥革命成功時", "北伐大業完成時", "對日戰爭結束時", "政府宣布解嚴時。"], "optImg": false, "ans": 1, "exp": "(Ａ)辛亥革命成功後，軍閥掌握軍權，並未採取裁軍的行動。(Ｂ)北伐結束時，全國軍隊仍多達 200 餘萬，實非政府財力所能負擔，故蔣中正進行裁軍。(Ｃ)對日戰爭結束後，國共內戰緊接展開，並未採取裁軍的行動。(Ｄ) 1987 年政府宣布解嚴，兩岸仍處於對立狀態中，並未裁軍。故答案應選(Ｂ)。", "figs": [], "small": false}], "key": "1_8"}, {"sec": "一、單選題", "n": "9", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "「袁世凱暗殺元勳，弁髦（輕忽漠視之意）約法，擅借巨款……近復盛暑興師，蹂躪贛省，以兵威劫天下，視吾民若寇讎，實屬有負國民之委託。我國民宜亟起自衛，與天下共擊之」。上述文字的內容，是在呼籲國民從事哪一項行動？〔學測〕", "opts": ["反對洪憲帝制", "二次革命", "護法戰爭", "討伐復辟。"], "optImg": false, "ans": 1, "exp": "1913 年，宋教仁上海遇刺身亡、袁世凱與列強訂定「善後大借款」及解散國民黨籍都督等作為，引起公憤。孫中山先生起而號召二次革命，聲討袁世凱。", "figs": [], "small": false}], "key": "1_9"}, {"sec": "一、單選題", "n": "10", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "「此事件」標誌著統治中國 16 年的北洋軍閥政權宣告正式結束，達成和平統一之共識；也是奉系軍閥以和平方式和對等條件，統一於南京國民政府。過程中，「他」對此事件之促成，扮演甚為重要的角色。請問文中的「此事件」、「他」分別是下列何者？", "opts": ["辛亥革命；袁世凱", "聯俄容共；孫文", "寧漢分裂；蔣中正", "東北易幟；張學良。"], "optImg": false, "ans": 3, "exp": "題目所述為東北易幟，過程中奉軍領袖張學良對此一事件之促成，扮演著關鍵角色。(Ａ)辛亥革命在北洋軍閥政權出現以前，故不選。(Ｂ)孫文與蘇聯合作，同意中國共產黨員以個人身分加入國民黨（是為「容共」）。(Ｃ)寧漢分裂是 1927 年國民政府北伐期間，中國國民黨內部以南京蔣中正為首的清共勢力和武漢汪精衛為首的容共勢力發生分裂的事件。", "figs": [], "small": false}], "key": "1_10"}, {"sec": "一、單選題", "n": "11", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "一位外國人評論當時的中國，指出：居住在遼東的韃靼人，不僅統治中國，還占領了西藏國。對照歷史，只有一個小城的羅馬人曾經征服了世界；韃靼人來自僅有一省大小之地，卻征服了比前人更多的土地，各處人民都要向他們稱臣納貢。這位外國人最可能是〔109.指考〕", "opts": ["宋代日本學問僧", "元代義大利商人", "明初阿拉伯商人", "清代耶穌會教士。"], "optImg": false, "ans": 3, "exp": "(Ｄ)住在遼東的「韃靼人」應是指女真族，女真族在中國曾建立起兩個政權，一是金朝，另一是清朝，但金朝未統治西藏，可知這個外國人評論的是清帝國。", "figs": [], "small": false}], "key": "1_11"}, {"sec": "一、單選題", "n": "12", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "「天主教信仰在□□發展的歷史，最早可追溯到 18 世紀後期。由於一位來華使臣對西學的興趣，在北京接受洗禮，成為□□首位天主教信徒。後來，北京教區主教選派一位貌似□□人的中國籍神父周文謨前往傳教，他的努力對於當地宣教事業的開創有重要的影響，也加強□□人對西學的興趣。在 1801 年，由於官方對境內天主教徒的大規模打壓與迫害，造成不少信徒遭到流放甚至殉道。這起事件象徵官方對天主教政策的改變，西學也受到壓制。然而，天主教在□□的宣教事業並未因此落幕。」請問上述內容的主題應為下列何者？", "opts": ["天主教信仰在越南的傳播", "天主教與西學傳入朝鮮的歷程", "日本江戶幕府對天主教的政策", "耶穌會傳教士在日本的宣教。"], "optImg": false, "ans": 1, "exp": "從上文內容提及天主教傳入的經過，以及後來官方對天主教的政策，特別是 1801 年的大規模迫害行動等相關描述，即可判斷這段內容應與天主教與西學在朝鮮的傳播有關。", "figs": [], "small": false}], "key": "1_12"}, {"sec": "一、單選題", "n": "13", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "中國有一首詩歌如此描述：「我軍不怕遠征的艱難，翻越萬水千山都覺得輕鬆。五嶺（江西、湖南、廣東、廣西交界）的山巒像微波般起伏，烏蒙山（貴州、雲南交界）的險峻也像泥丸般不足為懼。金沙江（長江上游）的水拍打著高聳的雲崖溫暖如春，大渡橋（四川西部）的鐵索則帶著刺骨的寒意。更令人振奮的是岷山（四川、甘肅交界）千里的皚皚白雪，三軍過後都露出了開心的笑容。」請問這首詩提到的史事為何？當時中國政治、社會情況如何？", "opts": ["二次革命，國家與輿論團結一致，共同對抗意圖改制之人", "西安事變，國家政策與輿論背道而馳，引發爭議", "國民政府北伐，政局因軍閥四分五裂，社會因此動盪", "國民政府剿共，政局尚稱穩定，反對勢力轉入地下伺機而行。"], "optImg": false, "ans": 3, "exp": "詩裡提到的地名都在中國南方、西南、西北的省區交界，內容描述共軍歷經艱難，走過這些千山萬水。對應史事，共軍長途跋涉，歷經艱難橫跨上述地區，最有可能指中共在國民政府軍隊追擊下的「逃竄」（長征）（1934～1936），而當時國家政局在經過北伐與中原大戰過後大致底定，國軍才能以全力剿共，故答案選(Ｄ)。", "figs": [], "small": false}], "key": "1_13"}, {"sec": "一、單選題", "n": "14", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "一齣戲中有如下的旁白：當今歐洲強盛，亞洲也不能再沉睡，誕生孔子、孕育釋迦牟尼的土壤現在是什麼情況？我們早已移民南方島嶼，開發臺灣、呂宋、新加坡、婆羅洲、關島、夏威夷等地，事業有成。走吧，走向南方的島嶼。這齣戲創作的時代背景最可能是〔110.指考〕", "opts": ["晚清中國人移民東南亞", "日本倡議大東亞共榮圈", "東南亞國家協會的建立", "中國推動一帶一路政策。"], "optImg": false, "ans": 1, "exp": "本題的判斷關鍵在於「批評中國與印度等文明古國的落後」（誕生孔子、孕育釋迦牟尼的土壤現在是什麼狀況？），以及「我們已開始在臺灣、南洋諸島與關島、夏威夷進行移民事業」，因此可判斷此為 1940 年代，日本帝國政府為加速對外擴張，以進行資源與戰略布局的情形下，所提倡之大東亞共榮圈。其特色為強調大東亞（包含大洋洲、太平洋諸島）的共存共榮，以及在日本的領導下和西方帝國對抗的相關論述。", "figs": [], "small": false}], "key": "1_14"}, {"sec": "一、單選題", "n": "15", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "一位山西讀書人在 1914 年寫的日記：予之幼時，即有萬里封侯之志，既冠而讀兵書……年垂四十，身雖登科，終無機會風雲，不得已而舌耕度日。光緒季年，國家變法維新，吾道將就漸滅；迄宣統三年，革命黨起，紛擾中華，國遂淪亡，予即無舌耕之地，困厄於鄉已數年矣。從日記內容判斷，這位讀書人的政治立場最可能是〔113.分科〕", "opts": ["認同清朝統治", "肯定維新變法", "支持廢除科舉", "歡迎共和制度。"], "optImg": false, "ans": 0, "exp": "該位讀書人的日記中明言自身的志業便是考上科舉考試，但最終無機會登科，而變法維新時，「吾道將就漸滅」，顯示出對維新變法與廢除科舉考試的反對；革命黨繼起後，「國遂淪亡」，更反映此人不認同革命黨建立的中華民國，而感嘆自身的祖國（清朝）淪亡，故可推知此人乃是(Ａ)認同清朝統治者。", "figs": [], "small": false}], "key": "1_15"}, {"sec": "一、單選題", "n": "16", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "有一位英國商人在信件裡提到他在中國的見聞：「當時各國商人都被要求只能前往廣州貿易，關於貿易上的限制很多，如有事情需要與官方協調，只能透過公行代為傳達，不能與官方直接溝通。……英國人住在廣州期間，平常的活動範圍也都受到限制。」請問這位英國商人最有可能是在哪一時期前來中國貿易？", "opts": ["1580 年代", "1670 年代", "1810 年代", "1870 年代。"], "optImg": false, "ans": 2, "exp": "上述內容是在清乾隆年間限制廣州一口通商到 1842 年《南京條約》簽訂前的情形。(Ｃ)在 19 世紀初期，廣州仍是唯一的對外通商口岸，外商如有事情需要與官方協調，都只能由公行協助轉達。", "figs": [], "small": false}], "key": "1_16"}, {"sec": "一、單選題", "n": "17", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "1866 年 7 月 13 日，法國政府指示其駐華代理公使伯洛內（Henri de Bellonet）和亞洲艦隊司令羅茲（Pierre-Gustave Roze）向清朝總理衙門提出嚴重抗議：「……本年三月間，□□突發一令，將該處法國主教二人及傳教士九人並本地傳教士七人、其餘教友，男女老幼無數盡行殺害。如此殘暴，自取滅亡。因其系屬中國納貢之邦，是以本國命將興師，以討有罪……所有本國各路兵船，不日即可齊集朝鮮，暫取其國，後來再立何者為王，以守此土，仍聽本國諭命施行。」上述的□□指的應該是", "opts": ["朝鮮國王", "東寧國王", "幕府將軍", "中國督撫。"], "optImg": false, "ans": 0, "exp": "抗議文中有「其系屬中國納貢之邦」一句，即可知此地應為中國的藩屬國――朝鮮。1866 年法國曾以護衛天主教為藉口入侵朝鮮，此為法國向中國知會並提出抗議時提出的言論，故答案選(Ａ)。(Ｂ)(Ｃ)皆非中國藩屬國。", "figs": [], "small": false}], "key": "1_17"}, {"sec": "一、單選題", "n": "18", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "鴉片戰爭後，清廷和戰不決，英人驅船攻向礮臺，守將關天培英勇殉職，英艦進攻岸臺，帶領著鴉片船尾隨而至，一些民間小舟協助販運。粵兵名為迎敵，也同時伺機護販，藉得好處。此一情景，史家最可能用怎樣的總結性文字來描述？〔103.指考〕", "opts": ["忠勇之軍，撤潰已盡；利之所在，對敵如戲", "忠勇之軍，撤潰已盡；民氣所在，雖敗猶榮", "將領驕惰，不足禦敵；利之所在，對敵如戲", "將領驕惰，不足禦敵；民氣所在，雖敗猶榮。"], "optImg": false, "ans": 0, "exp": "鴉片戰爭爆發後，守將英勇殉國，但反觀民間百姓及地方軍隊，為了營利竟然幫助敵對的英軍，可用「忠勇之軍，撤潰已盡」形容關天培；而民間小舟協助英軍及粵兵護販鴉片的行為，簡直是為利而叛國，可以「利之所在，對敵如戲」來概括。故選(Ａ)。", "figs": [], "small": false}], "key": "1_18"}, {"sec": "一、單選題", "n": "19", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "一位西方人觀察中國的內戰，有如下的紀錄：「如果基督教國家參與鎮壓這場運動將是很悲哀的，因為起義者抱著一種爭取進步的激情和作全面改革的意向，而中國政府方面則從沒有顯出這種意向。起義者自稱的基督教形式雖然大有疑問，但卻比迄今為止中國人……愚蠢的偶像崇拜要好得多。目前顯得較為可取的唯一政策，是……避免與內戰雙方發生任何政府層面的瓜葛。」這是中國的哪一場內戰？〔91.學測補考〕", "opts": ["鄭成功反清復明的戰爭", "太平天國之役", "義和團事件", "國共內戰。"], "optImg": false, "ans": 1, "exp": "(Ｂ)太平天國以拜上帝教的名義起事，但與真正的基督教仍有甚大之差異，且無法與英、美等基督教國家合作，故列強在事件發生之初採取袖手旁觀的政策。", "figs": [], "small": false}], "key": "1_19"}, {"sec": "一、單選題", "n": "20", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "以下是清廷的一項決策：「對湖南、湖北兩地（投資者），實行全額償還；在廣東，償還 60 ％，餘下 40 ％由政府債券支付；在四川，以可贖債券補償，其中包括鐵路資金 700 萬兩及實際建築費用 400 萬兩，年息為 6 厘。」此決策導致的結果是", "opts": ["清廷實施鐵路國有政策", "廣州爆發黃花崗起義", "群眾組織保路同志會", "列強介入革命行動。"], "optImg": false, "ans": 2, "exp": "清末政府宣布鐵路國有政策，因補償不公引發四川商人不滿，進行保路運動。", "figs": [], "small": false}], "key": "1_20"}, {"sec": "一、單選題", "n": "21", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "明末清初的西洋傳教士在中國傳教，往往必須借助於傳教以外的學識，才能受到朝廷的重視。如耶穌會教士南懷仁因擁有西方學問技藝而擔任許多職務，除為大家所熟知的欽天監外，他最可能還在哪個政府部門任職？〔105.學測〕", "opts": ["吏部", "戶部", "禮部", "工部。"], "optImg": false, "ans": 3, "exp": "隋唐以來，六部成為定制，其中吏部掌管官吏的任免、考核，戶部掌管土地、戶籍、賦稅，禮部掌管典章、科舉、外交禮儀，兵部掌軍事，刑部掌法律，工部則負責各種工程相關的事務。明末清初的西洋傳教士，由於擁有西方學問技藝，可協助許多工程的測量、規劃、施工、校勘等事務，因此最可能在工部任職。", "figs": [], "small": false}], "key": "1_21"}, {"sec": "一、單選題", "n": "22", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "「上海城市近代化拓展，由租界肇始而改變了上海舊城的面貌。『租界』最初被劃定時不過是上城外的一片荒野之地，然而現代化以後的『租界』之所以興起，最基本的原因是在中國最動亂的年代，西方列強提供了安全的保障，吸引了全國的富室巨商及其資本向租界集中。每次戰爭動盪，不論是從小刀會的起義、太平天國事變、辛亥革命、軍閥混戰，迫使各地的富人大量攜資移居上海租界避難，同時也使大量難民紛紛湧入租界，成為廉價的勞動力，促使租界地區人口和財富的迅速積累。同時在西方列強建設租界地的同時，也把當時先進的市政建設、公共事業及西方治理城市的方法和物質文明帶進上海，因此上海二、三○年代，都市的繁華到達頂點。」就以上資料論述的重點說明，下列何者最為合理？", "opts": ["上海是中國認識西方文明的窗口", "上海成為中國之金融中心的原因", "肯定西方列強對上海建設的貢獻", "租界的劃定與上海現代化的關係。"], "optImg": false, "ans": 3, "exp": "清末中國在列強的強迫下開港通商，東南沿海與長江沿岸就成了西方物質文明、思想傳入中國的基地，1845 年上海租界開闢後，上海的現代化建設更是快速發展，如鋪設西式馬路、設立現代郵政局、電話的引進、電燈的使用等。", "figs": [], "small": false}], "key": "1_22"}, {"sec": "一、單選題", "n": "23", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "一位新文化運動的主導人物，主張改良，反對革命，對當時許多人受到俄國十月革命鼓舞宣傳馬克思主義，介紹階級鬥爭與唯物史觀的做法，並不贊成，認為變革需要一點一滴的累積，因此反對急進。他最可能是〔102.指考〕", "opts": ["李大釗", "陳獨秀", "胡適", "魯迅。"], "optImg": false, "ans": 2, "exp": "(Ａ)李大釗曾在北京大學圖書館擔任主任，曾任《新青年》的編輯。李大釗推動共產主義，與陳獨秀兩人共同醞釀組建中國共產黨，是中國共產黨的主要創始人之一。(Ｂ)陳獨秀為《新青年》的主要創辦人，也是五四運動的精神領袖之一，在中國共產黨成立後，陳獨秀擔任中央局書記，直到 1929 年才被中共開除黨籍。(Ｃ)胡適是五四運動的兩大精神領袖之一，胡適對陳獨秀參與政治活動表達不滿，反對將馬克思主義放到《新青年》的內容中。(Ｄ)魯迅亦是新文化運動的領導人之一，魯迅亦同意馬克思主義，有系統地閱讀馬克思主義，翻譯馬克思的文藝及理論，營救因抗議被捕的學生，在其文章作品中充滿對底層人民處境的深刻感受。", "figs": [], "small": false}], "key": "1_23"}, {"sec": "一、單選題", "n": "24", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "以下關於天主教發展的事件，請按照順序排列：(甲)禮儀之爭(乙)教會禁止中國教徒進孔廟、祠堂、墳前祭拜(丙)允許信徒拜天、祭祖、尊孔(丁)宣布嚴格執行禁教", "opts": ["(丙)(乙)(甲)(丁)", "(丙)(甲)(乙)(丁)", "(乙)(丙)(甲)(丁)", "(乙)(甲)(丙)(丁)。"], "optImg": false, "ans": 0, "exp": "(丙)允許信徒拜天、祭祖、尊孔（明代利瑪竇規矩）→(乙)清代時，其他修會跟教宗反映中國教區問題，教宗宣布禁止中國教徒進孔廟、祠堂、墳前祭拜→(甲)康熙皇帝跟教宗溝通無效後，爆發禮儀之爭→(丁)雍正皇帝時以傳教士介入皇位繼承之爭而宣布禁教。", "figs": [], "small": false}], "key": "1_24"}, {"sec": "一、單選題", "n": "25", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "某國一位國會議員批評某次軍事行動，認為當初遠東軍司令部表示：只要派幾艘軍艦在海面行駛，中國就會退兵。現在我們派了這麼多軍艦前往中國，也不見中國退兵。司令部還說，如果能占領臺灣，中國必定派人求和，現在我們也攻打臺灣，還沒有聽說中國有求和的意思。這場戰爭的軍費，就讓遠東軍自行負擔，國會不應當為這次軍事行動付錢。該國會議員所提的軍事行動是〔105.學測〕", "opts": ["1840 年鴉片戰爭", "1856 年英法聯軍", "1874 年牡丹社事件", "1884 年中法戰爭。"], "optImg": false, "ans": 3, "exp": "1883 年，清朝與法國由於越南問題爆發戰爭，戰事從越南蔓延至中國東南沿海，法軍甚至出兵臺灣，企圖逼迫清廷讓步。然而，清軍在越南取得勝利，在臺灣則賴劉銘傳等人力抗法軍，法軍久戰不下，徒然耗費大量人力與物力，國會遂有反對繼續作戰之聲浪。(Ａ)(Ｂ)中國在鴉片戰爭與英法聯軍中均戰敗求和。(Ｃ)日本的國會於 1889 年制定憲法後才成立。", "figs": [], "small": false}], "key": "1_25"}, {"sec": "一、單選題", "n": "26", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "許多關切教育的地方人士指出：國家建設百廢待舉，傳統知識已不敷使用，需借重歐美先進國家的政治經驗、學術思想與科學技藝等專門知識，才能提升國家建設的效率。國家先前雖曾多次派選學生出洋念書，但人數不足。為便於學習歐美先進國家的專門知識，建設家鄉，我們也應廣派學子出國留學。呼籲主事者籌設「留學歐美預備學校」，招收學子，先在國內學習歐、美語文，以便將來出國學習。該文章反映哪種時代背景？〔108.學測〕", "opts": ["簽訂《南京條約》後，政府需培養對外交涉人才", "民國初年，擴大學校教育，也培育各種專門人才", "八年抗戰期間，同盟國資金援助，學生可赴歐美", "韓戰爆發以後，美援開始，故派遣學生赴美學習。"], "optImg": false, "ans": 1, "exp": "1912 年春，時任河南省教育總會會長兼河南教育司長李時燦、河南提學使陳善同、省學務公所議員王敬芳、教育司長林柏襄等人上書當局，強調辦學之必要，倡議引進西學，並派人出洋留學，學習世界的各種知識。王敬芳發表〈籌辦留學歐美預備學校公啟〉，之後並成立「河南留學歐美預備學校」。而(Ａ)所指「簽訂《南京條約》後，政府需培養對外交涉人才」，不符合題文中「國家先前雖曾多次派選學生出洋留學」所描述的情況。(Ｃ)(Ｄ)所描述的時間過晚，當時中國早已有許多人留學歐美。故選(Ｂ)。", "figs": [], "small": false}], "key": "1_26"}, {"sec": "一、單選題", "n": "27", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "某國受到西方列強侵略，簽訂了包括協定關稅，承認西方領事有裁判權等內容的條約，受到相當時期的壓迫。該國於是發憤圖強，經過長期的改革與建設，並與列強積極交涉，到 20 世紀初，終於重新簽訂平等新約，獲得關稅自主權。請問這是哪一個國家的情況？〔95.學測〕", "opts": ["日本", "中國", "菲律賓", "印度。"], "optImg": false, "ans": 0, "exp": "1854 年美國艦隊司令培里以優勢艦隊迫使日本開港通商，1858 年雙方簽訂正式商約，後來俄、英、荷、法援例，也相繼與日本簽訂類似的不平等條約。當時江戶幕府德川慶喜鑑於外有歐、美強國壓迫，內有愛國輿論的指謫，各地諸侯又都準備用武力推翻幕府情形下，乃在 1867 年還政給年輕的明治天皇。明治天皇親政後，「求知識於世界」、「破除舊日陋習」，推行各種新政，後終成工業強國，並獲得自主，躍為亞洲第一強國。", "figs": [], "small": false}], "key": "1_27"}, {"sec": "一、單選題", "n": "28", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "下圖是一張日本在某個時期發行的明信片，顯示一群日本青少年踏在亞洲地圖上，圖上還標示從日本到亞洲許多國家主要城市的飛行時間。從內容看，這幅圖表現的主題最可能是〔104.學測〕", "opts": ["日俄戰爭爆發前，鼓勵青少年從軍", "一次大戰爆發時，鼓吹日本人參戰", "1920 年代，宣導日人移居東亞城市", "1930 年代，向青少年宣揚軍國主義。"], "optImg": false, "ans": 3, "exp": "1931 年，九一八事變爆發，日軍占領中國東北（滿洲），並逐步往華北擴張勢力範圍。當時日本右翼勢力大興，少壯派軍人掌權，軍國主義盛行，因此有這張明信片的出現。(Ａ)日俄戰爭爆發前，日本在東北的勢力尚不穩固，遑論華北與華中地區。(Ｂ)第一次世界大戰時日本雖然參戰，但與中國並非敵對關係，不會將目標指向中國本土。(Ｃ)移居東亞城市沒有必要拿著刀槍。", "figs": [{"src": "i-007-000.jpg", "cap": ""}], "small": false}], "key": "1_28"}, {"sec": "一、單選題", "n": "29", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "一本書中提到：「在近代日本持續形成，以『亞洲』一體、連帶的口號與『西洋』相抗衡，藉以尋求日本定位的對外認識構圖，特別是在西力東漸之下，日本希望在亞洲國家中脫穎而出，率先追求西洋化與近代化，並帶領亞洲國家共同變革，以驅逐列強勢力。」有關上述之說明何者正確？", "opts": ["此為 18 世紀日本流行的思想", "日本主張其為亞洲國家之領袖", "日本欲脫離亞洲的頑固守舊行伍", "日本以新帝國主義的姿態欺凌亞洲國家。"], "optImg": false, "ans": 1, "exp": "書中所提及的應該是 19 世紀日本的「興亞論」思想，強調東亞地區的國家應該要彼此互助團結，共同驅逐列強的勢力。(Ａ)應該是 19 世紀。(Ｃ)(Ｄ)此應為「脫亞論」的主張。", "figs": [], "small": false}], "key": "1_29"}, {"sec": "一、單選題", "n": "30", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "雜誌上登載的文章，其中有「中國固有的倫理、法律、學術皆封建制度之遺，與西人相較，相去極遠，如不改進，必不能存於今日世界。」又有「西俗以橫厲無前為上德，中國以閒逸恬淡為美風，實為中西民族強弱的大原因。」再有「若篤舊不變，而無世界知識，不知順應世界潮流，絕難立足。」這些議論最可能反映哪一時期的思想？〔103.指考〕", "opts": ["林則徐為代表的鴉片戰爭時期思想", "李鴻章為代表的自強運動時期之思想", "康有為為代表的戊戌變法時期思想", "陳獨秀為代表的新文化運動時期思想。"], "optImg": false, "ans": 3, "exp": "題幹中除了批判「制度」外，還認為中國的「習俗」（為「文化層次」）亦難以與西方相提並論，必須改變，可知這個議論為民國初年新文化運動時期的思想。另外，文章中提及中國固有的倫理、法律、學術為「封建制度」之遺，是「共產主義」的思維，這裡所指的「封建制度」不是中國商周時代的封建制度，也不是西歐中古的封建體制，指的是馬克思共產經濟學說的歷史發展階段；就其理論而言，在人類歷史進化過程中，封建制度終將被淘汰。所以這可能是陳獨秀等主張共產主義的知識分子所提出的主張。", "figs": [], "small": false}], "key": "1_30"}, {"sec": "一、單選題", "n": "31", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "一位朝鮮的使臣曾在北京受洗，成為第一位朝鮮受洗入教的代表，他曾向北京主教提出要求派遣一位神父到朝鮮傳教，但當時朝鮮嚴格禁止西洋人入境，所以北京教區主教決定派遣相貌與朝鮮人相同的中國傳教士進入朝鮮傳教，1791 年 12 月 23 日，○○教士歷盡艱辛，潛入朝鮮國境，隨即開始了傳教活動，當時入教信徒有兩班顯貴，也有卑賤的士卒，共四千餘人，使傳教活動逐漸獲得成果。之後，朝鮮政府將天主教視為邪教，不斷逮捕處決教徒。請問由文中可知朝鮮政府一開始接受天主教傳播，之後又採取嚴格取締的方法，其原因為何？", "opts": ["不認同天主教教義內容", "覬覦天主教的龐大教產", "引發傳教的禮儀之爭", "傳教士捲入皇位繼承紛爭。"], "optImg": false, "ans": 0, "exp": "朝鮮政府決定取締天主教信仰主要是認為天主教為邪教，其部分的教義內容難以被接受，故答案選(Ａ)。", "figs": [], "small": false}], "key": "1_31"}, {"sec": "一、單選題", "n": "32", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "清末一位學者留學日本，研習法律與政治。他主張「民主革命富於破壞，中國已有東亞病夫之名，不堪服猛劑以招危亡。英日兩國皆以君主立憲而強，可資借鏡。」以下清末民初許多言論中，何者與該學者的主張一致？〔93.學測〕", "opts": ["古代的周召共和實為君主政體", "革命排滿是必要而非仇殺報復", "天賦人權說就是主張共和體制", "民國主權的基礎本於全體國民。"], "optImg": false, "ans": 0, "exp": "該學者反對革命，贊成君主立憲政體。(Ａ)周厲王被放逐，由周定公、召穆公共同攝政，體制仍保有君主。(Ｂ)(Ｃ)(Ｄ)主張民主共和政體，沒有君主。", "figs": [], "small": false}], "key": "1_32"}, {"sec": "一、單選題", "n": "33", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "一份文獻記錄乾隆年間一群西方人在北京的經歷，提到朝廷禮儀繁重，但使人感受到宗教式的肅靜。沒有人在典禮進行時竊竊私語，「這種肅靜莊嚴是本方的特色，歐洲文明還沒有達到這點。」這份文獻最可能是由以下何人記錄的？〔94.指考〕", "opts": ["在朝廷任職的耶穌會士", "英國派遣來華的使節", "葡萄牙東印度公司職員", "俄國駐在北京的商人。"], "optImg": false, "ans": 1, "exp": "(Ａ)雍正時已禁教。(Ｃ)英使馬戞爾尼在乾隆年間來華到北京。(Ｄ)雍正五年的中俄《恰克圖條約》，允俄在北京設教堂並派留學生，但通商限於恰克圖。", "figs": [], "small": false}], "key": "1_33"}, {"sec": "一、單選題", "n": "34", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "1909 年 10 月 30 日，日本檢察官溝淵孝雄、書記岸田愛文曾進行一次審訊，被審訊者陳述其槍殺動機如下：「(１)殺死明成皇后；(２)廢黜高宗皇帝；(３)強迫朝鮮簽訂《乙巳條約五項條約》與《丁未條約七項條約》；(４)屠殺無辜的朝鮮人；(５)搶奪朝鮮政府權力；……。」此審訊案應該是", "opts": ["東學黨起事案", "伊藤博文被刺案", "大院君親日案", "西鄉隆盛叛亂案。"], "optImg": false, "ans": 1, "exp": "1909 年朝鮮排日運動如火如荼展開，伊藤博文被暗殺身亡，隔年韓國遭到日本併吞。", "figs": [], "small": false}], "key": "1_34"}, {"sec": "一、單選題", "n": "35", "stem": "", "figs": [], "subs": [{"type": "mc", "label": "", "q": "蔣中正在北伐完成之後，全國進入形式上的統一。然而，其卻等到 1930 年以後才開始剿共。 約》：1895 年；(丁)《辛丑條約》：1901 年。", "figs": [], "small": false}], "key": "2_44"}, {"sec": "二、題組", "n": "45", "stem": "清朝初年，政府起用傳教士協助官員繪製《皇輿全覽圖》。康熙 52 年 5 月 20 日（陰曆），皇帝下令：「往河南、江南畫輿圖去的官和西洋人不必回來，就彼處往浙江舟山等處、福建臺灣等處畫去。但走海時，著伊等謹慎看好天色時節行走，不必急了。」從康熙 49 年到 55 年共完成「有度數直隸、山東等 13 省全省圖 14 張」。這些地圖都以「府」為基本量算單位，用墨色硬筆繪製，度數用阿拉伯數字記在圖的邊框，山川城鎮符號基本一致。請問：〔108.學測〕", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "協助清朝官員繪製地圖的傳教士最可能是", "opts": ["法國的耶穌會教士", "英國的長老會教士", "荷蘭的喀爾文教士", "俄羅斯的東正教士。"], "optImg": false, "ans": 0, "exp": "明末清初到中國傳教的傳教士為天主教（舊教）傳教士，其中以耶穌會傳教士為主，他們帶來當時西方的地理學、天文曆法、數學等西學知識，對當時中國在這些領域方面的發展影響頗深。(Ｂ)(Ｃ)為基督教（新教）、(Ｄ)東正教士，當時未到中國傳教。故選(Ａ)。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "論者認為：《皇輿全覽圖》係由傳教士執筆繪製。題文中哪項資料可支持此論點？", "opts": ["全圖使用墨色硬筆繪製", "山川城鎮符號基本一致", "以府為基本的量算單位", "度數用阿拉伯數字標記。"], "optImg": false, "ans": 3, "exp": "《皇輿全覽圖》是中國第一幅繪有經緯網絡的全國地圖，由當時聘請的西洋傳教士經過經緯度測量繪製而成。地圖中的「度數」用阿拉伯數字標記，因中國在此之前並沒有使用阿拉伯數字的習慣，明顯是由國外傳入的書寫數字方式，故以(Ｄ)「度數用阿拉伯數字標記」最適合判讀《皇輿全覽圖》是由西洋傳教士所繪製的關鍵。(Ａ)中國人在先前自行繪製的地圖中已有出現。(Ｂ)「山川城鎮符號基本一致」應是繪製地圖的共識。(Ｃ)題幹引文中「共完成『有度數直隸、山東等 13 省全省圖 14 張』。這些地圖都以『府』為基本量算單位」，顯示當初《皇輿全覽圖》是由各省分測量繪製而成，故「以府為基本的量算單位」，只能說明《皇輿全覽圖》是由各省分別繪製拼湊而成。", "figs": [], "small": false}], "key": "2_45"}, {"sec": "二、題組", "n": "46", "stem": "「有一部日本動畫影片呈現長崎港出島的情景，影片的主角來到這座人工島後，與幾位歐洲商人談論有關貿易的事宜，言談間，也從他們那裡得知許多西方的科學新知與重要時事。對那個年代的日本人而言，這裡可說是外來文化傳入境內的唯一門戶。」請根據以上內容回答下列問題：", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "這部動畫影片最有可能呈現哪一年代的日本？", "opts": ["1550 年代", "1650 年代", "1860 年代", "1930 年代。"], "optImg": false, "ans": 1, "exp": "日本在 1633 年開始首度頒布鎖國政策，直到 1853 年美國軍艦叩關後才結束。上述情境提到長崎是西方文化傳入的唯一門戶，可知應為日本的鎖國時期，故答案選(Ｂ)。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "這位主角在出島會晤的歐洲人是來自哪一國家？", "opts": ["葡萄牙", "西班牙", "荷蘭", "英國。"], "optImg": false, "ans": 2, "exp": "日本在鎖國時期，荷蘭是唯一被允許前來從事貿易活動的西方國家。", "figs": [], "small": false}], "key": "2_46"}, {"sec": "二、題組", "n": "47", "stem": "附圖描繪十八世紀末亞洲某港口的景象。該國政府鑑於外商日多，就在海口劃一特區，由外商依國籍設立貨棧，懸掛國旗標示。圖中，外商由左至右分別是美國、瑞典、英國與荷蘭。外商每年只能停留七個月，每月進城次數也有限制，與政府交涉須透過本地商人中介。〔111.分科〕", "figs": [{"src": "i-011-001.jpg", "cap": ""}], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "圖中的港口最可能是", "opts": ["巴達維亞", "馬尼拉", "長崎", "廣州。"], "optImg": false, "ans": 3, "exp": "清朝在乾隆 22 年（1757 年）限制中國對外貿易僅能在廣州一口通商，並設置公行制度，要求外商與中國政府交涉或購買貨物皆須經由公行，還陸續制定諸多規範，如：限制通商時間、進城次數、不得直接與中國人民往來、不得坐轎、不得學習中文等，因此題文所述港口應為中國的廣州。(Ａ)巴達維亞在十八世紀末仍為荷蘭殖民地。(Ｂ)馬尼拉在十八世紀末仍為西班牙殖民地，因此並不會有這麼多限制。(Ｃ)日本於 1630 年代採取鎖國政策，在鎖國時期能進入長崎與日本貿易的僅有中國與荷蘭，因此港口不會停舶這麼多各國的船隻。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "該國政府在海口劃定通商特區，並對外商活動設下限制，反映該國對外商前來貿易時，所持想法為何？", "opts": ["通商並不是一種互惠，而是施惠於人", "外人經商只是幌子，目的是領土擴張", "擔心外商挾著船堅砲利，恐顛覆政權", "限制貿易地點，目的是防堵白銀外流。"], "optImg": false, "ans": 0, "exp": "中國在面臨到清末外力入侵以前，對待外國的方式是以「天朝上國」自居的朝貢體制，也就是以中國為中心，而其他國家若接受朝貢體制則成為藩屬國，中國與外國間的關係並非對等，而是君臣關係，並將對外貿易作為一種懷柔四夷的手段，由中國自行制定規範，各國必須遵守，否則便會關市以作為懲罰。", "figs": [], "small": false}], "key": "2_47"}, {"sec": "二、題組", "n": "48", "stem": "1871 年年底，新政府為了改革派出了龐大的歐洲考察團，在長達一年九個月的摸索考察裡，探索出一條以自身政治與法律制度特點、儒家與神道思想和西洋的科學技術相結合的獨特國家制度和發展道路。考察團在造訪德國之後，便找到自己國家迫切需要的發展模式。請問：", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "上述所說的新政府成立與哪個事件有關？", "opts": ["黑船事件", "自強運動", "大政奉還", "百日維新。"], "optImg": false, "ans": 2, "exp": "從題幹中提及的 1871 年與神道思想，可以推測出這是日本明治維新時期。大政奉還後，德川慶喜還政於明治天皇，因此答案選(Ｃ)。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "考察團考察德國後可能認為哪一種發展模式適合自己國家？", "opts": ["統治者為虛位元首發展共和制", "民主制度直接選出領導人", "政府讓工業自由發展", "由國家來主導工業發展。"], "optImg": false, "ans": 3, "exp": "考察團採用德國改革與俾斯麥鐵腕政策，由國家來主導工業發展。(Ａ)日本君主立憲仿造德國，天皇有實權。(Ｂ)日本實行君主立憲非民主制度。(Ｃ)由於在生產技術上，無法與先進國家公平競爭，財團需要依賴政府、軍隊的保護和特許，才能在海外或殖民地發展、獲利。因此財團長期與軍部合作，成為軍國主義的擁護者。", "figs": [], "small": false}], "key": "2_48"}, {"sec": "二、題組", "n": "49", "stem": "1651 年，法國傳教士羅德士（Alexandre de Rhodes）整合越語的羅馬拼音規則，編纂《越南語―拉丁語―葡萄牙語辭典》。但此後數百年間，越語的羅馬拼音形式都僅限在傳教時使用。直到某事件後，法國人開始殖民越南，才將羅馬拼音的越語（又稱「國語字」）定為正式文字。相關規定逐漸確立，例如官員必須學習國語字才能升遷；學校教育一律使用國語字教學；政府公文、報紙刊物也改用國語字等，使國語字的使用範圍大大超越傳統的漢字。請問：", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "題文中「某事件」應為下列哪一事件？", "opts": ["阮氏政權建立", "阮朝宣布禁教", "清法戰爭爆發", "簽訂《順化條約》。"], "optImg": false, "ans": 3, "exp": "羅馬拼音越語（國語字）原本主要由傳教士使用，並未成為官方文字。直到 1884 年《順化條約》簽訂，越南正式淪為法國「保護國」，法國遂全面推動殖民統治措施，其中包括以國語字取代漢字，並在官僚考試、學校教育及出版制度上全面採用國語字，故選(Ｄ)。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "法國將國語字訂為正式文字，並訂立相關使用規定，可能也蘊含什麼用意？", "opts": ["去除漢字與中國文化影響", "使越南人民更加熟悉法語", "啟蒙人民去了解民族主義", "鼓舞越南人民的愛國情感。"], "optImg": false, "ans": 0, "exp": "法國在殖民越南後推行國語字，目的之一是削弱越南原有以漢字、儒學為核心的文化體系，讓社會脫離既有的知識菁英語言與傳統文化根基，進而削弱以儒家為基礎的政治權威與文化認同，便於殖民統治，故選(Ａ)。", "figs": [], "small": false}], "key": "2_49"}, {"sec": "二、題組", "n": "50", "stem": "這個國家的知識分子深受中國近代活動影響深遠，並曾尋求華人領袖對該國獨立的支持。前期偏向君主立憲，後又受革命起義浪潮影響，並成為同盟會的主要基地之一。請問：", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "根據題文，請問下列哪一選項所代表的行動，最能深刻影響這個國家的發展？", "opts": ["推動朝鮮建國的「獨立協會」", "實施「開化政策」改革的朝鮮", "主張「自由民權運動」的日本", "發動革命行動的「越南光復軍」。"], "optImg": false, "ans": 3, "exp": "越南的潘佩珠先後受到梁啟超與辛亥革命影響，並在 1912 年成立越南光復會，該會宗旨「驅逐法國殖民者，爭取越南獨立，成立越南共和國」，故選(Ｄ)。(Ａ)「獨立協會」致力於朝鮮改革與民族自主，其活動影響主體為朝鮮半島，與題幹描述的「向中國革命力量尋求支持、成為同盟會基地」並不相符。(Ｂ)開化政策屬於朝鮮內部的近代化改革，與題幹所說「尋求華人領袖對該國獨立的支持」的特徵無關，也與同盟會的活動核心毫無直接連結。(Ｃ)日本「自由民權運動」主要影響日本國內的憲政化發展，並未使日本成為同盟會的活動基地，也不具有向華人領袖尋求支持的歷史脈絡。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "這個國家在近代以前士人長期深受中國文化影響，並將此視為凝聚民族認同的重要基礎。依此背景，該國受到中國影響的主要因素是下列何者？", "opts": ["認同漢學的文化傳統", "勤王運動引進新思想", "越南學生主要留學地", "中國為成功獨立先驅。"], "optImg": false, "ans": 0, "exp": "19 世紀末，法國殖民當局在越南積極推行羅馬拼音文字，改變了以漢字為主的文化傳統。越南愛國人士則提倡「漢文即國文，孔學即國學」，儒家思想成為越南人民擺脫殖民統治、反對外來政權的號召，故選(Ａ)。(Ｂ)越南勤王運動主軸在於保衛阮朝政權、反抗法國統治，性質為傳統忠君，不是引進中國近代新思想。(Ｃ)越南近代留學生主要前往日本、法國，而非中國，故不選。(Ｄ)中國在近代並未成為越南獨立運動的成功典範，此說法與歷史事實不符。", "figs": [], "small": false}], "key": "2_50"}, {"sec": "二、題組", "n": "51", "stem": "甲大臣向皇帝報告：「……這東西，禁是禁不住的，貪官汙吏是擋不住的。不如索性開放，我們自己種，自給自足，那洋人從我們這裡就賺不到錢了，洋人自己就走了。」皇帝聽完之後仍是猶豫不決，就在這時，關鍵的乙大臣出現了，他對皇帝上書：「……，四萬萬人口，哪怕只有百分之一吸煙，每年漏走的白銀就不止億兩了。現在官兵都在吸煙，照這樣下去，幾十年後，還有誰能打仗啊。」皇帝恍然大悟，驚覺這東西威脅到自己的統治，於是做出了禁煙的決定。請問：", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "閱讀上文後，下列哪一項「不是」皇帝下令禁煙的理由？", "opts": ["白銀大量流入", "未來無可用之兵", "威脅統治政權", "白銀大量外流"], "optImg": false, "ans": 0, "exp": "鴉片的大量輸入，使中國白銀不斷外流，影響國家財政，且敗壞社會風氣，損害國民健康。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "下列選項中的事件何者與上文中的皇帝有關？", "opts": ["開放五口通商", "火燒圓明園", "臺灣正式開港", "割讓九龍半島。"], "optImg": false, "ans": 0, "exp": "(Ｂ)(Ｃ)(Ｄ)皆與英法聯軍有關，當時是咸豐皇帝在位時。", "figs": [], "small": false}], "key": "2_51"}, {"sec": "二、題組", "n": "52", "stem": "請閱讀以下資料：<br>資料一：新政的目的在於富國強兵，重點包括外交、軍事、工業、交通與教育等方面。新政雖然缺乏全盤規劃且成效有限，但新觀念的引進與人才培育方式，對近代化仍有一定影響。<br>資料二：新式學堂的普遍設立與科舉制度的正式廢除，造成傳統士大夫階級的式微，在國內接受新式教育者以及赴海外留學的歸國學人，也逐漸形成一批新知識分子。<br>資料三：鑒於當時政治體制難以正常運作且亂象紛呈，有識之士期望探索新的救國之道，開始強調從文化方面進行革新的重要性，認為應當擺脫傳統束縛、建立新的文化與價值觀。<br>請根據上述資料回答下列問題：", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "關於三則資料的內容，下列說明何者正確？", "opts": ["上述資料按時間順序排列，應為資料二、資料一、資料三", "在資料一的時代，朝野人士都強調應從制度層面進行改革", "在資料二的時代，《新青年》等刊物的風行有助於西學的普及", "在資料三的時代，文化界開始出現「打倒孔家店」等口號。"], "optImg": false, "ans": 3, "exp": "(Ａ)資料一：自強運動→資料二：庚子新政→資料三：新文化運動。(Ｂ)當時只重視器物層面的改革，還未重視制度層面的改革。(Ｃ)應為民初新文化運動時期。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "關於資料三的內容，下列敘述何者符合史實？", "opts": ["文中提到的政治體制是指君主立憲，故其背景為立憲運動時期", "當時是北伐完成後，知識分子反對訓政體制而開始提倡新文化", "這個時期的白話文廣受接納，社會主義思想也獲得相當的重視", "提倡新文化與批判舊文化的呼聲在五四運動後已開始趨於式微。"], "optImg": false, "ans": 2, "exp": "(Ａ)民國以後為共和政體。(Ｂ)新文化運動是從 1915 年開始。(Ｄ)新文化運動在五四運動後更為興盛。", "figs": [], "small": false}], "key": "2_52"}, {"sec": "二、題組", "n": "53", "stem": "「隨著東、西方在經貿與文化等方面的交流愈為興盛，雙方之間亦開始出現矛盾與波折。以日本而言，江戶幕府對天主教初期曾實行較為包容的政策，但後來因為認為天主教勢力可能會影響其統治的穩固等因素，對外的政策也趨於緊縮。在此背景下，諸侯原有的貿易收入受到不小的影響，轉而對領地的人民增稅，加上當時又適逢天災帶來的衝擊，導致長崎附近島原地區的農民發動起事，……最後被幕府調動軍力平定。由於參與反抗者有不少人屬於天主教徒，連帶愈為加深幕府對天主教在日本境內傳播的疑慮，也促成江戶幕府開始頒布更為嚴格的對外禁令。」請根據以上資料內容回答問題：", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "西方國家與日本在 16 世紀中葉開啟接觸與交流的契機，與下列哪一情形有密切關聯？", "opts": ["西洋火器與彈藥製造技術的傳入", "日本物產與手工製品的大量出口", "日本對美洲白銀與歐洲商品的需求", "天主教與西學受到知識分子普遍歡迎。"], "optImg": false, "ans": 0, 士們居住並傳教的地方是葡萄牙人向中國朝廷租借的地點。不過一年後他就進入廣東肇慶進行傳教。之後又到韶州、南昌和南京等地先後居住並建立傳教駐地，最後北上到了北京，他在北京長期居住直到病死。他來華傳教的期間，除了介紹天主教教義，還向中國人宣傳西方傳統文化，而他傳播的主要對象就是他所結識的士大夫。同時，他也被中國傳統文化深深的折服，不斷學習和研究，也把不少中國經典著作翻譯傳播到了國外……。」請問：", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "阿鴻的歷史作業可能與哪個朝代有關？", "opts": ["天主教傳入的元朝", "海禁時期的明朝", "閉關自守的清朝", "開放天主教傳教的清朝。"], "optImg": false, "ans": 1, "exp": "歷史作業主題是研究利瑪竇，題目提到利瑪竇來中國時因政策關係先到葡萄牙人租借的澳門居住後才進入廣東傳教，可知與明代實施海禁有關（明穆宗開月港，明神宗又關閉月港）。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "根據上文所述，這位歷史人物在中國傳教的過程何者正確？", "opts": ["他是藉宣揚神蹟的方式來吸收信徒", "他最早來到中國的澳門，之後才到肇慶傳教", "他所結識的士大夫有徐光啟、南懷仁等人", "他的傳教以上流階級為主包含了當時的皇帝。"], "optImg": false, "ans": 1, "exp": "(Ａ)利瑪竇是以學術傳教方式吸引士大夫與其相交，並進而信奉天主教。(Ｃ)南懷仁是清康熙皇帝時的傳教士。(Ｄ)當時的明神宗（萬曆皇帝）並沒有信奉天主教。", "figs": [], "small": false}, {"type": "mc", "label": "(３)", "q": "與這位歷史人物有關的著作是下列何者？", "opts": ["《幾何原本》", "《崇禎曆書》", "《皇輿全覽圖》", "《四洲志》。"], "optImg": false, "ans": 0, "exp": "(Ｂ)湯若望等人幫助徐光啟修改曆法，完成《崇禎曆書》（即《時憲曆》）。(Ｃ)利瑪竇繪《坤輿萬國全圖》，引入地圓說、五大洲、經緯度等觀念，拓展中國人的世界觀。(Ｄ)清代林則徐編纂，內容介紹世界各國的概況。", "figs": [], "small": false}], "key": "2_56"}, {"sec": "二、題組", "n": "57", "stem": "請閱讀以下史料：<br>史料一：「天朝物產豐盈，無所不有，原不藉外夷貨物以通有無；特因天朝所產茶葉、瓷器、絲為西洋各國及『爾國』必須之物，是以加恩體恤，在澳門開設洋行，俾得日用有資，並霑餘潤。今爾『使臣』於定例之外，多有陳乞，大乖仰體天朝加惠遠人，撫育四夷之道。」<br>史料二：「奉天承運皇帝敕諭英咭利國王知悉，咨爾國王遠在重洋，傾心向化，特遣使恭齎表章，航海來廷，叩祝萬壽，並備進萬物，用將忱悃。朕批閱表文，詞意婉懇，具見爾國王恭順之誠，深為嘉許。所有齎到表貢之正、副使臣，念其奉使遠涉，推恩加禮。已令大臣帶領瞻覲，賜予筵宴，疊加賞賚，用示懷柔。其已回珠山之管船官役人等六百餘名，雖未來京，朕亦優加賞賜，俾得普霑恩惠，一視同仁。至爾國王表內懇請派一爾國之人住居天朝，照管爾國買賣一節，此則與天朝體制不合，斷不可行。」<br>請根據二段史料回答問題：", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "史料二中所言：「與天朝體制不合，斷不可行。」對於中國當時的天朝體制思想，「不符合」的是", "opts": ["對於不肯來朝的周邊民族，牴觸天朝之威，以武力征服之", "夷狄入中國則中國之", "入貢藩屬國家帶來許多珍奇寶物，但往往收穫更豐", "以一種上對下的君臣觀念為外交政策。"], "optImg": false, "ans": 0, "exp": "(Ａ)對於外族要來朝貢與否，並不勉強。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "從文化發展的角度來看，根據這兩段資料可以延伸判斷", "opts": ["中國已有健全的外交體制，打破傳統上對下的朝貢觀念", "中國經濟仍是以農為主，自給自足的經濟型態", "英國物產不似中國之豐，希望能與中國建立朝貢關係", "東南亞各國，在文化上受到日本文化影響已超越中國。"], "optImg": false, "ans": 1, "exp": "(Ａ)中國須至鴉片戰爭以後，才被迫與外國建立較為對等的外交關係。(Ｃ)英國是因工業革命之後，需更大的市場來購買其商品，希望打開中國通商管道，並非想來中國朝貢。(Ｄ)應是中國文化影響較大。", "figs": [], "small": false}], "key": "2_57"}, {"sec": "二、題組", "n": "58", "stem": "請閱讀以下資料：<br>資料一：這次變革對社會文化的變遷亦發揮促進作用，由於新式教育的確立與科舉制度的廢除，造成傳統士大夫漸趨式微。由新式學堂畢業和海外留學返國者形成的新知識分子群體，在社會上開始發揮重要影響。<br>資料二：這些新政實施的背景，與當時來自外力的衝擊有密切的關聯。在制度的改革上，有許多仿效日本的體制，包括中央政制與教育等領域，例如：當時的學制即分為小學堂、中學堂與高等學堂三個階段。", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "關於二則資料的描述，下列的解讀哪一項正確？", "opts": ["資料一提到的改革，已開始提倡白話文且全面檢視傳統", "資料二提到的外力衝擊，是指兩次英法聯軍之役的影響", "當時新式教育偏重技術與外語，包含的範圍相對較為有限", "兩則資料都在描述庚子後新政，其對新文化發展有一定影響。"], "optImg": false, "ans": 3, "exp": "(Ａ)開始提倡白話文且全面檢視傳統，是在民初新文化運動。(Ｂ)應為八國聯軍之役帶來的影響。(Ｃ)選項的敘述較為接近自強運動時期的情況。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "下列各項情境何者屬於這二則資料描述的時代？", "opts": ["廢纏足與興辦女學的主張開始獲得提倡與重視", "標榜民主與科學精神，並提出全盤西化的主張", "批判與否定傳統儒學價值，視為「吃人的禮教」", "強調「師夷長技以制夷」，重視器物層次的變革。"], "optImg": false, "ans": 0, "exp": "二則資料內容都與庚子後新政的影響有關。(Ｂ)(Ｃ)新文化運動時期。(Ｄ)自強運動時期。", "figs": [], "small": false}], "key": "2_58"}, {"sec": "二、題組", "n": "59", "stem": "《婦女雜誌》的創刊祝詞中提到：「近二十年，中外大通，形見勢蝕，乃知歐美列強縱橫於世界，非徒船堅砲利也，實由賢母良妻淑女之教，主持於內，為國民之後盾也。起視吾國婦女，倚賴成性，失養失教，能不痛哭流涕而長太息也耶！」請問：", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "由此雜誌的內容可知，歐美列強之所以可以縱橫世界的原因為何？", "opts": ["國內的軍事武力強大", "國家重視民主憲政發展", "女子扮演賢妻良母的角色", "女權自主意識高漲。"], "optImg": false, "ans": 2, "exp": "由文中可知歐美列強的強大與「賢母良妻淑女之教」有關，故應該是重視女子教育。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "由雜誌的內容可知，當時中國面對的問題應該是", "opts": ["軍事武力薄弱", "女子無法教育兒女", "婦女德性不彰", "婦女無法獨立自主。"], "optImg": false, "ans": 1, "exp": "《婦女雜誌》提到中國的婦女「倚賴成性，失養失教」是最大問題，過去不重視女子教育，使得中國婦女無法扮演在家庭中教育兒女的角色。", "figs": [], "small": false}], "key": "2_59"}, {"sec": "二、題組", "n": "60", "stem": "請閱讀以下兩段資料，並回答問題：〔94.學測〕<br>資料一：其時歐戰方酣，某國實行遠交近攻政策，欲與我方修好，知國父反對參戰，故願助其組織護法政府以對抗北京。<br>資料二：民國六年，總理黎元洪被督軍團脅迫解散國會，國人大憤，國父在滬力圖起兵護法，但缺乏經費。適有某國醫生輾轉告知國父：「如孫公有起兵護法之決心，某國願助資百萬。」國父知悉後，甚感快慰。……未幾，遂有（海軍總長）程璧光率軍南下及廣州名集非常國會之舉。", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "在資料一與資料二中，「某國」是指下列哪一個國家？", "opts": ["俄國", "日本", "英國", "德國。"], "optImg": false, "ans": 3, "exp": "(Ｄ)大戰期間，北京政府第一次世界態度是對德宣戰，因此可知，認同國父反戰態度且幫助國父對抗北京政府的列強是德國。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "資料一與資料二敘述的歷史變化，對中國政局造成了什麼影響？", "opts": ["洪憲失敗", "五四運動", "南北分裂", "中共崛起。"], "optImg": false, "ans": 2, "exp": "北京政府解散國會，國父在南方進行護法運動，中國此時是南北分裂時期。", "figs": [], "small": false}], "key": "2_60"}, {"sec": "三、多選題", "n": "61", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "明詠是一位中國上海的富商，他曾在 1920 年代初期前往越南處理商務，並在西貢等城市居住數月。請問他在越南期間有可能會有哪些見聞或經歷？", "opts": ["他得知法國在越南推動咖啡與橡膠等作物的生產", "他曾聽說越南有抗法人士積極推動越南獨立運動", "他發現法式麵包與咖啡已進入越南人的餐飲文化", "他曾在西貢參觀過多座由法國人興建的天主教堂", "他觀察到越南官方與民間仍然普遍使用漢字書寫。"], "ans": [0, 1, 2, 3], "exp": "(Ｅ)19 世紀後半葉，法國殖民當局在越南積極推行羅馬拼音文字，改變了以漢字為主的文化傳統。", "figs": []}], "key": "3_61"}, {"sec": "三、多選題", "n": "62", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "「財閥」是近代日本新興資本主義的特色，三井財閥的形成是其典型。1670 年代，三井家族在江戶及京都建立乾貨零售點，漸成為江戶幕府金主。1860 年代，他們同時也親近倒幕勢力。1876 年時，創辦銀行，承辦政府稅收，並成立物產公司開拓貿易業務。1888 年，三井物產收購官營三池煤礦，賣煤給英國蒸汽船公司，換取到上海、香港、倫敦設立分公司之權。在 1880 年代，三井已是一個集銀行、礦產、貿易三者的大集團。根據上文，三井財閥的形成是靠哪些因素？〔105.指考〕", "opts": ["投資科技研發", "經營政商關係", "進行企業併購", "跨足多種產業", "依賴政府投資。"], "ans": [1, 2, 3], "exp": "從「成為江戶幕府金主」、「同時也親近倒幕勢力」、「承辦政府稅收」可知三井集團善於(Ｂ)經營政商關係。從「收購官營三池煤礦」，可知三井集團有(Ｃ)進行企業併購。從三井「建立乾貨零售點」、「創辦銀行」、「賣煤給英國蒸汽船公司」、「集銀行、礦產、貿易」等敘述，可知三井集團(Ｄ)跨足多種產業。(Ａ)投資科技研發、(Ｅ)依賴政府投資並無法在題幹中看到。", "figs": []}], "key": "3_62"}, {"sec": "三、多選題", "n": "63", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "林則徐禁煙之後，英國有一些工業城市，如曼徹斯特、利物浦等城市的商會立即宣稱：「中國的禁煙運動給了我們一個戰爭的機會，提出我們自己的條件，強迫中國接受。這種機會也許不會再來，是不能輕易放過的。」對於此論點我們可以了解何事？", "opts": ["禁煙運動是鴉片戰爭爆發的根本原因", "中英戰爭的爆發是必然的，禁煙運動則加速了這場戰爭的到來", "禁煙運動的發生是必然的，鴉片戰爭的發生卻是偶然的", "禁煙運動是鴉片戰爭的導火線", "如果沒有林則徐的禁煙，就不會有鴉片戰爭的爆發。"], "ans": [1, 3], "exp": "從商會的這段言論中可以了解，英國在工業革命之後，急欲打開中國的市場，禁煙給了他們一個好機會。所以禁煙是鴉片戰爭的導火線，沒有禁煙運動，英國還是會找機會或理由，試圖打開中國市場。", "figs": []}], "key": "3_63"}, {"sec": "三、多選題", "n": "64", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "1871 年出版的一本書中提到：「近來風俗日趨華靡，衣服僭侈，上下無別，而滬為尤甚。洋涇濱負販之子，猝有厚獲，即御狐貉，炫耀過市。真所謂彼其之子，不稱其服也。……衙署隸役，不著黑衣，近直與縉紳交際，酒食遊戲徵逐，恬不為怪，此風不知何時可革。」下列有關此書的說明何者正確？", "opts": ["書中所描述的應該是上海的生活概況", "經濟的開發造成人們消費力的提升", "作者對當地出現的奢靡現象深感憂慮", "書中所提到的變化與開港通商有關", "此時的中國社會嚴守上下階級之分，風氣略顯保守。"], "ans": [0, 1, 2, 3], "exp": "(Ｅ)清末以來，由於火車、輪船等新式交通工具，以及現代工業和海外貿易的興起，使東南沿海、長江沿岸各通商口岸迅速發展，西方物質文明、思想輸入，社會風氣改變，成為歐風東漸的基地和櫥窗，上海就是一個典型的新興城市。", "figs": []}], "key": "3_64"}, {"sec": "三、多選題", "n": "65", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "17 世紀以來，西洋文明東傳，衝擊東亞文化圈的中國和日本。請問至 19 世紀中葉以後，中日兩國有哪些際遇和採行哪些因應措施？", "opts": ["兩國都曾實施閉關鎖國，但都被迫向西方開放通商", "兩國面臨西力衝擊，都向歐美學習富國強兵的道路", "兩國面對列強壓力，都先後產生近代化的改革運動", "日本與朝鮮都對中國存在朝貢關係，藉此展開貿易", "日本與中國清朝因朝鮮問題產生對立甚至引爆戰爭。"], "ans": [0, 1, 2, 4], "exp": "(Ａ)鎖國時間：清朝 1723 ～ 1842 年；日本 1633 ～ 1854 年。(Ｂ)(Ｃ)中國甲午戰爭後掀起政制改革運動，日本則有明治維新改革運動。(Ｄ)明清時期因倭寇問題，日、中不存在朝貢關係。(Ｅ)清光緒年間朝鮮東學黨農民起義引發的清日甲午戰爭。", "figs": []}], "key": "3_65"}, {"sec": "三、多選題", "n": "66", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "在 1920 年代以後曾有句諺語說到：「人人都學□□樣，學來學去學不像；等到學得三分像，□□又變新花樣。」這段話反映了這座城市在經濟與文化風尚方面扮演了引領的重要角色。關於這座城市的相關說明，下列哪些敘述正確？", "opts": ["上述的□□為華北地區的天津，為全國金融中心", "這座城市在清朝推動自強運動以後正式開港通商", "此地的外資銀行眾多，也是歐風東漸的重要櫥窗", "全國大型現代工業半數集於此，且外來人口眾多", "當地的商人與資本家，亦有對政局的重要影響力。"], "ans": [2, 3, 4], "exp": "(Ａ)這座城市應為上海。(Ｂ)在《南京條約》簽訂後正式開港通商。", "figs": []}], "key": "3_66"}, {"sec": "三、多選題", "n": "67", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "清末民初的中國與明治時期的日本，都受到來自西方文化的影響而出現多方面的改變。關於西方文化傳入對中、日造成的影響，下列說明哪些正確？", "opts": ["西方文化的影響範圍，在最初只限於幾個大城市", "新思想透過報刊傳播，有助於國民現代性的增加", "清廷與日本都曾實行興女學、廢纏足與散髮的政令", "西方民主思想的傳播都有助於兩國共和政體的建立", "兩國的知識分子都期望藉重西方文明促進國家富強。"], "ans": [0, 1, 4], "exp": "(Ｃ)清廷未實行散髮的政令，日本婦女並未纏足。(Ｄ)日本是成立君主立憲的政體。", "figs": []}], "key": "3_67"}, {"sec": "三、多選題", "n": "68", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "日本「明治維新」推行一系列的新政，在政治、軍事、經濟、社會與文化等方面都曾帶來重要的影響。請問下列哪些情形與「明治維新」的影響有關？", "opts": ["促成日本真正的統一與共和政體的確立", "新式金融體系的確立以及工商業的成長", "土地權分配的平均化與社會平等的落實", "徵兵制的推行與現代化軍事體系的建立", "西式生活習慣的流行與武士階級的式微。"], "ans": [1, 3, 4], "exp": "(Ａ)日本為君主立憲政體。(Ｃ)土地集中於地主與富商。", "figs": []}], "key": "3_68"}, {"sec": "三、多選題", "n": "69", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "16 世紀末以來，傳教士積極來到中國傳教，使中國的傳統文化受到影響，下列有關此時期的傳教說明，何者正確？", "opts": ["來到中國傳教的是新教的耶穌會，為擴展教區及信眾而來到中國", "沙勿略是來到中國傳教的第一人，並透過允許信徒祭祖、祀孔的方式傳播信仰", "利瑪竇來到中國傳教後，將天主教思想與儒家思想加以結合，吸引士紳階層信奉", "為了吸引中國士紳接受天主教信仰，耶穌會士積極宣揚西方科學知識", "中國因禮儀之爭宣布禁止天主教信仰，中西文化間的交流因而受到影響。"], "ans": [2, 3, 4], "exp": "(Ａ)耶穌會應該是屬於舊教（天主教）。(Ｂ)應該是利瑪竇。", "figs": []}], "key": "3_69"}, {"sec": "三、多選題", "n": "70", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "西元 1857 年，法國曾派蒙狄尼到富春，向阮廷提出三個要求：(１)讓法國傳教士自由傳教及保證天主教徒信教自由；(２)開通商口岸，讓法國在富春設商業代辦處；(３)同意法國在富春建領事館。下列有關此條約的說明何者正確？", "opts": ["由上述提出的要求內容可知，法國試圖護衛天主教在朝鮮的發展", "當時的法國統治者應該是拿破崙", "阮廷曾禁止法國傳播天主教，引發法國的入侵行動", "法國一直以天主教的保護者自居，以武力協助天主教對外傳播", "李承薰曾積極協助宣揚天主教，使天主教的傳教活動推展順利。"], "ans": [2, 3], "exp": "(Ａ)應該是在越南的發展。(Ｂ)應該是拿破崙三世。(Ｅ)李承薰是協助天主教在朝鮮傳播。", "figs": []}], "key": "3_70"}, {"sec": "三、多選題", "n": "71", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "清末民初傳入中國的新思潮對當時的知識分子影響很大，關於當時中國新思潮傳入的情形，下列何者正確？", "opts": ["自強運動期間，新式報紙如雨後春筍般興起，啟發知識分子的思想", "日俄戰爭後，有識之士深感「無知愚民」幾乎招致亡國，紛紛開辦白話報刊", "五四運動開始提倡廢纏足、興女學，女性應擁有受教權", "民國初年許多知識分子將西方各種學說、主義視為救世良方", "清末以來新思想的傳播，鼓吹女性追求身體自由而反對纏足。"], "ans": [3, 4], "exp": "(Ａ)甲午戰爭之後。(Ｂ)庚子事變（義和團事件）後。(Ｃ)清末開始。", "figs": []}], "key": "3_71"}, {"sec": "三、多選題", "n": "72", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "在兩班支配社會的崩解過程中，朝鮮人民遭遇了價值觀與倫理觀的混淆，但並非新興宗教都能迎合百姓的需求，於是標榜吸收儒、道、釋三教精華的「東學」乃應運而生。請問有關東學之主張，下列何者正確？", "opts": ["排斥基督教文明", "因具民族主義色彩，受到官方支持", "吸收儒、佛、道三教精義而成，可見受中國思想影響", "主張平等思想是受洪秀全思想影響", "農民運動失敗後演變成為開化黨。"], "ans": [0, 2], "exp": "東學黨的創始人崔濟愚有感於官方的壓迫和基督教的擴張，創立了號稱集儒、道、釋精髓而為一的「東學」信仰。(Ｂ)思想引起當局的恐慌，領導者崔濟愚被處死。(Ｄ)與洪秀全無關。(Ｅ)開化黨是在 1870 年代，由於受日本明治維新影響，藉以日本經驗改革朝鮮而形成。", "figs": []}], "key": "3_72"}, {"sec": "三、多選題", "n": "73", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "有關東亞各國學術發展，以下敘述哪些正確？", "opts": ["漢代司馬遷提出獨尊儒術，經學成為兩漢學術主流", "日本鎖國期間，仍有接觸西方知識的途徑", "宋、元到明初，程朱理學是學術主流", "19 世紀，朝鮮的東學因主張全面西化而興起", "明清時期西方傳教士來華，傳入西學科技，也研究、翻譯中國傳統經典如《四書》等。"], "ans": [1, 2, 4], "exp": "(Ａ)董仲舒向漢武帝建議獨尊儒術。(Ｄ) 19 世紀時，朝鮮興起集合儒、釋、道及民間信仰的東學，以對抗西學。", "figs": []}], "key": "3_73"}, {"sec": "三、多選題", "n": "74", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "請閱讀下列資料：<br>資料一：「春秋二季，祭孔子並祭祖宗之大禮，凡入教之人，不許作主祭、助祭之事，連入教之人，並不許在此處站立，因為此與異端相同。」<br>資料二：「覽此條約，只可說得西洋等小人如何言得中國之大禮。況西洋等人無一通漢書者，說言議論，令人可笑者多。……以後不必西洋人在中國行教，禁止可也，免得多事。」<br>關於上述兩份資料，下列選項何者正確？", "opts": ["兩段資料所討論的主題是禮儀之爭", "資料一的主張與利瑪竇一致", "資料二應是雍正皇帝的聖諭", "資料一與資料二的立場相悖", "最終羅馬教宗讓步，允許中國教徒可尊孔祭祖。"], "ans": [0, 3], "exp": "(Ｂ)資料一指出入教者不得祭祖、祭孔；利瑪竇則認為應尊重中國國情。(Ｃ)資料二為康熙皇帝的聖諭。(Ｅ)羅馬教宗反對利瑪竇的傳教方式，片面規定中國教徒不准再有敬天、祭祖、拜孔行為。清聖祖基於維護綱常禮教，雖一再曉諭教士應尊重中國傳統禮俗及儒家文化，但教宗仍重申禁令，強調禮儀問題無可妥協。1720 年（康熙 59 年），聖祖因之諭令禁止西洋人到中國傳教。", "figs": []}], "key": "3_74"}, {"sec": "三、多選題", "n": "75", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "一篇文章提到：「公元 1881 年，朝鮮親日派逐漸占得上風，由閔泳翊（閔妃的侄子）……一支新型軍隊—別技軍，這是朝鮮歷史上第一支近代化軍隊，教官全由日本軍官擔任，軍員待遇優厚，士兵薪俸是舊式軍隊的 5 倍還多，舊式軍隊的地位卻迅速下降。」有關上述之說明何者正確？", "opts": ["親日派占得上風是受到江華島事件的影響，朝鮮見識到日本軍裝的精良", "此時的朝鮮出現西化改革的風氣，得到朝野上下一致的支持", "為了推動開化政策，曾遣人赴日本學習軍事訓練技巧及教育制度", "東學黨的出現便是希望透過儒釋道及民間信仰對抗西學流傳", "在高宗主導下推動開化政策下，分別遣人至德國及日本學習軍事技巧。"], "ans": [0, 2, 3], "exp": "(Ｂ)朝鮮的西化改革政策受到保守勢力的反對。(Ｅ)應該是中國及日本。", "figs": []}], "key": "3_75"}, {"sec": "三、多選題", "n": "76", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "在日本鎖國時代，藉此開啟一道日本與西方交流的門徑，其在西方學術的引進、詮釋，以及知識傳播上扮演核心角色，不只是協助翻譯外文著作，許多人也開始在西方學術與日本文化間展開對話，有關此時期的學術發展說明何者正確？", "opts": ["荷蘭人藉由翻譯西書，將西方知識文化引介入日本", "蘭學在日本的傳播與發展，奠定日後明治維新的改革基礎", "蘭學學者曾將日本的中國文化帶回歐洲，掀起歐洲的「中國熱」熱潮", "耶穌會士扮演東西文化學術交流的角色，將西洋文化帶入日本", "日本受到蘭學的影響，積極推動維新變法，成為東亞的重要強國。"], "ans": [0, 1], "exp": "(Ｃ)應該是耶穌會士東來將中國文化帶回歐洲，掀起中國熱的熱潮。(Ｄ)應該是荷蘭人在長崎傳播西方文化，帶動蘭學的發展。(Ｅ)日本是受到美國武力打開通商口岸的影響，才會推動明治維新運動。", "figs": []}], "key": "3_76"}, {"sec": "三、多選題", "n": "77", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "民初新文化運動藉刊物、輿論的鼓吹，促成哪些發展？", "opts": ["舊家庭制度沒落，以及開始興女學、勸禁纏足、婦女要求參政權、婚姻自主，造成大規模的婦女解放運動", "民主與科學的觀念深入人心", "普遍的政治覺醒，有助於反軍閥、反帝國主義的發展", "打破儒家獨尊的地位，引進西方思想學說，尤其使得法西斯主義在中國流行", "白話文學做為啟蒙的利器，有助於群眾的普及教育。"], "ans": [1, 2, 4], "exp": "(Ａ)清末已有興女學及解纏足的相關主張，且並未形成大規模的婦女解放。(Ｃ)新文化運動在思想上深具憂患意識，傾向改革，要求政治民主，因此會提倡民主政治，反對軍閥割據與列強帝國主義。(Ｄ)應是馬克思主義的流行。", "figs": []}], "key": "3_77"}, {"sec": "三、多選題", "n": "78", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "民初新文化運動藉刊物、輿論的鼓吹，促成哪些發展？", "opts": ["婦女要求參政權、婚姻自主，造成大規模的婦女解放運動", "標舉民主、科學精神，全面檢視傳統文化，轉變社會風俗", "人民普遍的政治覺醒，有助於反軍閥、反帝國主義的發展", "引進了西方的思想學說，尤其使得法西斯主義在中國流行", "提倡白話文學並做為啟蒙的利器，有助於群眾的普及教育。"], "ans": [1, 2, 4], "exp": "(Ａ)雖然新文化運動倡導婦女解放，但實際影響侷限於部分知識分子階層，並未造成大規模婦女解放運動。(Ｄ)新文化運動主要引入自由、民主、科學等思想，與法西斯主義無關。", "figs": []}], "key": "3_78"}, {"sec": "三、多選題", "n": "79", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "法國殖民越南之後，在越南推行羅馬拼音文字，改變其文化傳統。但越南國內的知識分子欲擺脫殖民，號召改革救國。潘佩珠是 20 世紀初越南知名抗法領袖，關於其反殖民的作為，下列哪些正確？", "opts": ["潘佩珠與彊柢親王在越南籌組「維新會」，推動獨立革命", "潘佩珠認為日本是亞洲先進國家，嘗試尋求日本援助，在遊說日本政要的過程，獲得日本同情與支援", "潘佩珠曾到日本與康有為會談，並撰寫《越南亡國史》一書", "1912 年在廣州成立「越南光復會」，號召驅逐法國，成立越南共和國", "1925 年潘佩珠在中國遭到法國特務逮捕，爾後被軟禁於順化家中。"], "ans": [3, 4], "exp": "(Ａ)潘佩珠與彊柢親王在日本籌組維新會，推動越南獨立革命。(Ｂ)潘佩珠並沒有獲得日本援助。(Ｃ)潘佩珠到日本是與梁啟超會面。", "figs": []}], "key": "3_79"}, {"sec": "三、多選題", "n": "80", "stem": "", "figs": [], "subs": [{"type": "ms", "label": "", "q": "明末清初耶穌會傳教士帶來了經世的實學，請問有關這些西學，以下哪些敘述正確？", "opts": ["耶穌會傳教士以知識向歐洲以外地區傳教，是基督新教吸收信徒的方式之一", "《皇輿全覽圖》開創往後中國繪製世界地圖的模式", "康熙皇帝曾與利瑪竇合譯《幾何原本》", "雍正皇帝認為西學破壞中國傳統文化，因而禁西學", "南懷仁監造火砲，清廷藉以平定各地亂事。"], "ans": [1, 4], "exp": "(Ａ)耶穌會屬於羅馬教會，是舊教。(Ｃ)與利瑪竇合譯《幾何原本》的是徐光啟。(Ｄ)雍正皇帝因為傳教士介入政爭而禁教，從而西學中斷。", "figs": []}], "key": "3_80"}, {"sec": "四、混合題", "n": "81", "stem": "我（張幼儀）收到徐志摩的信，信上寫到：「無愛之婚姻無可忍，自由之償還自由……彼此有改良社會之心，彼此有造福人類之心，其先自作榜樣，勇決智斷，彼此尊重人格，自由離婚，止絕痛苦，始兆幸福。」……他說我們「前途無限」、「彼此有造福人類之心」是什麼意思？我什麼時候表現過這些潛力了？……徐志摩提到林徽音名字的時候，我心想：他何必在信上寫什麼勇氣和理想？他要他的女朋友，所以才這麼情急。今天人家問起我認不認為徐志摩要求離婚是革命性舉動的時候，我回答「不」，因為他有女朋友在先。如果他打從開始，也就是他告訴我他要成為中國第一個離婚男子的時候，就和我離婚的話，我會認為他是依自己信念行事，我才會說徐志摩和我離婚是壯舉。請問：", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "根據上文，請問這一件婚姻應該最有可能出現在哪一時期？", "opts": ["清末，讀書人盲目追求西洋愛情與婚姻", "民初，受西風的影響開始鼓吹婚姻自主", "黃金十年時期，受蔣中正新生活運動影響", "中共政府建立後，打破傳統追求婚姻自主。"], "optImg": false, "ans": 1, "exp": "上文提及徐志摩以「自由離婚」、「尊重人格」、「改良社會」、「造福人類」等觀念，明顯受到民初新文化運動的影響。這一時期，受到西方自由主義思想的啟發，提倡個人婚姻自主，反對傳統包辦婚姻，並視離婚為一種解放的象徵，故答案選(Ｂ)。", "figs": [], "small": false}, {"type": "text", "label": "(２)", "q": "徐志摩要求張幼儀要作「造福人類之榜樣」，然而張幼儀認為她沒那麼偉大。請問徐志摩這一想法與當時哪一項社會活動（運動）最有密切關係？", "ans": "新文化運動（五四運動）", "exp": "新文化運動提倡「民主與科學」，鼓吹個人自由、平等與人格解放，並且對婚姻與家庭提出革新主張，提倡婚姻自主、自由戀愛以及男女平等。徐志摩要求「自由離婚」和以「改良社會」為名，正體現了新文化運動的核心理念。", "rubric": "<div class='rl'><b>完全給分</b>寫出「新文化運動（五四運動）」</div><div class='rl'><b>不給分</b>填寫非上述內容或未作答</div>", "fields": [], "figs": []}], "key": "4_81"}, {"sec": "四、混合題", "n": "82", "stem": "以下為越南兩個不同時期的外交政策：<br>資料一：除了向中國照舊朝貢，執藩封之禮外，對法國及暹羅則懷往年情誼，以平等之禮相待，但對高棉、萬象（永珍，寮國首都）、南掌（蠻巴拉邦，寮國北部的小國）、水舍火舍（部落名稱）則一律視為藩屬。<br>資料二：希望以中國為外援、黑旗軍為內援抗擊法國的入侵。君王派使臣前去清國朝貢，希望清國能在順化設立招商局，清國亦派大臣前往順化，商討貿易和設置招商局相關事宜。根據歷史學者的解釋，這項措施的目的是讓清國能夠更快得知法國在越南的行動，達到以清國牽制法國的目的。", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "由資料一到資料二，可知越南與清國的關係為何？", "opts": ["維持不變", "逐漸惡化", "日益親善", "逐漸疏遠。"], "optImg": false, "ans": 2, "exp": "資料一的「照舊朝貢」顯示清、越兩國之間維持傳統的宗藩關係，資料二的「希望以中國為外援」顯示在法國入侵越南的背景下，清、越兩國關係更加親善，越南想利用清國制衡法國，清國則不願失去藩屬國。", "figs": [], "small": false}, {"type": "text", "label": "(２)", "q": "由資料一到資料二可知，越南採取的行動，最終導致哪一場戰爭的發生？戰爭結束後，越南的命運為何？", "ans": "戰爭名稱：清法戰爭（或中法戰爭）<br>越南的命運：成為法國的殖民地", "exp": "關鍵字句為「以清國牽制法國」。由資料二可知，清國願意協助越南，遂逐漸與法國發生衝突，於 1883～1885 年發生清法戰爭。清法戰爭的結果，清國與法國各有勝負，但雙方仍簽訂《中法新約》，最後清國承認法國對越南的保護權，越南成為法國的殖民地。", "rubric": "<div class='rl'><b>完全給分</b>完整寫出 A、B 以下兩項答案：<br>A 戰爭名稱填答「清法戰爭」或「中法戰爭」<br>B 越南的命運填答「成為法國的殖民地」或「回歸法國統治」</div><div class='rl'><b>部分給分</b>1-1 戰爭名稱填答「清法戰爭」或「中法戰爭」<br>1-2 越南的命運填答「重新成為殖民地」或「無法獲得獨立地位」</div><div class='rl'><b>不給分</b>填寫非上述內容或未作答</div>", "fields": ["戰爭名稱", "越南的命運"], "figs": []}], "key": "4_82"}, {"sec": "四、混合題", "n": "83", "stem": "請閱讀以下資料，並回答問題：<br>「條約」簽訂後，經由開埠，自此以後「這個城市」從一個海邊的縣城躍身成為遠東的都會城市。慢慢地將根植於江南地區傳統的吳越文化，融入了開埠以後來自西方歐美地區的各國文化，而逐步形成的一種不同於中國其他地區，屬於「這個城市」的獨特文化，也對中國近現代社會生活產生了影響。<br>以文學為例，在現代文學史上，城市文學是一股聲勢壯大的潮流，「這個城市」是中國最先進的都市，因此也是城市文學發源地。上世紀初，全中國出版的文學刊物共五十九種，「這個城市」有五十五種，占總數的百分之九十三點二。<br>城市文學中，又以「鴛鴦蝴蝶派」小說廣受歡迎，面對多數普通市民讀者，此派小說使用白話文寫作，題材多樣，以愛情為主，通常會先在報刊連載，流傳廣、數量多，盈利也高，因此被認為是比較成功的商業文學。", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "上述資料提及：「『條約』簽訂後，經由開埠，自此以後『這個城市』從一個海邊的縣城躍身成為遠東的都會城市。」依照歷史知識判斷，此「條約」是指", "opts": ["《南京條約》", "《天津條約》", "《北京條約》", "《辛丑條約》。"], "optImg": false, "ans": 0, "exp": "鴉片戰爭後簽訂的《南京條約》中，開廣州、福州、廈門、寧波、上海為通商口岸。", "figs": [], "small": false}, {"type": "text", "label": "(２)", "q": "資料所談論的「這個城市」應是哪一座城市？", "ans": "上海", "exp": "從「這個城市」慢慢地將根植於江南地區傳統的吳越文化，融入了開埠以後來自西方歐美地區的各國文化，且是出版業、小說業發達的城市，故可知為上海。五四運動後，文化藝術界把這些言情小說定名「鴛鴦蝴蝶派」，原因來自「卅六鴛鴦同命鳥，一對蝴蝶可憐蟲」，而上海為「鴛鴦蝴蝶派」小說流行的重要城市。", "rubric": "", "fields": [], "figs": []}], "key": "4_83"}, {"sec": "四、混合題", "n": "84", "stem": "18 世紀中葉以後，此時的中國正處於盛世的時期，當朝皇帝號稱十全老人，在位期間平定四川的大、小金川叛亂，與平定臺灣民變。此外，同時期的歐洲□□國，在國內發生生產上的重要改變，大工廠的出現，與產品數量的提升，促使這個國家迫切需要國際貿易，以及取得價格低廉的原料。除此之外，□□國在海外傳教的態度上也希望能夠在沒有限制下擁有更多的自由性。以上種種原因，讓□□國希望能夠改變中國在貿易上的限制。不過，兩國雙方卻在幾十年後發生了衝突。請問：", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "這個國家與中國爆發衝突的主要原因是下列何者？", "opts": ["因為天主教始終沒有傳入中國，因此希望爭取傳教自由", "康熙皇帝將貿易口岸只限定在廣州，進出口貿易受限於公行", "禁教剛實施，朝廷迫害了清教徒", "走私鴉片使白銀外流，禁煙引起戰爭。"], "optImg": false, "ans": 3, "exp": "(Ａ)天主教在明末清初即已傳入中國，而英國是新教國家。(Ｂ)乾隆皇帝。(Ｃ)雍正皇帝開始禁教，未迫害清教徒。(Ｄ)鴉片問題導致中英鴉片戰爭爆發。", "figs": [], "small": false}, {"type": "text", "label": "(２)", "q": "閱讀上文，請寫出□□國內所發生生產上的改變是為哪個歷史事件？", "ans": "工業革命", "exp": "英國發生工業革命後，迫切需要國際市場、原料與自由傳教的權利，希望能改變中國的貿易限制。", "rubric": "", "fields": [], "figs": []}], "key": "4_84"}, {"sec": "四、混合題", "n": "85", "stem": "資料一：19 世紀初，甲國官方曾大肆迫害天主教徒，造成不少人殉教，但天主教仍在境內傳播。1866 年，由於官方禁止天主教的傳教活動，且發生法國傳教士與當地信徒遭到處決的事件。因此，法國以「護教」為由，對甲國發動軍事行動，但在次月因為天候關係而結束。<br>資料二：19 世紀前期，乙國政府曾一度起用法國人，且同意法國人前來通商，但後來又禁止西方傳教士的宣教，雙方關係出現變化。在 19 世紀中葉，由於法國統治者特別強調該國身為天主教保護者的角色，對乙國發動軍事行動，後來也促成 1862 年法國傳教士得到在當地傳教的權利。<br>請根據上述資料回答問題：", "figs": [], "small": false, "subs": [{"type": "text", "label": "(１)", "q": "資料一與資料二提到的甲、乙兩國分別是指哪個國家？", "ans": "甲為朝鮮、乙為越南", "exp": "資料一提到 1866 年官方禁止天主教活動，以及法國宣教士與在地信徒遭到處決的事件，引起法國對江華島發動的軍事行動。由此可知甲國為朝鮮。資料二提到此國政府曾經起用法國人，是因為越南阮氏政權建立的過程，曾經請求法國方面的協助，因此 19 世紀初，此政權一度起用法國人，且同意法國人的通商，以及在 19 世紀中葉法國以保護天主教為由、發動軍事行動後，促成法國傳教士在 1862 年後正式獲得在當地傳教的權利，即可知乙國應為越南。", "rubric": "", "fields": ["甲國", "乙國"], "figs": []}, {"type": "mc", "label": "(２)", "q": "關於以上二則資料的相關說明，下列哪一項符合史實？", "opts": ["甲、乙兩國後來都陸續成為法國在亞洲的殖民地", "資料一的迫害事件是受到維新與守舊派對立引起", "資料二提到的法國統治者，應為法皇拿破崙三世", "兩則資料的政權在最初建立過程都曾求助於法國。"], "optImg": false, "ans": 2, "exp": "(Ａ)只有乙國（越南）成為法國殖民地。(Ｂ)不符合史實。(Ｄ)只有越南的阮氏政權在建立的過程曾求助於法國。", "figs": [], "small": false}], "key": "4_85"}, {"sec": "四、混合題", "n": "86", "stem": "彰化二林楊春福改宗信教後被父親打成重傷，又把他的聖詩燒掉，楊春福取出一把柴刀對他的父親說：「不必打了，你可以殺了我，讓我像李哪吒剖骨還父，剜肉還母，我的靈魂是上帝的，我要回去找他。」父親聽了起初笑，後來哭。他說：「任你去賭博、抽鴉片、為非作歹，我絕不讓你入教，這是一條絕路。」然而，「絕路」指的是與家人的隔緣，與宗族祖先的斷絕。基督徒必須放棄祖先祭祀，這在社會意義上意味著切斷自我與家庭及宗族之間的臍帶關係。請問：", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "由上述文章的內容可知，楊春福的父親反對其信教的原因為何？", "opts": ["違反倫理孝道", "經濟收入有限", "容易為非作歹", "反對一神信仰。"], "optImg": false, "ans": 0, "exp": "由於基督徒必須放棄祖先祭祀，可知反對信教的原因應該是違反倫理孝道。", "figs": [], "small": false}, {"type": "text", "label": "(２)", "q": "外來宗教傳入的過程中，哪一教派曾試圖化解這樣的衝突？其採用的方式為何試說明之。", "ans": "耶穌會；在傳入中國的過程中，耶穌會教士利瑪竇曾允許信徒可以祭祖、祀孔，試圖化解與中國文化間的孝道倫理衝突", "exp": "", "rubric": "<div class='rl'><b>完全給分</b>寫出「耶穌會」、「耶穌會教士利瑪竇曾允許信徒可以祭祖、祀孔」等相關概念</div><div class='rl'><b>部分給分</b>僅寫出上述其中一項</div><div class='rl'><b>不給分</b>填寫非上述內容或未作答</div>", "fields": ["教派", "採用的方式"], "figs": []}], "key": "4_86"}, {"sec": "四、混合題", "n": "87", "stem": "一篇文章中提到：「諸位，你要知道天下事靠人是不行的，總要求己為是，當初那些腐儒說什麼『男尊女卑』、『女子無才便是德』、『夫為妻綱』這些胡說，我們女子要是有志氣的，就應當號召同志與他反對。陳後主興了這纏足的例子，我們要是有羞恥的，就應當興師問罪。即不然，難道他捆著我的腿？我不會不纏麼？男子怕我們有知識、有學問、爬上他們的頭，不准我們求學，我們難道不會和他分辯，就應了麼？這總是我們女子自己放棄責任，樣樣事體一見男子做了，自己就樂得偷懶，圖安樂。男子說我沒用，我就沒用；說我不行，只要保著眼前舒服，就作奴隸也不問了。自己又看看無功受祿，恐怕行不長久，一聽見男子喜歡腳小，就急急忙忙把他纏了，使男子看見喜歡，庶可以藉此吃白飯。至於不叫我們讀書、習字，這更是求之不得的，有什麼不贊成呢？諸位想想，天下有享現成福的麼？自然是有學問、有見識、出力作事的男人得了權利，我們作他的奴隸了。既作了他的奴隸，怎麼不壓制呢？自作自受，又怎麼怨得人呢？這些事情，提起來，我也覺得難過。諸位想想總是個中人，亦不必用我細說。」請問：", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "由文章的內容來加以判斷，寫作此篇文章的主要目的為何？", "opts": ["重申傳統儒家的倫理規範", "提出男女社會分工的證據", "宣揚傳統的婦女美德", "喚起婦女的女權意識。"], "optImg": false, "ans": 3, "exp": "此文為秋瑾的〈敬告中國二萬萬女同胞〉一文之節錄內容，由文中內容可知其抨擊傳統的「男尊女卑」、「女子無才便是德」、「夫為妻綱」等儒家倫理規範，試圖喚醒女性的權利意識，倡導男女能力與地位應該平等。", "figs": [], "small": false}, {"type": "text", "label": "(２)", "q": "由文章的內容中可知，此人對於女性的期許為何？你覺得現今的女性是否已達到這樣的期許？", "ans": "①由文章內容可知作者期待女性可以破除纏足的風俗，並且充實自身、努力向學，擺脫在家庭中的奴隸附屬地位，成為自己的主人。<br>②現今的女性受教育的機會提高，許多人走出家庭在職場展現自身能力，相較於傳統在家相夫教子的女性而言，獲得較高的獨立自主機會", "exp": "", "rubric": "<div class='rl'><b>完全給分</b>寫出「①由文章內容可知作者期待女性可以破除纏足的風俗，並且充實自身、努力向學，擺脫在家庭中的奴隸附屬地位，成為自己的主人。②現今的女性受教育的機會提高，許多人走出家庭在職場展現自身能力，相較於傳統在家相夫教子的女性而言，獲得較高的獨立自主機會」等相關概念</div><div class='rl'><b>部分給分</b>僅寫出上述其中一項</div><div class='rl'><b>不給分</b>填寫非上述內容或未作答</div>", "fields": ["對女性的期許", "現今女性是否已達到"], "figs": []}], "key": "4_87"}, {"sec": "四、混合題", "n": "88", "stem": "一篇文章中提到：「當天主教傳入之後，眼見許多人民順從外來的異教，完全放棄國內本有的禮俗。他們整天埋頭念天主教之經，不顧崇拜祖先；尤其從 1742 年起，羅馬教廷頒布〈自從上主聖意〉（Ex quo Singulari）通諭，不允許崇拜祖先及其有關事情，因為教廷認為崇拜祖先表現出人民的孝道是屬於迷信異端。從此，法國教士團完全禁止大越信徒崇拜祖先，在家不能設立崇拜祖先的奉祀座，並破壞神主牌。這個禁令使得天主教跟大越人民的敬奉祖先傳統產生了很大的衝突，在民間亦出現了很多詞語來排除天主教的影響，如洋教、邪道、死道等。除此以外，天主教亦規定一夫一妻制，入教的人必須遵守規定，但這個條令也不符合當時封建制度的實際生活，因此，17 世紀宣教團在南北方活動時，不少越南人不能信教，主要的原因即是他們現有多個妻妾，不忍心離開她們。」請問：", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "由上述文章的內容來看，此文章想探討的主題應該是下列何者？", "opts": ["〈天主教的宣教方式介紹〉", "〈天主教的海外傳教歷程〉", "〈天主教與傳統信仰的衝突〉", "〈傳教過程中的政教衝突〉。"], "optImg": false, "ans": 2, "exp": "由文章內容可知羅馬教廷禁止大越（越南）信徒崇拜祖先，在家不能設立崇拜祖先的奉祀座，並破壞神主牌，造成天主教與傳統信仰間的衝突。", "figs": [], "small": false}, {"type": "text", "label": "(２)", "q": "由文中可知天主教在傳播時之所以會面對困境，與其何種教義規定有關？試分析之所以產生衝突的原因為何？", "ans": "禁止信徒崇拜祖先、規定一夫一妻制。天主教不允許信徒崇拜偶像，故而信徒也不能崇拜祖先牌位，且鼓吹一夫一妻制，與大越的原有文化相違背", "exp": "越南文化深受中國文化影響，強調祭祖、祀孔的重要性，但天主教卻強調不可崇拜偶像；此外，越南與中國一樣存有階級封建思維，重視綱常倫理，男子多能三妻四妾，女子地位相對低落，不符合天主教教義的平等思想。", "rubric": "<div class='rl'><b>完全給分</b>寫出「禁止信徒崇拜祖先、規定一夫一妻制。天主教不允許信徒崇拜偶像，故而信徒也不能崇拜祖先牌位，且鼓吹一夫一妻制，與大越的原有文化相違背」等相關概念</div><div class='rl'><b>部分給分</b>僅寫出教義，未寫出衝突內容</div><div class='rl'><b>不給分</b>填寫非上述內容或未作答</div>", "fields": ["教義規定", "衝突原因"], "figs": []}], "key": "4_88"}, {"sec": "四、混合題", "n": "89", "stem": "根據澳門《中國叢報》記載，18 世紀朝鮮天主教徒尹持忠（Thomas Yin）的母親在臨死前，懇求孩子們在她的葬禮上不要舉行迷信儀式。然而，前來參加葬禮的親戚們要求擺放祖宗牌位。當尹持忠回答已將牌位燒毀時，親戚們極為憤怒。尹持忠對其表示：「我們是天主教教徒，我們的母親也是一名天主教教徒，我們的宗教禁止我們向祖先進行迷信的崇拜。根據母親的命令，我們燒毀了牌位，我們不能再把祂豎立起來。我們寧死也不改變我們的決定。」親戚們立即以不孝罪把兩兄弟押送至總督面前。總督本就與尹家有仇，便起草了一份報告給國王，國王勸他們放棄宗教信仰，但遭拒絕。1791 年 12 月 7 日，在尹持忠及其兄弟拒不屈服下，二人皆被判刑處死，此為朝鮮第一宗殉教案件。請問：", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "尹持忠教案的發生原因，最適合用下列哪項敘述來詮釋？", "opts": ["朝鮮王國行嚴刑峻法的傳統", "異族通婚與地方社會的扞格", "西方宗教與儒家傳統的衝突", "兩班階級維護其地位的決心。"], "optImg": false, "ans": 2, "exp": "尹氏兄弟拒絕設置祖先牌位、拒行祭祖禮，是天主教教義與儒家倫理之間的直接衝突。朝鮮社會視祭祖為維繫家族秩序的基本義務，因此違禮被視為「不孝」。這起案件的導火線，正是西方宗教教義與儒家禮俗相互牴觸所造成的社會緊張，而非司法嚴刑、族群問題或階級自保，故選(Ｃ)。", "figs": [], "small": false}, {"type": "choicetext", "label": "(２)", "q": "在教案發生後，朝鮮當局可能採取什麼對策以禁止天主教傳播？（請勾選一項）並寫出原因。（45 字內）", "opts": ["終止當下與西方國家的貿易", "限制傳教士只能在宮中講學", "查禁自中國傳入的西洋書籍"], "ansIdx": 2, "ans": "ˇ 查禁自中國傳入的西洋書籍<br>原因：天主教在朝鮮主要透過漢譯西洋書籍傳入，故藉查禁防堵信徒取得教義來源，以減少擴散機會", "exp": "朝鮮天主教主要經由自中國傳入的漢譯西洋書籍擴散，政府因祭祖爭議加劇社會衝突，遂以查禁書籍的方式切斷教義來源，期望從根本阻止天主教在民間流傳。", "rubric": "<div class='rl'><b>完全給分</b>2-1 正確寫出 A、B 兩項答案：<br>A 正確勾選「查禁自中國傳入的西洋書籍」<br>B 寫出「天主教在朝鮮主要透過漢譯西洋書籍傳入，故藉查禁防堵信徒取得教義來源，以減少擴散機會」等類似概念</div><div class='rl'><b>部分給分</b>1-1 A 勾選正確，但 B 的答案不完整，例如沒有寫出「漢譯西洋書籍」<br>1-2 A 勾選正確，但 B 回答錯誤或未做答</div><div class='rl'><b>不給分</b>0-1 A 勾選錯誤，則整題不予計分<br>0-2 填寫非上述內容或未作答</div>", "reason": "原因", "figs": [], "fields": [], "optImg": false}], "key": "4_89"}, {"sec": "四、混合題", "n": "90", "stem": "下列資料論述了 19 世紀的中英關係：<br>西方國家的迅速崛起之時，也正是中國王朝腐朽的當下，這無疑地為英國開啟了一扇大門，原本英國試圖謀求正常管道，可惜它的欲望遭到了中國王朝的無情阻礙。事實上，在鴉片戰爭之前，中國的對外貿易仍是出超的局面，英國人冒著風險走私鴉片，主要就是為了扭轉逆差的狀況。或許，戰爭的導火線是中國激進官員的禁煙運動，這的確讓英國商人損失慘重，而迫使他們要求祖國有所行動，但根本原因是英國想要中國成為它的原料產地與商品市場，而中國王朝的衰弱只是促使戰爭發生的另一要素。", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "資料中提到的「無情阻礙」指的是什麼？", "opts": ["禁煙政策", "排外運動", "朝貢體系", "利瑪竇規矩。"], "optImg": false, "ans": 2, "exp": "資料論述的是鴉片戰爭前的中英關係，當時英國歷經工業革命，並取得印度，試圖進一步發展中國市場，但中國在朝貢體系下，不可能同意與英國建立正常的貿易關係，以至於僅開放廣州一通商口岸，並有嚴格的公行制度，這些限制使英國欲打開中國市場的企圖受到阻礙。故選(Ｃ)。", "figs": [], "small": false}, {"type": "text", "label": "(２)", "q": "根據資料的觀點，鴉片戰爭不能避免的理由是什麼？", "ans": "因為英國想要中國成為原料產地與商品市場，但中國不開放", "exp": "資料提到鴉片戰爭的導火線是中國禁煙導致英商的損失，但實則是因為英國想要中國成為它的原料產地與商品市場，而英國曾試圖透過正常管道，但未能達到目的，因此研判資料認為戰爭是難以避免的。", "rubric": "<div class='rl'><b>完全給分</b>必須提到「英國想要中國成為原料產地與商品市場，但中國不開放」，或意思接近之答案</div><div class='rl'><b>部分給分</b>回答不完整，比如「中國不開放市場」、「英國不滿意，想要更多」之類似答案</div><div class='rl'><b>不給分</b>填答非上述內容或未作答</div>", "fields": [], "figs": []}], "key": "4_90"}, {"sec": "四、混合題", "n": "91", "stem": "請閱讀以下資料，並回答問題：<br>「他」告訴孫文，國民黨在政治上、組織上、理論上，都不算是一個政黨，在其建議下，孫文同意決心改組國民黨；也因此在 1924 年國民黨第一次代表大會的黨綱、黨章，便出自於「他」之手。同時，孫文在陳炯明叛變後，理解到若無軍隊的支持，即無法落實革命的夢想，因而在廣州珠江成立籌備委員會，希望開辦真正的軍事教育，而軍事教育的武器軍費，也是「他」聯繫由「某國」運送而來。請問：", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "文中的「他」是誰？", "opts": ["陳獨秀", "鮑羅廷", "蔣中正", "張學良。"], "optImg": false, "ans": 1, "exp": "聯俄容共期間，俄共代表鮑羅廷來華協助孫文改造中國國民黨，制定黨章、黨綱，發展基層組織；並協助成立黃埔軍校，建立「黨軍」，蔣中正為首任校長。", "figs": [], "small": false}, {"type": "text", "label": "(２)", "q": "文中的「某國」是應該是指哪一個國家？", "ans": "蘇聯", "exp": "在「聯俄容共」期間，鮑羅廷來華協助孫文改造國民黨，並協助成立黃埔軍校，鮑羅廷並負責聯繫蘇聯政府派軍事顧問團及武器支持黃埔軍校。", "rubric": "<div class='rl'><b>完全給分</b>回答「蘇聯」</div><div class='rl'><b>部分給分</b>回答「俄國」、「蘇俄」</div><div class='rl'><b>不給分</b>填寫非上述內容或未做答</div>", "fields": [], "figs": []}], "key": "4_91"}, {"sec": "四、混合題", "n": "92", "stem": "在這名商人日記中，記錄他某年某月的某個早上搭成功號（Success）從澳門出發，目的地是寧波港。他帶了一份以中文書寫的正式請願書要呈給皇帝。商人除了請求皇帝調查廣州「戶部」，請願書還請求允許讓該國商人到寧波經商，因為寧波較靠近茶葉與絲織品的生產重鎮，而且較接近北方氣候，該國毛織品在那裡的銷路或許會比在亞熱帶的廣州來得好。但廣州官員不想讓其他港口分一杯羹，而且清廷也對往南運送至廣州的各種貨物課徵陸上運輸稅，從中得到穩定的收入，如果這項貿易在較為便利的地方進行，這筆收入就會跟著流失。某月下旬抵達寧波時，港口官員告訴商人不准把船停在那裡。商人只得請求官員至少代為將請願書轉呈北京，但官員不願收下請願書，並要他返航廣州，但是他無法照辦，因為那個季節的風向沒辦法調頭南航。", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "請問這名商人的活動最有可能在何時？", "opts": ["18 世紀上半的 3 月", "18 世紀下半的 6 月", "19 世紀上半的 3 月", "19 世紀下半的 6 月。"], "optImg": false, "ans": 1, "exp": "從題文可看出中國主要通商口岸仍為廣州，故早於鴉片戰爭之前，而從澳門往寧波為北上，顯示他是順西南季風北上，故選 18 世紀下半西南季風吹拂的 6 月。", "figs": [], "small": false}, {"type": "text", "label": "(２)", "q": "請問這名商人最有可能來自何處？（請寫出國家名稱）", "ans": "英國", "exp": "英國從中國進口茶、絲綢，卻苦無貨物銷至中國，除了毛織品，但中國需求也不大，故改走私鴉片。", "rubric": "", "fields": [], "figs": []}], "key": "4_92"}, {"sec": "四、混合題", "n": "93", "stem": "請閱讀以下資料後，回答下列問題：<br>明治政府在推行維新的某政策時，中下級武士被列入士族，並且是士族階級中占大多數者。當時，政府規劃支付俸祿給士族階級，但它卻占政府財政收入的 25％以上，負擔相當沉重，後來政府決定提供 30 年期的公債，企圖一次性地解決問題。許多士族取得公債後，將債券進行各種領域的投資，但多因為經營不善而失敗，窮困的士族面對經濟困境，生活愈來愈艱難，對政府的不滿也逐漸上升。1877 年，西鄉隆盛在地方士族的支持下發動大規模的武裝叛變，政府派兵鎮壓，歷時 8 個月，以政府軍勝利而告終。【註：士族是由舊武士集團的轉化而來，明治維新後，日本政府採取四民平等政策，廢止大名、武士階級，創設華族、士族。士族具有貴族身分，但沒有爵位，身分較華族低。】", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "資料中提到的「某政策」是指什麼？", "opts": ["發展工商產業", "減少政府支出", "進行軍事改革", "消除社會階級。"], "optImg": false, "ans": 1, "exp": "明治政府在支付士族俸祿時，發現其占政府財政收入的 25 ％以上，導致財政負擔過重。為了減少支出，政府決定提供 30 年期公債以一次性解決問題，而非持續支付俸祿。這一政策的主要目的是減輕政府財政壓力，故答案選(Ｂ)。(Ａ)資料提到的是政府如何解決支付士族俸祿的財政問題，而不是著重於工商產業的發展。(Ｃ)資料中的政策是針對士族俸祿的支付問題，與軍事改革無直接關聯。(Ｄ)資料中的重點是政府的財政政策，而非階級制度的變革。", "figs": [], "small": false}, {"type": "text", "label": "(２)", "q": "分析資料，其主旨在揭示明治維新造成了什麼問題？", "ans": "改革影響了舊（傳統）勢力的利益，導致其反撲", "exp": "武士本為舊時代的上層階級，但改革卻使他們的生活陷入困頓，地位不保，因此走上暴動，顯示革新與傳統的衝突。", "rubric": "<div class='rl'><b>完全給分</b>寫出「傳統階級因權利受損，生活困頓而進行對統治階層的反撲」等相近意思之答案，需明確表示問題的因果關係</div><div class='rl'><b>部分給分</b>僅寫出武裝叛變的原因或結果，未能表示前後因果關係者</div><div class='rl'><b>不給分</b>填寫非上述內容或未作答</div>", "fields": [], "figs": []}], "key": "4_93"}, {"sec": "四、混合題", "n": "94", "stem": "清末以來，中西文化的交流和碰撞帶來了政治、經濟、文化思想等各層面的深刻轉變。歷史學者認為：「任何文化的變遷可以分為『外在物質』、『中間理論與制度』、『內部心態』三個層次構成的有機體。當兩種文化接觸時，最先被接受的通常是外在物質層面，經過時間積累後，逐步深入到中間理論與制度，最終觸及核心的內部心態層面。」在清末民初的改革歷程中，這種理論有著明顯的表現。請問：", "figs": [], "small": false, "subs": [{"type": "text", "label": "(１)", "q": "清末民初在中西文化交流的背景下，改革歷程逐層展開，清末哪一改革運動主要反映了「外在的物質層面」的吸收？哪一場戰爭的爆發促使了「中間理論與制度」的改革和發展？", "ans": "外在的物質層面：自強運動（或稱洋務運動）<br>中間理論與制度：甲午戰爭", "exp": "自強運動旨在引進西方的軍事技術、工業設備和交通工具，例如：建立船政局、創辦工廠、建設鐵路等，主要集中在物質層面的模仿與吸收。甲午戰爭的失敗暴露了清政府的制度性弊端，促使清朝統治者開始推動中間層面的改革，例如：戊戌變法、庚子後新政和立憲運動等，嘗試進行制度和理論層面的革新。", "rubric": "<div class='rl'><b>完全給分</b>2-1 完整寫出 A、B 兩項答案：<br>A 外在的物質層面的欄位寫出「自強運動」或「洋務運動」<br>B 中間理論與制度的欄位寫出「甲午戰爭」</div><div class='rl'><b>部分給分</b>僅寫上述 A、B 其中一項答案</div><div class='rl'><b>不給分</b>0-1 欄位順序寫錯<br>0-2 填寫非上述內容或未作答</div>", "fields": ["外在的物質層面", "中間理論與制度"], "figs": []}, {"type": "mc", "label": "(２)", "q": "清末民初，各種改革運動和思想變革層出不窮，不同層次的影響依次展現。下列哪一選項屬於「內部心態層次」的範圍，反映出當時人們思想觀念的深刻變革？", "opts": ["戊戌變法", "立憲運動", "庚子後新政", "新文化運動。"], "optImg": false, "ans": 3, "exp": "「內部心態層次」指的是思想觀念、價值體系以及文化心理的深層改變，而新文化運動的核心在於提倡民主與科學、反對封建思想、推動白話文運動和文化啟蒙，對個人主義、平等和現代思想的倡導充分體現了思想觀念的深刻變革，故答案選(Ｄ)。(Ａ)(Ｂ)(Ｃ)皆屬於「中間理論與制度」層次。", "figs": [], "small": false}], "key": "4_94"}, {"sec": "四、混合題", "n": "95", "stem": "「諭眾西洋人，自今以後，若不遵利瑪竇規矩，斷不准在中國住，必逐回去。若教化王因此不准爾等傳教，爾等既是出家人，就在中國住著修道。教化王若再怪你們遵利瑪竇，不依教化王的話，教你們回西洋去，朕不教你們回去。倘教化王聽了多羅的話，說你們不遵教化王的話，得罪天主，必定教你們回去，那時朕自然有話說。說你們在中國年久，服朕水土，就如中國人一樣，必不肯打發回去。教化王若說你們有罪，必定教你們回去，朕帶信與他說，徐日昇等在中國服朕水土，山力年久，你必定教他們回去，朕斷不肯將他們活打發回去，將西洋人頭割回去。朕如此帶信去，爾教化王萬一再說，爾等得罪天主，殺了罷。朕就將中國所有西洋人等都查出來，盡行將頭帶回西洋去。設是如此，你們的教化王也就成個教化王了。你們領過票的就如中國人一樣，爾等放心，不要害怕。領票，俟朕回鑾時，在寶塔灣同江寧府方西滿等十一人同賜票。欽此。」請根據以上的內容回答問題：", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "上文來自一位統治者的諭令，請問該統治者為何？", "opts": ["順治", "康熙", "道光", "同治。"], "optImg": false, "ans": 1, "exp": "上述諭令提及「利瑪竇規矩」之爭，可以判斷，應為康熙時期與教宗在禮儀之爭下引發的「禁教」。", "figs": [], "small": false}, {"type": "text", "label": "(２)", "q": "上文中提及的「教化王」所指為何？", "ans": "教宗（教皇、教王）", "exp": "", "rubric": "<div class='rl'><b>完全給分</b>回答「教宗或（教皇、教王）」</div><div class='rl'><b>不給分</b>填寫非上述內容或未做答</div>", "fields": [], "figs": []}], "key": "4_95"}, {"sec": "四、混合題", "n": "96", "stem": "以下兩則資料是西學傳入中國的相關文獻：<br>資料一：「他們」自萬曆末年至天啟、崇禎年間先後進入中國，中國學者如徐文定、李涼庵都和他們來往，對於各種學問有精深的研究。……中國智識界與外國智識界相接觸，晉唐的佛學為第一次，明末的曆算學便是第二次。在這種新環境之下，學界空氣當然變換。<br>資料二：李約瑟曾如此評論：「在中國開始其工作時……『他們』曾將望遠鏡傳至中國，而對日心說則經猶豫後隱而不宣。……在這早期中，尤其在伽利略被判罪前，諸人並非一致相信哥白尼學說，甚為明顯。……我們的結論是，其貢獻有好有壞。」", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "請問資料一、資料二中的「他們」應是何種身分？", "opts": ["拓展海外信仰的新教信徒", "進行海外貿易的歐洲商人", "具有西方科學素養的學者", "肩負宣教重任的天主教傳教士。"], "optImg": false, "ans": 3, "exp": "明末天主教耶穌會傳教士進入中國宣教，並帶入西方科學新知，兩則資料都肯定傳教士對西學引入的貢獻。", "figs": [], "small": false}, {"type": "choicetext", "label": "(２)", "q": "哪一則資料認為對於外來者引進的「並非」是最新的科學新知？並請從該資料中找出其理由。", "opts": ["資料一", "資料二"], "ansIdx": 1, "ans": "ˇ 資料二<br>理由：他們曾將望遠鏡傳至中國，而對日心說則經猶豫後隱而不宣", "exp": "資料二中「他們曾將望遠鏡傳至中國，而對日心說則經猶豫後隱而不宣」，認為傳教士礙於傳統宗教的宇宙觀，引入的不是最新的學說。", "rubric": "<div class='rl'><b>完全給分</b>完整回答 A、B 以下兩項答案：<br>A 勾選「資料二」<br>B 完整寫出「他們曾將望遠鏡傳至中國，而對日心說則經猶豫後隱而不宣」</div><div class='rl'><b>部分給分</b>勾選正確，但理由部分論述不完整或未能寫出</div><div class='rl'><b>不給分</b>填寫非上述內容或未作答</div>", "reason": "理由", "figs": [], "fields": [], "optImg": false}], "key": "4_96"}, {"sec": "四、混合題", "n": "97", "stem": "19 世紀上半葉，中國長期奉行嚴格的對外貿易制度，僅允許少數外國商人透過特定港口進行交易，並且規定必須以白銀支付茶葉、絲綢與瓷器等高價商品。為了扭轉劣勢，一個來自西方的海上強國，大量種植並輸出某種商品，使中國的貨幣體系出現緊縮，物價波動與財政困難接踵而來。朝廷高層對此日益警惕，派出官員前往沿海執行查禁政策，此舉激怒外國商人與其母國政府，雙方外交談判破裂，戰爭因而爆發。戰後，外國人在中國犯法無法由中國官員審判，這一結果不僅削弱了中央政府的威望，還改變了沿海地區的社會結構，使外國勢力逐步滲入中國的政治、經濟與文化生活，進一步加劇了內部的不穩定局勢。請問：", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "依據題文的內容來看，西方的海上強國面臨的困境為何？", "opts": ["無法取得茶葉、瓷器", "出現嚴重的貿易逆差", "未能有效掌控殖民地", "被強迫開放通商口岸。"], "optImg": false, "ans": 1, "exp": "依據題文的內容可知，其指的是英國試圖用白銀大量購買中國商品，希望購買中國的茶葉、絲綢與瓷器等高價商品，但中國對英國的商品沒有太多需求，因此長期貿易下來，英國對中國的貿易出現嚴重的貿易逆差，故選(Ｂ)。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "此西方海上強國將某商品輸入後，對沿海地區的社會經濟造成下列何種影響？", "opts": ["貨幣大增，國內物價不斷飆漲", "銅錢外流，國內貨幣嚴重短缺", "銀貴錢賤，導致人民賦稅增加", "糧食短缺，人民面臨無糧可食。"], "optImg": false, "ans": 2, "exp": "英國將鴉片輸入中國後，導致中國的白銀外流，但清代人民納稅需繳納銀兩，隨著白銀大量外流，便易形成銀貴錢賤的經濟景況，人民必須將物資拿到市場上換成白銀，賦稅負擔因而不斷增加，故選(Ｃ)。", "figs": [], "small": false}, {"type": "choicetext", "label": "(３)", "q": "由題文的內容來判斷，雙方爆發戰爭後帶來的影響為何？（請勾選一項）試說明判斷原因。（30 字內）", "opts": ["被迫擔負天價鉅額賠款", "外人可在通商口岸製造", "外人勢力深入中國內地", "喪失司法及關稅自主權"], "ansIdx": 3, "ans": "ˇ 喪失司法及關稅自主權<br>判斷原因：外國人在中國犯法無法由中國官員審判，可知喪失領事裁判權", "exp": "鴉片戰爭結束後，中國被迫與英國簽下《南京條約》，喪失了領事裁判權及關稅自主權。", "rubric": "<div class='rl'><b>全部給分</b>2-1 正確寫出 A、B 兩項答案：<br>A 正確勾選「喪失司法及關稅自主權」<br>B 寫出「外國人在中國犯法無法由中國官員審判，可知喪失領事裁判權」等類似概念</div><div class='rl'><b>部分給分</b>1-1 A 勾選正確，但 B 僅寫出「中國官員無法審判外國人」、「中國官員無法進行司法審判」<br>1-2 A 勾選正確，但 B 回答錯誤或未做答</div><div class='rl'><b>不給分</b>0-1 A 勾選錯誤，則整題不予計分<br>0-2 填寫非上述內容或未作答</div>", "reason": "判斷原因", "figs": [], "fields": [], "optImg": false}], "key": "4_97"}, {"sec": "四、混合題", "n": "98", "stem": "19 世紀末，位於東北亞的一個國家長期奉行儒家為本的封建體制，政治與社會結構相對封閉。然而，隨著鄰近地區的近代化進程加快，國內部分知識分子開始主張引進西方的軍事技術、教育制度與產業改革，他們認為只有迅速改革，才能擺脫列強的威脅，並在國際體系中維持自主地位。然而，此舉引發朝廷中的保守派官僚與士大夫階層強烈反對，他們擔心改革會破壞傳統秩序、削弱君主的權威，並引入外來思想而動搖國家根基。兩派衝突不斷升級，由於國內兩股勢力無法取得共識，該國被迫尋求外援，而鄰近的兩個亞洲國家分別介入，支持不同的政治勢力，導致政壇動盪不安，隨著矛盾加劇，兩國的軍事力量在該國境內發生直接衝突，戰火迅速擴大。戰爭的結果使區域平衡關係發生重大變化，一個傳統大國自此走向衰落，而另一個新興勢力則進一步擴張影響力。", "figs": [], "small": false, "subs": [{"type": "mc", "label": "(１)", "q": "依據上述的內容來看，題文中該國改革派的主要目標是什麼？", "opts": ["維持傳統制度，並與鄰國交好", "學習西方體制，追求國家富強", "脫離外國影響、宣布閉關鎖國", "依附鄰近國家，失去國家主權。"], "optImg": false, "ans": 1, "exp": "由題文提及的內容可知，此應該是朝鮮面對西力衝擊下，朝中的開化派試圖學習日本的明治維新，遣使到日本學習其政治、軍事以及教育制度，透過學習西方文化制度，達到富國強兵的目的。", "figs": [], "small": false}, {"type": "mc", "label": "(２)", "q": "由題文的內容可看到，當時有兩個鄰近國家捲入此國的政爭中，這兩個鄰近國家應該是下列何者？", "opts": ["日本、朝鮮", "日本、中國", "中國、朝鮮", "越南、中國。"], "optImg": false, "ans": 1, "exp": "朝鮮在面對西力衝擊下，試圖學習日本推動西化改革，但因為東學黨農民起義引來中國及日本出兵朝鮮，並試圖干預其內政，最終引爆中日間的甲午戰爭，故兩個鄰近國家指的應該是中國及日本。", "figs": [], "small": false}, {"type": "choicetext", "label": "(３)", "q": "由題文提及的內容來推論，在此國內爆發的戰爭會帶來以下何種影響？（請勾選一項）試說明判斷原因。（30 字內）", "opts": ["開始推行立憲運動", "國際地位大為提升", "獲得政治的自主權", "開始學習西化變革"], "ansIdx": 2, "ans": "ˇ 獲得政治的自主權<br>判斷原因：清廷在甲午戰爭戰敗後，被迫簽下《馬關條約》，承認朝鮮獲得自主權利", "exp": "中日甲午戰爭爆發後，清廷戰敗被迫簽訂《馬關條約》，中國除被迫割讓臺灣及澎湖，並承認朝鮮獲得自主權利。", "rubric": "<div class='rl'><b>完全給分</b>2-1 正確寫出 A、B 兩項答案：<br>A 正確勾選「獲得政治的自主權」<br>B 寫出「清廷在甲午戰爭戰敗後，被迫簽下《馬關條約》，承認朝鮮獲得 const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const img=(src,cap)=>`<div class="fig"><img data-src="${src}" alt="${esc(cap||"附圖")}">${cap?`<div class="cap">${cap}</div>`:""}</div>`;
const figs=(arr,small)=>arr&&arr.length?`<div class="figs${small?" small":""}">${arr.map(f=>img(f.src,f.cap)).join("")}</div>`:"";
const fixImgs=root=>root.querySelectorAll("img[data-src]").forEach(i=>{i.src=IMGS[i.dataset.src];i.removeAttribute("data-src");i.loading="lazy"});

function subId(it,j){return it.key+"-"+j}
function status(id,s){ // returns 'ok'|'bad'|'part'|null
  const r=ST[id]; if(!r) return null;
  if(s.type==="mc") return r.pick==null?null:(r.pick===s.ans?"ok":"bad");
  if(s.type==="ms") return r.done?(JSON.stringify([...(r.sel||[])].sort())===JSON.stringify(s.ans)?"ok":"bad"):null;
  return r.self||null;
}

function render(){
  const main=document.getElementById("main");
  let html="", lastSec="", shown=0;
  DATA.forEach(it=>{
    const subs=it.subs.map((s,j)=>({s,j,id:subId(it,j)}));
    if(FILTER==="wrong"){ if(!subs.some(x=>["bad","part"].includes(status(x.id,x.s)))) return; }
    else if(FILTER==="todo"){ if(!subs.some(x=>!status(x.id,x.s))) return; }
    else if(FILTER!=="all" && it.sec!==FILTER) return;
    shown++;
    if(it.sec!==lastSec){html+=`<div class="sec">${it.sec}</div>`;lastSec=it.sec}
    const single=it.subs.length===1&&!it.stem;
    html+=`<div class="card${single?" single":""}" id="q${it.key}">`;
    if(!single) html+=`<div class="stem"><span class="qn">${it.n}</span>${it.stem}</div>${figs(it.figs,it.small)}`;
    subs.forEach(({s,j,id})=>{ html+=renderSub(it,s,id,single) });
    html+=`</div>`;
  });
  main.innerHTML=shown?html:`<div class="empty">${FILTER==="wrong"?"目前沒有錯題 🎉":"這個分類沒有題目"}</div>`;
  fixImgs(main);
  stats();
}

  const r=ST[id]||{};
  let h=`<div class="sub" data-id="${id}">`;
  const head=single?`<span class="qn">${it.n}</span>`:(s.label?`<span class="lab">${s.label}</span>`:"");
  if(s.type==="mc"){
    h+=`<div>${head}${s.q}</div>${figs(s.figs,s.small)}`;
    const answered=r.pick!=null;
    h+=`<div class="opts${s.optImg?" img":""}">`;
    s.opts.forEach((o,k)=>{
      let cls="opt";
      if(answered){ if(k===s.ans) cls+=" right"; else if(k===r.pick) cls+=" wrong"; else cls+=" dim"; }
      const body=s.optImg?`<span class="optimg"><img data-src="${o}" alt="選項${L[k]}"></span>`:`<span>${o}</span>`;
      h+=`<button class="${cls}" data-act="pick" data-k="${k}" ${answered?"disabled":""}><span class="k">${L[k]}</span>${body}</button>`;
    });
    h+=`</div>`;
    if(answered){
      const ok=r.pick===s.ans;
      h+=`<div class="fb show ${ok?"ok":"bad"}"><div class="v">${ok?"答對了！":"答錯了"}　正確答案：(${L[s.ans]})</div>${s.exp?`<div class="ex"><b>解析</b>　${s.exp}</div>`:""}</div>`;
      h+=`<div class="row"><button class="retry" data-act="reset">重新作答</button></div>`;
    }
  } else if(s.type==="ms"){
    h+=`<div>${head}<span class="mtag">多選</span>${s.q}</div>${figs(s.figs)}`;
    const sel=r.sel||[], done=!!r.done;
    h+=`<div class="opts">`;
    s.opts.forEach((o,k)=>{
      const inA=s.ans.includes(k), isS=sel.includes(k);
      let cls="opt";
      if(done){ if(inA&&isS) cls+=" right"; else if(isS) cls+=" wrong"; else if(inA) cls+=" miss"; else cls+=" dim"; }
      else if(isS) cls+=" sel";
      h+=`<button class="${cls}" data-act="toggle" data-k="${k}" ${done?"disabled":""}><span class="k sq">${L[k]}</span><span>${o}</span></button>`;
    });
    h+=`</div>`;
    if(!done){
      h+=`<div class="row"><button class="btn primary" data-act="submit" ${sel.length?"":"disabled"}>送出答案</button><span class="note">可選多個選項</span></div>`;
    } else {
      const ok=JSON.stringify([...sel].sort())===JSON.stringify(s.ans);
      h+=`<div class="fb show ${ok?"ok":"bad"}"><div class="v">${ok?"答對了！":"答錯了"}　正確答案：${s.ans.map(k=>"("+L[k]+")").join("")}</div>${s.exp?`<div class="ex"><b>解析</b>　${s.exp}</div>`:""}</div>`;
      h+=`<div class="row"><button class="retry" data-act="reset">重新作答</button></div>`;
    }
  } else {
    h+=`<div>${head}${s.q||""}</div>${figs(s.figs)}`;
    const shown=!!r.shown;
    if(s.type==="choicetext"){
      h+=`<div class="choices">`+s.opts.map((o,k)=>{
        let c="choice"; if(r.c===k) c+=" sel";
        if(shown&&s.ansIdx!=null){ if(k===s.ansIdx) c+=" right"; else if(r.c===k) c+=" wrong"; }
        const body=s.optImg?`<img data-src="${o}" alt="選項${k+1}">`:`□ ${o}`;
        return `<button class="${c}${s.optImg?" imgc":""}" data-act="choose" data-k="${k}" ${shown?"disabled":""}>${body}</button>`;
      }).join("")+`</div>`;
      if(s.fields&&s.fields.length){ s.fields.forEach((f,k)=>{h+=`<div class="field"><label>${f}</label><textarea data-f="${k}" rows="2">${esc((r.t||[])[k]||"")}</textarea></div>`}); }
      else h+=`<div class="field"><label>${s.reason}</label><textarea data-f="0" rows="2" placeholder="寫下你的說明…">${esc((r.t||[])[0]||"")}</textarea></div>`;
    } else if(s.fields&&s.fields.length){
      s.fields.forEach((f,k)=>{h+=`<div class="field"><label>${f}</label><textarea data-f="${k}" rows="1">${esc((r.t||[])[k]||"")}</textarea></div>`});
    } else {
      h+=`<div class="field" style="display:block"><textarea data-f="0" rows="2" placeholder="寫下你的答案…">${esc((r.t||[])[0]||"")}</textarea></div>`;
    }
    if(!shown){
      h+=`<div class="row"><button class="btn primary" data-act="show">看答案</button></div>`;
    } else {
      h+=`<div class="fb show neutral"><div class="v">參考答案</div><div class="ansbox">${s.ans}</div>${s.exp?`<div class="ex"><b>解析</b>　${s.exp}</div>`:""}${s.rubric?`<div class="rubric"><b style="color:var(--muted)">評分原則</b>${s.rubric}</div>`:""}</div>`;
      const sf=r.self;
      h+=`<div class="self">自評：
        <button class="btn ${sf==="ok"?"on-ok":""}" data-act="self" data-v="ok">完全答對</button>
        <button class="btn ${sf==="part"?"on-part":""}" data-act="self" data-v="part">部分答對</button>
        <button class="btn ${sf==="bad"?"on-bad":""}" data-act="self" data-v="bad">答錯</button>
        <button class="retry" data-act="reset">重新作答</button></div>`;
    }
  }
  return h+`</div>`;
}

function findSub(id){const [n,j]=id.split("-");const it=DATA.find(x=>x.key===n);return {it,s:it.subs[+j]}}

function refreshSub(el){
  const id=el.dataset.id;const {it,s}=findSub(id);
  const single=it.subs.length===1&&!it.stem;
  const tmp=document.createElement("div");tmp.innerHTML=renderSub(it,s,id,single);
  const n=tmp.firstElementChild;fixImgs(n);el.replaceWith(n);stats();
}

document.addEventListener("click",e=>{
  const im=e.target.closest(".fig img,.expfig img,.ansbox img");
  if(im){const lb=document.getElementById("lb");lb.querySelector("img").src=im.src;lb.classList.add("on");return}
  if(e.target.closest("#lb")){document.getElementById("lb").classList.remove("on");return}
  const b=e.target.closest("[data-act]"); if(!b) return;
  const el=b.closest(".sub"); const id=el.dataset.id; const {s}=findSub(id);
  ST[id]=ST[id]||{};
  const act=b.dataset.act;
  if(act==="pick"){ST[id].pick=+b.dataset.k}
  else if(act==="choose"){ST[id].c=+b.dataset.k}
  else if(act==="toggle"){const k=+b.dataset.k;const a=ST[id].sel||[];ST[id].sel=a.includes(k)?a.filter(x=>x!==k):[...a,k]}
  else if(act==="submit"){ST[id].done=true}
  else if(act==="show"){ST[id].shown=true}
  else if(act==="self"){ST[id].self=b.dataset.v}
  else if(act==="reset"){delete ST[id]}
  save(); refreshSub(el);
});
document.addEventListener("input",e=>{
  const t=e.target; if(!t.matches("textarea[data-f]")) return;
  const id=t.closest(".sub").dataset.id; ST[id]=ST[id]||{}; ST[id].t=ST[id].t||[];
  ST[id].t[+t.dataset.f]=t.value; save();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("lb").classList.remove("on")});

function stats(){
  let total=0,done=0,ok=0,wrong=0;
  DATA.forEach(it=>it.subs.forEach((s,j)=>{total++;const st=status(subId(it,j),s);if(st){done++;if(st==="ok")ok++;else wrong++}}));
  sTotal.textContent=total;sDone.textContent=done;sOk.textContent=ok;
  sPct.textContent=done?Math.round(ok/done*100)+"%":"—";
  pbar.style.width=(done/total*100)+"%";
  const wb=document.querySelector('nav [data-f="wrong"]'); if(wb) wb.textContent=`錯題 (${wrong})`;
}

function buildNav(){
  SECS=[...new Set(DATA.map(x=>x.sec))];
  const items=[["all","全部"],...SECS.map(s=>[s,s.replace(/^.、/,"")]),["todo","未作答"],["wrong","錯題"]];
  nav.innerHTML=items.map(([f,t])=>`<button data-f="${f}" class="${f===FILTER?"on":""}">${t}</button>`).join("")+
    `<span class="tools"><button class="btn" id="resetAll">全部重來</button></span>`;
  nav.onclick=e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.id==="resetAll"){ if(b.dataset.c){ST={};save();delete b.dataset.c;b.textContent="全部重來";render();} else {b.dataset.c=1;b.textContent="確定清除？";setTimeout(()=>{delete b.dataset.c;b.textContent="全部重來"},3000)} return;}
    FILTER=b.dataset.f; nav.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on",x===b)); render(); window.scrollTo({top:0});
  };
}

DATA=EMBED;buildNav();render();
</script>
</body>
